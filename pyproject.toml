[project]
name = "ansible-devcontainer"
version = "0.1.0"
description = "Ansible DevContainer tooling and automation stack."
readme = "README.md"
requires-python = ">=3.12"
# Runtime toolchain shipped in the devcontainer images. Development and
# test tooling lives in [dependency-groups]; 'uv sync' installs dev by
# default in a workspace, the images stay lean.
#
# ansible-core, not the ansible package: the images bake in only the
# collections pinned in devcontainers/ansible/collections.txt, not the 92
# the package bundles. The last three entries are what community.docker
# imports at runtime; its meta/ee-requirements.txt lists them with urllib3
# (above) and PyYAML (from ansible-core). paramiko also backs ansible-core's
# paramiko_ssh connection plugin. The other collections declare no Python
# requirements.
dependencies = [
  "ansible-core>=2.21.5,<2.22.0",
  "ansible-lint>=25.0.0",
  "ansible-navigator>=3.5.0",
  "yamllint>=1.35.0",
  "jmespath>=1.0.1",
  "dnspython>=2.6.0",
  "passlib>=1.7.4",
  "pre-commit>=3.6.0",
  "detect-secrets>=1.4.0",
  "urllib3>=2.7.0",
  "docker>=7.1.0",
  "paramiko>=3.5.0",
  "requests>=2.32.4",
]

[dependency-groups]
dev = [
  "molecule>=26.6.0,<27.0.0",
  "molecule-plugins[docker]>=26.7.8,<27.0.0",
  "pytest>=9.0.3",
  "pytest-ansible>=26.10.0,<26.11.0",
  "pytest-cov>=4.1.0",
  "pytest-testinfra>=10.1.0",
  "black>=26.3.1",
  "ruff>=0.15.21",
  "mypy>=2.3.0",
  "ipython>=8.20.0",
]

# Tools quality.yml and sbom-verification.yml install at CI time. They live
# here rather than as bare `pip install <name>` in the workflows so they are
# resolved through uv.lock like everything else: pinned, hash-verifiable and
# refreshed by Renovate. Unpinned CI installs are how ansible drifted to a
# version the lock did not have and broke develop on 2026-08-10.
ci-quality = [
  "radon>=6.0.1",
  "vulture>=2.14",
  "bandit>=1.8.6",
  "ntia-conformance-checker>=3.2.0",
]
aws = [
  "boto3>=1.43.47",
  "botocore>=1.43.47",
]
# The tools every non-Ansible image bakes in (devcontainer-base, terraform,
# golang, latex), installed hash-verified from
# requirements-devcontainer-tools.txt. Exported on its own so those images
# never pull the Ansible stack. The ansible images get the same versions
# from requirements-ansible.txt: one lock, one resolution.
devcontainer-tools = [
  "pre-commit>=3.6.0",
  "yamllint>=1.35.0",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--verbose",
  "--tb=short",
  "--strict-markers",
  "-p no:pytest-ansible",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["roles", "playbooks", "scripts"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/site-packages/*",
  ".venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
