[project]
name = "ansible-devcontainer"
version = "0.1.0"
description = "Ansible DevContainer tooling and automation stack."
readme = "README.md"
requires-python = ">=3.12"
# Runtime toolchain shipped in the devcontainer images. Development and
# test tooling lives in [dependency-groups]; 'uv sync' installs dev by
# default in a workspace, the images stay lean.
dependencies = [
  "ansible>=14.1.0,<15.0.0",
  "ansible-lint>=25.0.0",
  "ansible-navigator>=3.5.0",
  "yamllint>=1.35.0",
  "jmespath>=1.0.1",
  "netaddr>=1.2.1",
  "dnspython>=2.6.0",
  "passlib>=1.7.4",
  "pre-commit>=3.6.0",
  "detect-secrets>=1.4.0",
  "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
  "molecule>=26.6.0,<27.0.0",
  "molecule-plugins[docker]>=25.8.12,<26.0.0",
  "pytest>=9.0.3",
  "pytest-ansible>=26.6.0,<26.7.0",
  "pytest-cov>=4.1.0",
  "pytest-testinfra>=10.1.0",
  "black>=26.3.1",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "ipython>=8.20.0",
]
aws = [
  "boto3>=1.43.41",
  "botocore>=1.43.41",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--verbose",
  "--tb=short",
  "--strict-markers",
  "-p no:pytest-ansible",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["roles", "playbooks", "scripts"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/site-packages/*",
  ".venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
