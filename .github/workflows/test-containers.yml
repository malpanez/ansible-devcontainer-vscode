---
name: Container Structure Tests

on:
  # No paths filter here on purpose, on either trigger. Test Summary is built
  # to be a required check, and a required check that never appears blocks a
  # pull request forever, so the workflow must always start. Push too: GitHub
  # parks the pull_request runs of a bot-authored promotion until they are
  # approved, the push run on develop reports on the same commit, and the same
  # filter on quality.yml's push trigger deadlocked a Dockerfile-only promotion
  # (#488) until every required workflow dropped it (#489). detect-changes
  # gates the builds instead, exactly as ci.yml and sbom-verification.yml do
  # it. A change touching nothing relevant runs one cheap filter job and a
  # green summary.
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # paths-filter sets `changes` and one output per filter, never
      # `any_changed`: gating on that left every push and pull request with
      # no structure test at all. A dispatch diffs only the last commit (or
      # the branch against main), usually nothing, so it tests every stack.
      stacks: ${{ github.event_name == 'workflow_dispatch' && '["base","golang","ansible","ansible-podman","ansible-aws","terraform","terraform-aws","latex"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # Every filter lists this workflow, as ci.yml's devcontainer filter
          # lists ci.yml: a change to how the images are built or tested must
          # run the tests on every stack. Without it such a pull request came
          # back green with nothing tested.
          filters: |
            golang:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/golang/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/golang/**'
              # pre-commit and yamllint come from this uv.lock export
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/golang.yaml'
            ansible:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/ansible/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'devcontainers/base/**'
              - 'templates/pre-commit/ansible/**'
              # The ansible Dockerfiles install this uv.lock export
              - 'requirements-ansible.txt'
              # Base, which this stack is built on here, installs this one
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/ansible.yaml'
              - 'tests/container-structure/no-aws.yaml'
            terraform:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/terraform/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/terraform/**'
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/terraform.yaml'
              - 'tests/container-structure/no-aws.yaml'
            latex:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/latex/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/latex/**'
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/latex.yaml'
            base:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/base/**'
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/base.yaml'
            # Tested with ansible.yaml too: see "Resolve the stack's files".
            ansible-podman:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/ansible/Dockerfile.podman'
              # Both ansible Dockerfiles install the pinned collections
              - 'devcontainers/ansible/collections*.txt'
              - 'devcontainers/ansible/install-collections.sh'
              - 'devcontainers/scripts/**'
              - 'templates/ansible/**'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
              - 'tests/container-structure/ansible.yaml'
              - 'tests/container-structure/ansible-podman.yaml'
            # The -aws stages of the terraform and ansible Dockerfiles, tested
            # with their stack's file too: see "Resolve the stack's files".
            terraform-aws:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/terraform/**'
              - 'devcontainers/scripts/**'
              - 'templates/pre-commit/terraform/**'
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/terraform.yaml'
              - 'tests/container-structure/terraform-aws.yaml'
            ansible-aws:
              - '.github/workflows/test-containers.yml'
              - 'devcontainers/ansible/**'
              - 'devcontainers/base/**'
              - 'devcontainers/scripts/**'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
              - 'requirements-aws.txt'
              - 'requirements-devcontainer-tools.txt'
              - 'tests/container-structure/ansible.yaml'
              - 'tests/container-structure/ansible-aws.yaml'

  test-containers:
    name: Test ${{ matrix.stack }} Container
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.stacks != '[]'
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write  # publish-unit-test-result-action creates the check run
      pull-requests: write  # and comments the results on the pull request
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect-changes.outputs.stacks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # As build-containers.yml publishes: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      # Every stack is devcontainers/<stack>/Dockerfile tested with
      # <stack>.yaml, except the variants, which are a stack plus one layer:
      # ansible-podman, built from Dockerfile.podman, and the -aws images,
      # built from the stack's Dockerfile with --target <stack>-aws. The
      # stack's file holds for them unchanged (user, workdir, tools, the
      # bytecode check), so they run it and <variant>.yaml for the layer,
      # instead of a copy. terraform and ansible, built without a target
      # (their Dockerfile's last stage), also run no-aws.yaml: it fails if
      # that last stage ever became an -aws image. base_from_run marks the
      # stacks whose Dockerfile consumes BASE_IMAGE: only
      # devcontainers/ansible/Dockerfile does. Dockerfile.podman starts from
      # python:3.14-slim-trixie, and the others do not reference it at all.
      - name: Resolve the stack's files
        id: files
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          TARGET=""
          case "${STACK}" in
            ansible-podman)
              DOCKERFILE=devcontainers/ansible/Dockerfile.podman
              CONFIGS="ansible ansible-podman"
              ;;
            terraform-aws|ansible-aws)
              DOCKERFILE="devcontainers/${STACK%-aws}/Dockerfile"
              TARGET="${STACK}"
              CONFIGS="${STACK%-aws} ${STACK}"
              ;;
            terraform|ansible)
              DOCKERFILE="devcontainers/${STACK}/Dockerfile"
              CONFIGS="${STACK} no-aws"
              ;;
            *)
              DOCKERFILE="devcontainers/${STACK}/Dockerfile"
              CONFIGS="${STACK}"
              ;;
          esac
          case "${STACK}" in
            ansible|ansible-aws)
              BASE_FROM_RUN=true
              ;;
            *)
              BASE_FROM_RUN=false
              ;;
          esac
          {
            echo "dockerfile=${DOCKERFILE}"
            echo "target=${TARGET}"
            echo "configs=${CONFIGS}"
            echo "base_from_run=${BASE_FROM_RUN}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}:buildcache-publish
        run: |
          set -euo pipefail
          # Read-only use of the cache build-containers.yml publishes, so this
          # job stays off the fixed 10 GB Actions quota. Read-only also avoids
          # contending for the tag: a registry cache export replaces the
          # manifest, so two workflows writing one tag overwrite each other.
          # The packages are public, so no login and no extra permission.
          #
          # The tag must be probed. buildx aborts outright on a missing
          # cache-from ref ('failed to configure registry cache importer:
          # <ref>: not found'); it does not warn and continue.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached."
          fi

      # For the base build below, read-only and probed: see ci.yml's
      # devcontainer-build, whose steps these two are.
      - name: Resolve the base build cache
        id: base_cache
        if: steps.files.outputs.base_from_run == 'true'
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-base:buildcache-publish
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF}; building base uncached."
          fi

      # The ansible Dockerfile pins BASE_IMAGE to the devcontainer-base that
      # build-containers.yml last published, and only main publishes it. On
      # that pin these tests never saw a change to devcontainers/base/: the
      # filters ran them on such a pull request, against the base main already
      # ships, and a bug in base showed up only after publishing. Built from
      # this commit, base is what a merge would publish.
      #
      # Nothing is pushed. The base goes to an OCI layout on the runner and
      # the next step reads it as a named build context. Loading it into
      # Docker would not work: the docker-container builder setup-buildx-action
      # creates does not see the daemon's images. Same epoch and timestamp
      # rewrite as the stack, as build-base publishes it.
      - name: Build base for ${{ matrix.stack }}
        if: steps.files.outputs.base_from_run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # The repository root: the Dockerfile bind-mounts
          # requirements-devcontainer-tools.txt.
          context: .
          file: devcontainers/base/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/devcontainer-base,tar=false,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          cache-from: ${{ steps.base_cache.outputs.from }}

      - name: Build ${{ matrix.stack }} container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ steps.files.outputs.dockerfile }}
          target: ${{ steps.files.outputs.target }}
          push: false
          # Loaded like `load: true`, but with the commit-time epoch and the
          # timestamp rewrite the published images get: the stale-bytecode
          # test in tests/container-structure can only fail on an image
          # whose mtimes were rewritten.
          outputs: type=docker,rewrite-timestamp=true
          tags: test-${{ matrix.stack }}:latest
          # BASE_IMAGE names the build context below, which a FROM resolves
          # before any registry, so the stack sits on the base built in the
          # step above. A stack without base_from_run gets neither line.
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
            ${{ steps.files.outputs.base_from_run == 'true' && 'BASE_IMAGE=devcontainer-base' || '' }}
          build-contexts: |
            ${{ steps.files.outputs.base_from_run == 'true' && format('devcontainer-base=oci-layout://{0}/devcontainer-base', runner.temp) || '' }}
          cache-from: ${{ steps.rcache.outputs.from }}

      - name: Install container-structure-test
        env:
          # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
          CST_VERSION: v1.22.1
        run: |
          # Was: an unpinned `latest` binary from storage.googleapis.com,
          # installed and executed with no integrity check at all. Pin the
          # release, force HTTPS, and verify against the published
          # checksums.txt before the binary is ever made executable.
          set -euo pipefail
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
          tmp="$(mktemp -d)"
          # --retry: a 504 from GitHub releases broke builds on 2026-09-14.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${base}/container-structure-test-linux-amd64" -o "${tmp}/container-structure-test-linux-amd64"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${base}/checksums.txt" -o "${tmp}/checksums.txt"
          (cd "${tmp}" && grep " container-structure-test-linux-amd64$" checksums.txt | sha256sum -c -)
          install -m 0755 "${tmp}/container-structure-test-linux-amd64" /usr/local/bin/container-structure-test
          rm -rf "${tmp}"

      - name: Run structure tests for ${{ matrix.stack }}
        env:
          STACK: ${{ matrix.stack }}
          STACK_TESTS: ${{ steps.files.outputs.configs }}
        run: |
          set -euo pipefail
          read -r -a TEST_FILES <<< "${STACK_TESTS}"
          ARGS=()
          for TEST_FILE in "${TEST_FILES[@]}"; do
            ARGS+=(--config "tests/container-structure/${TEST_FILE}.yaml")
          done
          container-structure-test test \
            --image "test-${STACK}:latest" \
            "${ARGS[@]}" \
            --output junit \
            --test-report "test-results-${STACK}.xml"

      # The structure tests only ask podman for its version, and `podman run`
      # failed in the image for lack of pasta with all of them green. Privileged
      # because Docker's default seccomp profile stops rootless podman at
      # "cannot clone: Operation not permitted". Retried for quay.io, which the
      # script pulls from.
      - name: Run the podman smoke test
        if: matrix.stack == 'ansible-podman'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker run --rm --privileged test-ansible-podman:latest podman-smoke-test; then
              exit 0
            fi
            echo "::warning::podman smoke test attempt ${attempt} failed; retrying"
            sleep "$((attempt * 20))"
          done
          echo "::error::podman smoke test failed after 3 attempts"
          exit 1

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d  # v2.25.0
        with:
          files: test-results-*.xml
          check_name: Container Tests (${{ matrix.stack }})

      - name: Get image size
        if: always()
        env:
          STACK: ${{ matrix.stack }}
        run: |
          SIZE=$(docker images "test-${STACK}" --format "{{.Size}}")
          echo "📦 **${STACK}** image size: \`$SIZE\`" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # detect-changes is listed on purpose: when it fails, test-containers is
    # skipped, and a skip passes, so without it this job stayed green with no
    # test run at all.
    needs:
      - detect-changes
      - test-containers
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of detect-changes, and a quote in one of them would end a
          # single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
          TEST_RESULT: ${{ needs.test-containers.result }}
        run: |
          set -euo pipefail
          echo "Checking structure test results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list, as CI Success in ci.yml: only "success" and "skipped"
          # pass. A skipped job is a job the filter decided was irrelevant, and
          # it has to stay green or every filtered pull request would be blocked
          # if this check is ever required. "cancelled" fails with "failure": a
          # job that hits its timeout-minutes ends as cancelled, and a cancelled
          # job proved nothing. Any other result fails closed. A run superseded
          # through cancel-in-progress therefore reports this as failed on the
          # OLD commit. That is intended; the new commit gets its own run.
          FAILED=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "${NEEDS_JSON}")

          {
            echo "# Container Structure Tests"
            echo ""
            if [ -n "${FAILED}" ]; then
              echo "❌ Jobs that did not pass: ${FAILED}"
            elif [ "${TEST_RESULT}" = "skipped" ]; then
              echo "No stack changed, so no structure test ran."
            else
              echo "✅ All container structure tests passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FAILED}" ]; then
            echo "::error::Jobs that did not pass: ${FAILED}"
            exit 1
          fi
