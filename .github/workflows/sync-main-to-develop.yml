---
name: Sync Main to Develop

on:
  # No schedule. A 6-hourly sweep was meant to catch main pushes made with
  # GITHUB_TOKEN, which emit no event. Promotions merge with BOT_TOKEN, so
  # they do; and when BOT_TOKEN fails the sweep cannot push to protected
  # develop either, so the renewal runbook (docs/MAINTENANCE.md) dispatches
  # this workflow by hand. Its 57 readable scheduled runs from 2026-10-18 to
  # 2026-11-05 all found develop 0 commits behind main.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if not on main'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  sync:
    name: Sync Main to Develop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Only run on main branch or manual workflow_dispatch with force=true
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # develop requires the "CI Success" status check; direct pushes
          # from github-actions[bot] are rejected (GH006). BOT_TOKEN is an
          # admin PAT and bypasses (enforce_admins is off).
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main to develop
        run: |
          set -euo pipefail
          git fetch origin main develop

          BEHIND=$(git rev-list --count origin/develop..origin/main)
          printf "Develop is %s commits behind main\n" "$BEHIND"

          if [ "$BEHIND" -eq 0 ]; then
            printf "✅ Develop is already up to date with main\n"
            exit 0
          fi

          git checkout develop
          git merge origin/main --no-edit
          git push origin develop
          printf "✅ Synced main → develop\n"

      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Main SHA**: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: Check job logs for details" >> "$GITHUB_STEP_SUMMARY"
