---
name: Renovate Post-Process

# Renovate runs in a container without uv, docker or rsync, so its
# postUpgradeTasks cannot regenerate everything this repo derives from a
# dependency bump. This companion runs on Renovate PRs in a full runner
# and, when a change needs it, recomputes the age/tectonic/aws-cli hashes
# (no upstream checksum manifest) and the pinned Ansible collections'
# artifact hashes, regenerates the requirements exports from uv.lock, and
# resyncs the active .devcontainer against its template.
# It pushes the result back with BOT_TOKEN so CI re-runs and Renovate's
# auto-merge waits for the corrected branch. Every step is idempotent, so
# the push it triggers re-runs this job to a clean no-op (no loop).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  # The exports below must be produced by the same uv the images pin, or the
  # generated requirements stop being reproducible (0.11.18 vs 0.12.13, once).
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.6"

jobs:
  postprocess:
    name: Post-process
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # BOT_TOKEN so the push-back emits events and CI re-runs.
          token: ${{ secrets.BOT_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      # Read from the PR's own Dockerfile, so a PR that bumps the base image's
      # Python is post-processed with that Python. See
      # scripts/derive-toolchain-versions.sh.
      - name: Derive toolchain versions from the Dockerfiles
        id: toolchain
        run: bash scripts/derive-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Assert uv matches the image pin
        run: |
          set -euo pipefail
          dockerfile=devcontainers/base/Dockerfile
          pinned=$(sed -n 's/^ARG UV_VERSION="\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' "${dockerfile}" | head -1)
          installed=$(uv --version | awk '{print $2}')
          if [ "${pinned}" != "${installed}" ]; then
            msg="uv ${installed} in this workflow does not match the image pin"
            msg="${msg} ${pinned} in ${dockerfile}; the regenerated requirements"
            msg="${msg} would not be reproducible"
            echo "::error::${msg}"
            exit 1
          fi
          echo "uv ${installed} matches the image pin."

      - name: Sync only what this PR changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"; echo "${changed}"
          # A devcontainer/tool bump: recompute the checksum-less hashes and
          # resync the active .devcontainer against its (bumped) template.
          # An image digest bump in a template needs the resync too: Renovate
          # leaves .devcontainer/ alone, and Devcontainer State fails until
          # the copy and its recorded signature match the template again.
          resync=false
          if echo "${changed}" | grep -qE '^devcontainers/.*/Dockerfile'; then
            python3 scripts/refresh-tool-pins.py --sync-hashes
            resync=true
          fi
          if echo "${changed}" | grep -qE '^devcontainers/[^/]+/(local-build/)?devcontainer[^/]*\.json$'; then
            resync=true
          fi
          if [ "${resync}" = true ]; then
            stack=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('.devcontainer/.template-metadata.json').read_text())['stack'])")
            bash scripts/use-devcontainer.sh "${stack}"
          fi
          # A collection bump: Renovate moved a version in the pinned list
          # but cannot recompute its artifact's sha256, and the image build
          # rejects the stale one.
          if echo "${changed}" | grep -qE '^devcontainers/ansible/collections[^/]*\.txt$'; then
            python3 scripts/refresh-collection-pins.py --sync-hashes
          fi
          # A Python dependency change: regenerate the requirements exports.
          if echo "${changed}" | grep -qE '^(uv\.lock|pyproject\.toml)$'; then
            uv export --format requirements-txt --no-hashes --frozen --all-groups -o requirements.txt
            uv export --format requirements-txt --frozen --no-default-groups -o requirements-ansible.txt
            uv export --format requirements-txt --frozen --only-group ci-quality -o requirements-ci-quality.txt
            uv export --format requirements-txt --frozen --only-group devcontainer-tools -o requirements-devcontainer-tools.txt
          fi

      - name: Commit and push if anything changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to sync."
            exit 0
          fi
          git config user.name "malpanez"
          git config user.email "14823990+malpanez@users.noreply.github.com"
          git commit -am "chore(deps): sync hashes, requirements and devcontainer"
          # Renovate may update the branch under us; rebase and retry on the
          # non-fast-forward race rather than failing red.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${HEAD_REF}"; then exit 0; fi
            echo "push rejected (attempt ${attempt}); rebasing on latest"
            git fetch origin "${HEAD_REF}"
            git rebase "origin/${HEAD_REF}" || { git rebase --abort; exit 1; }
          done
          exit 1
