---
name: Performance Benchmarks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'devcontainers/**'
      - '.devcontainer/**'
      - 'Dockerfile'
      - 'requirements-ansible.txt'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [main, develop]
    paths:
      - 'devcontainers/**'
      - '.devcontainer/**'
      - 'Dockerfile'
      - 'requirements-ansible.txt'
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHMARK_ITERATIONS: 3
  BENCHMARK_RESULTS_DIR: benchmark-results

permissions:
  contents: read

jobs:
  container-startup-benchmark:
    name: Container Startup Time
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        container:
          - name: ansible
            path: devcontainers/ansible
          - name: terraform
            path: devcontainers/terraform
          - name: base
            path: devcontainers/base
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.container.name }}:buildcache-publish
        run: |
          set -euo pipefail
          # Read-only use of the cache build-containers.yml publishes, so this
          # job stays off the fixed 10 GB Actions quota and does not contend
          # for the tag. The packages are public: no login, no extra
          # permission. Probe first -- buildx aborts on a missing cache-from
          # ref rather than warning.
          #
          # This still measures a genuine warm build: the cache it reads is
          # the one the published images were actually built from.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
            echo "args=--cache-from type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached."
          fi


      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.container.path }}/Dockerfile
          load: true
          tags: benchmark-${{ matrix.container.name }}:test
          cache-from: ${{ steps.rcache.outputs.from }}

      - name: Benchmark container startup
        id: benchmark
        env:
          CONTAINER_NAME: ${{ matrix.container.name }}
        run: |
          echo "Running ${BENCHMARK_ITERATIONS} iterations..."
          total_time=0

          for i in $(seq 1 "${BENCHMARK_ITERATIONS}"); do
            echo "Iteration $i/${BENCHMARK_ITERATIONS}"

            # Measure startup time
            start_time=$(date +%s%N)
            docker run --rm "benchmark-${CONTAINER_NAME}:test" echo "Ready" > /dev/null 2>&1
            end_time=$(date +%s%N)

            # Calculate time in milliseconds
            elapsed=$((($end_time - $start_time) / 1000000))
            echo "  Time: ${elapsed}ms"
            total_time=$((total_time + elapsed))
          done

          # Calculate average
          avg_time=$((total_time / BENCHMARK_ITERATIONS))
          echo "average_ms=${avg_time}" >> "$GITHUB_OUTPUT"
          echo "### Container: ${CONTAINER_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Average startup time: **${avg_time}ms**" >> "$GITHUB_STEP_SUMMARY"

      - name: Store benchmark result
        env:
          CONTAINER_NAME: ${{ matrix.container.name }}
          AVERAGE_MS: ${{ steps.benchmark.outputs.average_ms }}
        run: |
          mkdir -p "${BENCHMARK_RESULTS_DIR}"
          cat > "${BENCHMARK_RESULTS_DIR}/${CONTAINER_NAME}.json" <<EOF
          {
            "container": "${CONTAINER_NAME}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "average_startup_ms": ${AVERAGE_MS},
            "iterations": ${BENCHMARK_ITERATIONS}
          }
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-${{ matrix.container.name }}
          path: ${{ env.BENCHMARK_RESULTS_DIR }}/${{ matrix.container.name }}.json
          retention-days: 90

  build-time-benchmark:
    name: Build Time Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        container:
          - name: ansible
            path: devcontainers/ansible
          - name: terraform
            path: devcontainers/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.container.name }}:buildcache-publish
        run: |
          set -euo pipefail
          # Read-only use of the cache build-containers.yml publishes, so this
          # job stays off the fixed 10 GB Actions quota and does not contend
          # for the tag. The packages are public: no login, no extra
          # permission. Probe first -- buildx aborts on a missing cache-from
          # ref rather than warning.
          #
          # This still measures a genuine warm build: the cache it reads is
          # the one the published images were actually built from.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
            echo "args=--cache-from type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached."
          fi


      - name: Benchmark build time (cold cache)
        id: cold-build
        env:
          CONTAINER_NAME: ${{ matrix.container.name }}
          CONTAINER_PATH: ${{ matrix.container.path }}
        run: |
          start_time=$(date +%s%N)
          docker buildx build \
            --tag "benchmark-build-${CONTAINER_NAME}:cold" \
            --load \
            --no-cache \
            --file "${CONTAINER_PATH}/Dockerfile" \
            .
          end_time=$(date +%s%N)

          elapsed=$((($end_time - $start_time) / 1000000000))
          echo "cold_build_seconds=${elapsed}" >> "$GITHUB_OUTPUT"
          echo "Cold build time: **${elapsed}s**" >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark build time (warm cache)
        id: warm-build
        env:
          CONTAINER_NAME: ${{ matrix.container.name }}
          CONTAINER_PATH: ${{ matrix.container.path }}
          RCACHE_ARGS: ${{ steps.rcache.outputs.args }}
        run: |
          read -r -a CACHE_FLAGS <<< "${RCACHE_ARGS}"
          start_time=$(date +%s%N)
          docker buildx build \
            --tag "benchmark-build-${CONTAINER_NAME}:warm" \
            --load \
            "${CACHE_FLAGS[@]}" \
            --file "${CONTAINER_PATH}/Dockerfile" \
            .
          end_time=$(date +%s%N)

          elapsed=$((($end_time - $start_time) / 1000000000))
          echo "warm_build_seconds=${elapsed}" >> "$GITHUB_OUTPUT"
          echo "Warm build time: **${elapsed}s**" >> "$GITHUB_STEP_SUMMARY"

      - name: Store benchmark results
        env:
          CONTAINER_NAME: ${{ matrix.container.name }}
          COLD_BUILD_SECONDS: ${{ steps.cold-build.outputs.cold_build_seconds }}
          WARM_BUILD_SECONDS: ${{ steps.warm-build.outputs.warm_build_seconds }}
        run: |
          mkdir -p "${BENCHMARK_RESULTS_DIR}"
          cat > "${BENCHMARK_RESULTS_DIR}/${CONTAINER_NAME}-build.json" <<EOF
          {
            "container": "${CONTAINER_NAME}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "cold_build_seconds": ${COLD_BUILD_SECONDS},
            "warm_build_seconds": ${WARM_BUILD_SECONDS}
          }
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-build-${{ matrix.container.name }}
          path: ${{ env.BENCHMARK_RESULTS_DIR }}/${{ matrix.container.name }}-build.json
          retention-days: 90

  resource-usage-benchmark:
    name: Resource Usage Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.container.name }}:buildcache-publish
        run: |
          set -euo pipefail
          # Read-only use of the cache build-containers.yml publishes, so this
          # job stays off the fixed 10 GB Actions quota and does not contend
          # for the tag. The packages are public: no login, no extra
          # permission. Probe first -- buildx aborts on a missing cache-from
          # ref rather than warning.
          #
          # This still measures a genuine warm build: the cache it reads is
          # the one the published images were actually built from.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
            echo "args=--cache-from type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached."
          fi


      - name: Build main devcontainer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: benchmark-devcontainer:test
          cache-from: ${{ steps.rcache.outputs.from }}

      - name: Measure container resource usage
        id: resources
        run: |
          # Start container in background
          CONTAINER_ID=$(docker run -d benchmark-devcontainer:test sleep 30)

          # Wait for container to stabilize
          sleep 5

          # Get resource stats
          STATS=$(docker stats --no-stream --format "{{.MemUsage}}\t{{.CPUPerc}}" "$CONTAINER_ID")
          MEM_USAGE=$(echo "$STATS" | awk '{print $1}')
          CPU_USAGE=$(echo "$STATS" | awk '{print $3}')

          # Stop container
          docker stop "$CONTAINER_ID" > /dev/null

          echo "memory_usage=${MEM_USAGE}" >> "$GITHUB_OUTPUT"
          echo "cpu_usage=${CPU_USAGE}" >> "$GITHUB_OUTPUT"

          echo "### Resource Usage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Memory: **${MEM_USAGE}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- CPU: **${CPU_USAGE}**" >> "$GITHUB_STEP_SUMMARY"

  compare-with-baseline:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: [container-startup-benchmark, build-time-benchmark]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download all benchmark results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: benchmark-*
          path: current-results

      - name: Compare with baseline
        run: |
          echo "## 📊 Performance Benchmark Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Startup Times" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container | Current | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for file in current-results/benchmark-*/*.json; do
            if [[ "$file" != *"-build.json" ]]; then
              container=$(jq -r '.container' "$file")
              time=$(jq -r '.average_startup_ms' "$file")
              echo "| $container | ${time}ms | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Times" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container | Cold Build | Warm Build |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------------|------------|" >> "$GITHUB_STEP_SUMMARY"

          for file in current-results/benchmark-build-*/*-build.json; do
            container=$(jq -r '.container' "$file")
            cold=$(jq -r '.cold_build_seconds' "$file")
            warm=$(jq -r '.warm_build_seconds' "$file")
            echo "| $container | ${cold}s | ${warm}s |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const results = [];

            // Read all benchmark files
            const files = fs.readdirSync('current-results', { recursive: true })
              .filter(f => f.endsWith('.json'));

            for (const file of files) {
              const data = JSON.parse(fs.readFileSync(`current-results/${file}`, 'utf8'));
              results.push(data);
            }

            // Create comment body
            let body = '## 📊 Performance Benchmark Results\n\n';
            body += '### Container Startup Times\n\n';
            body += '| Container | Average Time |\n';
            body += '|-----------|-------------|\n';

            results
              .filter(r => r.average_startup_ms)
              .forEach(r => {
                body += `| ${r.container} | ${r.average_startup_ms}ms |\n`;
              });

            body += '\n### Build Times\n\n';
            body += '| Container | Cold Build | Warm Build |\n';
            body += '|-----------|------------|------------|\n';

            results
              .filter(r => r.cold_build_seconds)
              .forEach(r => {
                body += `| ${r.container} | ${r.cold_build_seconds}s | ${r.warm_build_seconds}s |\n`;
              });

            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  benchmark-success:
    name: Benchmark Success
    runs-on: ubuntu-latest
    needs: [container-startup-benchmark, build-time-benchmark, resource-usage-benchmark]
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: a quote in a job
          # output would end a single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Checking benchmark results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list: only "success" and "skipped" pass. "cancelled" fails
          # with "failure" -- a job that hits its timeout-minutes ends as
          # cancelled, and a cancelled job proved nothing. Any other result
          # fails closed.
          failed=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "$NEEDS_JSON")

          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not pass: $failed"
            exit 1
          fi

          echo "✅ All benchmarks completed successfully" >> "$GITHUB_STEP_SUMMARY"
