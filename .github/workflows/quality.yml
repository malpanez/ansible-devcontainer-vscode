---
name: Code Quality Metrics

on:
  # No paths filter here on purpose. Quality Summary is a required check on
  # main and develop, and a required check that never appears blocks a pull
  # request forever -- a Dockerfile-only or Markdown-only promotion used to
  # deadlock exactly that way. So the workflow must always start; the
  # expensive analysis jobs are gated inside instead, by the changes job
  # below, exactly as ci.yml and sbom-verification.yml do it. A push touching
  # nothing relevant runs one cheap filter job and reports success.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.5"

jobs:
  changes:
    name: Detect Quality-Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      yaml: ${{ steps.filter.outputs.yaml }}
      ansible: ${{ steps.filter.outputs.ansible }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            # ansible-lint runs over the whole tree with only .cache, .git,
            # .venv, molecule, tests and collections excluded, so any YAML it
            # can parse is in scope -- not just the ansible directories.
            ansible:
              - 'playbooks/**'
              - 'roles/**'
              - 'collections/**'
              - 'requirements.yml'
              - 'ansible.cfg'
              - '**/*.yml'
              - '**/*.yaml'
            dockerfile:
              - '**/Dockerfile*'
              - 'devcontainers/**'

  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'schedule' || github.ref == 'refs/heads/main')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.python == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The image's Python is the source of truth. A literal python-version
      # here is a dependency to Renovate, which bumped it to 3.15 ahead of the
      # images on 2026-10-12 (pyyaml 6.0.3 ships no cp315 wheel).
      - name: Derive toolchain versions from the Dockerfiles
        id: toolchain
        run: bash scripts/derive-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_version }}

      - name: Install analysis tools
        run: |
          # Resolved through uv.lock and installed with --require-hashes, not
          # as a bare `pip install <name>`: an unpinned CI install is neither
          # reproducible nor verifiable, and Scorecard counts it against
          # Pinned-Dependencies. requirements-ci-quality.txt is generated by
          # renovate-postprocess.yml; edit the ci-quality group in
          # pyproject.toml, never this file.
          #
          # --only-binary :all: refuses sdists, so no setup.py runs at
          # install time (githubactions:S8541). Verified every package in
          # both exports publishes a wheel.
          pip install --only-binary :all: --require-hashes -r requirements-ci-quality.txt

      - name: Cyclomatic Complexity
        run: |
          echo "## Cyclomatic Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          radon cc . -a -s --total-average >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Maintainability Index
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Maintainability Index" >> $GITHUB_STEP_SUMMARY
          radon mi . -s >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Dead Code Detection
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Dead Code Detection" >> $GITHUB_STEP_SUMMARY
          vulture . --min-confidence 80 >> $GITHUB_STEP_SUMMARY || echo "No dead code found" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Security Issues (Bandit)
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Issues (Bandit)" >> $GITHUB_STEP_SUMMARY
          bandit -r . -f json -o bandit-report.json || true
          if [ -f bandit-report.json ]; then
            echo "Report generated successfully" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  yaml-quality:
    name: YAML Quality
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.yaml == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: YAML Lint Summary
        run: |
          echo "## YAML Lint Results" >> $GITHUB_STEP_SUMMARY
          uvx yamllint -f parsable . >> $GITHUB_STEP_SUMMARY || echo "YAML issues found" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  ansible-quality:
    name: Ansible Quality
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'schedule' || github.ref == 'refs/heads/main')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.ansible == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Derive toolchain versions from the Dockerfiles
        id: toolchain
        run: bash scripts/derive-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_version }}

      - name: Install Ansible
        run: |
          # The lock is the source of truth. `pip install ansible ansible-lint`
          # resolved whatever PyPI served that day, which is exactly how CI
          # ended up on ansible 14.3.1 while the lock pinned 14.2.0 and broke
          # develop on 2026-08-10. requirements-ansible.txt is exported from
          # uv.lock with hashes.
          pip install --only-binary :all: --require-hashes -r requirements-ansible.txt

      - name: Ansible Lint Summary
        run: |
          echo "## Ansible Lint Results" >> $GITHUB_STEP_SUMMARY
          ansible-lint --profile production || echo "Ansible lint issues found" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  dockerfile-quality:
    name: Dockerfile Quality
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.dockerfile == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: "devcontainers/*/Dockerfile"
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [changes, python-quality, yaml-quality, ansible-quality, dockerfile-quality]
    if: always()
    steps:
      - name: Generate summary
        env:
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          YAML_RESULT: ${{ needs.yaml-quality.result }}
          ANSIBLE_RESULT: ${{ needs.ansible-quality.result }}
          DOCKERFILE_RESULT: ${{ needs.dockerfile-quality.result }}
        run: |
          echo "# Code Quality Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Quality checks completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Jobs Status:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python Quality: ${PYTHON_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- YAML Quality: ${YAML_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ansible Quality: ${ANSIBLE_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dockerfile Quality: ${DOCKERFILE_RESULT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of the changes job, and a quote in one of them would end
          # a single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list: only "success" and "skipped" pass. A skipped job is
          # a job the filter decided was irrelevant, and treating != success
          # as a failure would turn every skip into a blocked pull request.
          # "cancelled" fails with "failure": a job that hits its
          # timeout-minutes ends as cancelled, and a cancelled job proved
          # nothing. Any other result fails closed.
          failed=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "$NEEDS_JSON")

          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not pass: $failed"
            exit 1
          fi

          echo "Quality metrics ran."
