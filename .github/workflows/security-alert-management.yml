---
name: Security Alert Management

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual dismissals)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_age_days:
        description: 'Maximum alert age in days before dismissal'
        required: false
        default: '90'
        type: string

permissions:
  contents: read

jobs:
  manage-alerts:
    name: Manage Code Scanning Alerts
    runs-on: ubuntu-slim  # Lightweight runner: API calls for alert triage
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Required to dismiss code scanning alerts
      issues: write          # Optional: for creating tracking issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DRY_RUN=${{ github.event.inputs.dry_run }}" >> "$GITHUB_ENV"
            echo "MAX_ALERT_AGE_DAYS=${{ github.event.inputs.max_age_days }}" >> "$GITHUB_ENV"
          else
            # Scheduled runs: report-only; dismissals require an explicit
            # workflow_dispatch with dry_run=false
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "MAX_ALERT_AGE_DAYS=90" >> "$GITHUB_ENV"
          fi

      - name: Display configuration
        run: |
          echo "Configuration:"
          echo "  Dry Run: ${DRY_RUN}"
          echo "  Max Alert Age: ${MAX_ALERT_AGE_DAYS} days"
          echo "  Trigger: ${{ github.event_name }}"

      - name: Run alert management script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/manage-code-scanning-alerts.sh

      - name: Generate summary report
        if: always()
        run: |
          echo "## Security Alert Management Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry Run**: ${DRY_RUN}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Max Alert Age**: ${MAX_ALERT_AGE_DAYS} days" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Get current alert count
          OPEN_ALERTS=$(gh api repos/${{ github.repository }}/code-scanning/alerts \
            --jq '[.[] | select(.state == "open")] | length')
          echo "- **Current Open Alerts**: ${OPEN_ALERTS}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "> **Note**: This was a dry run. No alerts were actually dismissed." >> "$GITHUB_STEP_SUMMARY"
            echo "> Run manually with \`dry_run: false\` to execute dismissals." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  alert-report:
    name: Generate Alert Report
    runs-on: ubuntu-slim  # Lightweight runner: API calls for statistics
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate alert statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Security Alert Statistics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Get all alerts
          ALERTS=$(gh api repos/${{ github.repository }}/code-scanning/alerts)

          # Count by state
          OPEN=$(echo "$ALERTS" | jq '[.[] | select(.state == "open")] | length')
          FIXED=$(echo "$ALERTS" | jq '[.[] | select(.state == "fixed")] | length')
          DISMISSED=$(echo "$ALERTS" | jq '[.[] | select(.state == "dismissed")] | length')
          TOTAL=$(echo "$ALERTS" | jq 'length')

          echo "## Overall Statistics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| State | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 Open | ${OPEN} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ✅ Fixed | ${FIXED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🚫 Dismissed | ${DISMISSED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📊 Total | ${TOTAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Break down open alerts by severity
          if [ "${OPEN}" -gt 0 ]; then
            echo "## Open Alerts by Severity" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            CRITICAL=$(echo "$ALERTS" | jq '[.[] | select(.state == "open" and .rule.severity == "critical")] | length')
            HIGH=$(echo "$ALERTS" | jq '[.[] | select(.state == "open" and .rule.severity == "error")] | length')
            MEDIUM=$(echo "$ALERTS" | jq '[.[] | select(.state == "open" and .rule.severity == "warning")] | length')
            LOW=$(echo "$ALERTS" | jq '[.[] | select(.state == "open" and .rule.severity == "note")] | length')

            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔴 Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟠 High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟡 Medium | ${MEDIUM} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟢 Low | ${LOW} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # List open alerts
            echo "## Open Alerts Details" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$ALERTS" | jq -r '.[] | select(.state == "open") |
              "- [\(.rule.id)](\(.html_url)) - \(.rule.severity) - \(.tool.name) - Created: \(.created_at)"' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🎉 **No open alerts!** All security issues resolved or dismissed." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Review dismissed alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Matches review_cadence in .github/security-alert-exceptions.yml
          STALE_AFTER_DAYS: '90'
        run: |
          set -euo pipefail

          # A dismissed code-scanning alert never comes back on its own. If it
          # is re-detected it stays dismissed, so an alert closed as "won't
          # fix" because no patch existed will not re-alert once upstream
          # ships one. The count alone (reported above) hides that: on
          # 2026-09-15 it was 319 dismissed, 158 of them CVEs marked
          # "won't fix". This step makes the backlog legible so the quarterly
          # review has something to review.
          DISMISSED="$(gh api --paginate \
            "repos/${REPO}/code-scanning/alerts?state=dismissed&per_page=100" \
            | jq -s 'add // []')"

          TOTAL="$(jq 'length' <<<"${DISMISSED}")"
          {
            echo "## Dismissed Alert Backlog"
            echo ""
            echo "Dismissed alerts do not reopen when a fix becomes available."
            echo "Total dismissed: **${TOTAL}**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${TOTAL}" -eq 0 ]; then
            echo "Nothing dismissed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CUTOFF="$(date -u -d "-${STALE_AFTER_DAYS} days" +%Y-%m-%d)"
          {
            echo "| Reason | Total | Not reviewed since ${CUTOFF} |"
            echo "|--------|-------|------------------------------|"
            jq -r --arg cutoff "${CUTOFF}" '
              group_by(.dismissed_reason)[]
              | "| \(.[0].dismissed_reason // "unspecified") | \(length) | "
                + ([.[] | select((.dismissed_at // "") < $cutoff)] | length | tostring)
                + " |"
            ' <<<"${DISMISSED}"
            echo ""
            echo "### Oldest 15 awaiting review"
            echo ""
            jq -r --arg cutoff "${CUTOFF}" '
              [.[] | select((.dismissed_at // "") < $cutoff)]
              | sort_by(.dismissed_at)[:15][]
              | "- [\(.rule.id)](\(.html_url)) — \(.dismissed_reason // "unspecified"), dismissed \(.dismissed_at[:10])"
            ' <<<"${DISMISSED}"
          } >> "$GITHUB_STEP_SUMMARY"
