---
name: Promote develop to main

# This workflow automatically creates a PR from develop to main when changes are pushed to develop.
# That pull request is where ci.yml's candidate mode builds and tests every image main will take,
# and main takes nothing else, so a run that could not create it fails red instead of passing green
# with no promotion open. GitHub Actions needs:
# Settings → Actions → General → Workflow permissions
# Enable: "Allow GitHub Actions to create and approve pull requests"
#
# Without it, `gh pr create` fails with createPullRequest and so does this run. Approving the
# promotion's parked runs fails the run too, since runs left parked test nothing. Enabling
# auto-merge stays best effort: its fallback only warns (see that step).

on:
  # No schedule. A 6-hourly sweep caught develop pushes that emitted no
  # event: Dependabot merged with GITHUB_TOKEN. Renovate replaced it and
  # merges with BOT_TOKEN, so every develop push starts this workflow. Its
  # 59 readable scheduled runs from 2026-10-18 to 2026-11-05 approved no
  # parked run: 16 found nothing to promote and 43 re-enabled auto-merge on
  # a promotion pull request a push run had already set up.
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to promote
        required: false
        default: develop
      target_branch:
        description: Target branch to receive the promotion PR
        required: false
        default: main

permissions:
  contents: read

# Collapse bursts of develop pushes (e.g. a batch of Renovate auto-merges)
# into a single promotion run. Without this, near-simultaneous pushes race
# the idempotent "does a promotion PR already exist?" check — both runs read
# "none" at once and each opens one, yielding duplicate develop->main PRs.
# cancel-in-progress lets the last push win: its run reflects the settled
# develop and creates/reuses exactly one promotion PR.
concurrency:
  group: promote-to-main
  cancel-in-progress: true

jobs:
  create-promotion-pr:
    name: Create promotion PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_branch || 'develop' }}
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || 'main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and target branches
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_BRANCH}" ] || [ -z "${TARGET_BRANCH}" ]; then
            echo "::error::source_branch and target_branch must be set"
            exit 1
          fi

          if [ "${SOURCE_BRANCH}" = "${TARGET_BRANCH}" ]; then
            echo "::error::source_branch and target_branch must be different"
            exit 1
          fi

          git fetch origin "${SOURCE_BRANCH}" "${TARGET_BRANCH}"

      - name: Check for promotable content
        id: check-content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Commit counts lie here: promotions squash-merge, so develop is
          # permanently "ahead" of main by history. Compare trees instead —
          # after a promotion + sync-back the trees are identical and a PR
          # would be empty (the sync push used to be event-less; now that it
          # pushes with BOT_TOKEN it re-triggers this workflow every cycle).
          if git diff --quiet "origin/${TARGET_BRANCH}" "origin/${SOURCE_BRANCH}"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No content differences between ${SOURCE_BRANCH} and ${TARGET_BRANCH}; nothing to promote."
            EMPTY_PR=$(gh pr list --base "${TARGET_BRANCH}" --head "${SOURCE_BRANCH}" --state open \
              --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // ""')
            if [ -n "$EMPTY_PR" ]; then
              gh pr close "$EMPTY_PR" --comment "Closing: ${SOURCE_BRANCH} and ${TARGET_BRANCH} have identical content, nothing to promote."
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if PR already exists
        id: check-pr
        if: steps.check-content.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An error here used to leave pr_count empty, skip the creation and
          # pass the run with no promotion open.
          #
          # --head is a bare branch name (GraphQL headRefName), so it also
          # matches a fork's develop. This repository is public: anyone could
          # open <fork>:develop -> main, and counting it would stop the real
          # promotion from ever being opened. Every lookup of the promotion
          # keeps this repository's pull requests only.
          PR_COUNT=$(gh pr list --base "${TARGET_BRANCH}" --head "${SOURCE_BRANCH}" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      # No continue-on-error: a promotion that cannot be opened fails the run.
      - name: Create promotion PR
        id: create-pr
        if: steps.check-content.outputs.has_changes == 'true' && steps.check-pr.outputs.pr_count == '0'
        env:
          # GITHUB_TOKEN, not BOT_TOKEN: the PR must be authored by the bot.
          # BOT_TOKEN acts as malpanez, who is the repository's only reviewer,
          # and GitHub does not let an author approve their own pull request --
          # so a BOT_TOKEN-authored promotion could never satisfy the
          # code-owner review that main requires.
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${TARGET_BRANCH}" \
            --head "${SOURCE_BRANCH}" \
            --title "chore: promote ${SOURCE_BRANCH} to ${TARGET_BRANCH}" \
            --body "$(cat <<EOF
          ## Automated Promotion

          This PR promotes the current \`${SOURCE_BRANCH}\` branch to \`${TARGET_BRANCH}\` after all tests have passed.

          ### What's included

          All changes merged to \`${SOURCE_BRANCH}\` since the last promotion, including:
          - Feature additions
          - Bug fixes
          - Dependency updates
          - Documentation improvements

          ### Pre-merge checklist

          - [ ] All CI checks passing
          - [ ] No merge conflicts
          - [ ] Reviewed recent commits in ${SOURCE_BRANCH}

          ### Auto-merge

          This PR will automatically merge once all required checks pass.

          ---

          *This PR was created automatically by the promote-to-main workflow.*
          EOF
          )"

      - name: Wait for PR to be ready
        if: steps.check-pr.outputs.pr_count == '0' && steps.create-pr.outcome == 'success'
        run: sleep 5

      # No continue-on-error: runs left parked test nothing, so main could
      # never take develop. A failure here leaves the run red; auto-merge is
      # still enabled below.
      - name: Approve parked workflow runs
        if: steps.check-content.outputs.has_changes == 'true'
        env:
          # GitHub parks every pull_request run of a bot-authored PR as
          # action_required until a user with write access approves it
          # (changelog 2026-06-11). The content is develop, already reviewed
          # and tested on its own PR, so the promotion approves its own runs
          # with BOT_TOKEN, which has write access.
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::BOT_TOKEN missing: the promotion's runs stay parked until approved by hand."
            exit 1
          fi

          # Same derivation as the auto-merge step: works whether this run
          # created the PR or reused an existing one.
          PR_NUMBER=$(GH_TOKEN="${FALLBACK_TOKEN}" gh pr list --base "${TARGET_BRANCH}" \
            --head "${SOURCE_BRANCH}" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // ""')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR from ${SOURCE_BRANCH} to ${TARGET_BRANCH}; nothing to approve."
            exit 0
          fi

          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          echo "Promotion PR #${PR_NUMBER}, head ${HEAD_SHA}"

          APPROVED_ANY=false
          FAILED_ANY=false
          for i in $(seq 1 12); do
            QUERY="event=pull_request&head_sha=${HEAD_SHA}"
            QUERY="${QUERY}&status=action_required&per_page=100"
            # This repository's runs only: a fork's pull request can have
            # the same head SHA, and its parked runs are outside code that
            # waits for a person to approve it, not BOT_TOKEN.
            RUN_IDS=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?${QUERY}" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY) | .id')

            if [ -z "$RUN_IDS" ]; then
              if [ "$APPROVED_ANY" = "true" ]; then
                echo "No parked runs left for ${HEAD_SHA}."
                exit 0
              fi
            else
              for RUN_ID in $RUN_IDS; do
                if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve" >/dev/null; then
                  echo "Approved parked run ${RUN_ID}"
                  APPROVED_ANY=true
                else
                  echo "::error::Could not approve parked run ${RUN_ID}"
                  FAILED_ANY=true
                fi
              done
            fi

            if [ "$i" -lt 12 ]; then
              sleep 10
            fi
          done

          if [ "$APPROVED_ANY" = "false" ]; then
            echo "::warning::No parked runs found for ${HEAD_SHA} in 120s;"
            echo "::warning::nothing was approved (expected when GitHub parked nothing)."
          fi
          if [ "$FAILED_ANY" = "true" ]; then
            exit 1
          fi

      # Whatever the approval's result, so a failed approval still leaves
      # auto-merge enabled, with the run red.
      - name: Enable auto-merge on promotion PR
        if: ${{ !cancelled() && steps.check-content.outputs.has_changes == 'true' }}
        continue-on-error: true
        env:
          # BOT_TOKEN (PAT) instead of GITHUB_TOKEN: merges performed by
          # auto-merge enabled with GITHUB_TOKEN do not trigger workflows,
          # which left sync-main-to-develop dormant after promotions and
          # let the branches diverge.
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          # Get the PR number (works whether we just created it or it already exists)
          PR_NUMBER=$(GH_TOKEN="${FALLBACK_TOKEN}" gh pr list --base "${TARGET_BRANCH}" --head "${SOURCE_BRANCH}" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // ""')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found from ${SOURCE_BRANCH} to ${TARGET_BRANCH}"
            exit 0
          fi

          echo "Found PR #$PR_NUMBER from ${SOURCE_BRANCH} to ${TARGET_BRANCH}"
          # Merge commit, NOT squash: squashing promotions keeps main and
          # develop permanently divergent by history (every develop commit
          # re-listed in every promotion body — which also inflated semver
          # bumps) and hides the real commit subjects from tooling.
          if gh pr merge "$PR_NUMBER" --auto --merge; then
            echo "Auto-merge enabled with BOT_TOKEN"
          else
            echo "::warning::BOT_TOKEN could not enable auto-merge (expired or missing scopes?). Falling back to GITHUB_TOKEN: the eventual merge push will NOT trigger workflows (no sync to develop; build-containers.yml publishes main at its nightly run). Renew BOT_TOKEN, then follow the renewal runbook in docs/MAINTENANCE.md."
            GH_TOKEN="${FALLBACK_TOKEN}" gh pr merge "$PR_NUMBER" --auto --merge \
              || echo "::warning::Auto-merge could not be enabled at all; merge the promotion PR manually."
          fi
