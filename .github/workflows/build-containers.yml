---
name: Build and Publish Containers

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - base
          - ansible
          - golang
          - terraform
          - latex
  schedule:
    # Daily, uncached (see `no-cache` in build-base): every image is rebuilt
    # from its pinned base, so the OS upgrade layer really runs and an image
    # that passes the scan gate is at most ~24h behind security updates. One
    # that fails it keeps its previous tags until the finding is fixed. Also
    # covers promotions merged by tokens whose pushes emit no events
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'devcontainers/**'
      # Installed by both ansible Dockerfiles; a lock bump is an image change
      - 'requirements-ansible.txt'
      - '.github/workflows/build-containers.yml'
  # No `pull_request: [closed]` trigger. It had the same paths filter as the
  # push trigger above, so every promotion merged by a user or a PAT started
  # TWO runs of the same commit that raced each other onto the same tags
  # (2026-09-16: base:main got sha256:712cf704 from the push run and
  # sha256:1f0f2740 from the pull_request run). Merges made with GITHUB_TOKEN
  # emit no event at all and are covered by the daily schedule.

# Never cancel a publish in flight -- a half-pushed multi-arch manifest is
# worse than a duplicate build -- but do serialize, so the daily schedule
# cannot overlap a push run and overwrite its tags.
concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-single:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stack != 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Commit time, not the clock: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stack input
        id: stack
        env:
          STACK_INPUT: ${{ github.event.inputs.stack }}
        run: |
          case "${STACK_INPUT}" in
            base|ansible|golang|terraform|latex)
              echo "stack=${STACK_INPUT}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid stack input: ${STACK_INPUT}"
              exit 1
              ;;
          esac

      - name: Configure metadata tags
        id: meta_tags
        env:
          STACK: ${{ steps.stack.outputs.stack }}
        run: |
          if [ "${STACK}" = "base" ]; then
            {
              echo "tags<<EOF"
              echo "type=raw,value=$(bash scripts/derive-python-tag.sh)"
              echo "type=sha"
              echo "type=ref,event=branch"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "type=raw,value=latest"
              echo "type=sha"
              echo "type=ref,event=branch"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          tags: ${{ steps.meta_tags.outputs.tags }}
          # The commit time, not metadata-action's clock: same config per commit.
          labels: org.opencontainers.image.created=${{ steps.epoch.outputs.created }}

      # Each Dockerfile labels its own description; metadata-action's
      # repository-wide one would replace it.
      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      - name: Determine target platforms
        env:
          STACK: ${{ steps.stack.outputs.stack }}
        run: |
          if [ "${STACK}" = "latex" ]; then
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_ENV"
          else
            echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          fi

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}:buildcache-publish
        run: |
          set -euo pipefail
          # buildx treats a MISSING cache-from ref as a hard failure --
          # 'failed to configure registry cache importer: <ref>: not found'
          # aborts the whole build -- not as a warning. The registry cache
          # therefore cannot be introduced cold: the tag has to be probed
          # first and the flag omitted until it exists. This seeds itself:
          # a run that finds no tag builds uncached and exports one.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached and seeding it."
          fi
          # ignore-error: a cache export problem must never fail a publish.
          echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"

      # Pushed untagged: see build-base.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: devcontainers/${{ steps.stack.outputs.stack }}/Dockerfile
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          cache-from: ${{ steps.rcache.outputs.from }}
          cache-to: ${{ steps.rcache.outputs.to }}
          # Uncached unless triggered by push: see build-base.
          no-cache: ${{ github.event_name != 'push' }}
          platforms: ${{ env.PLATFORMS }}
          provenance: true
          sbom: true

      - name: Scan with Grype
        id: grype_scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          # The index: grype resolves it to the runner's platform (amd64).
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_scan.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
          IMAGE: devcontainer-${{ steps.stack.outputs.stack }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for ${IMAGE}"
          fi

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_scan.outputs.sarif }}
          category: grype-${{ steps.stack.outputs.stack }}

      # arm64 is scanned by its own manifest digest: see build-base.
      - name: Resolve the arm64 manifest
        id: arm64
        if: always() && steps.build.outcome == 'success' && contains(env.PLATFORMS, 'linux/arm64')
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: linux/arm64
          REQUIRED: "true"
        run: bash scripts/resolve-platform-manifest.sh

      - name: Scan arm64 with Grype
        id: grype_scan_arm64
        if: always() && steps.arm64.outputs.ref != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          # registry: see build-base.
          image: registry:${{ steps.arm64.outputs.ref }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical arm64 findings in SARIF
        id: sarif_check_arm64
        if: always() && steps.grype_scan_arm64.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_scan_arm64.outputs.sarif }}
          IMAGE: devcontainer-${{ steps.stack.outputs.stack }}
        run: |
          set -euo pipefail
          # Not uploaded when unreadable; the gate reads it again and fails closed.
          if [ -f "${SARIF_FILE}" ] \
            && jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > "${SARIF_FILE}.filtered"; then
            mv "${SARIF_FILE}.filtered" "${SARIF_FILE}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No readable arm64 SARIF for ${IMAGE}"
          fi

      - name: Upload Grype SARIF (arm64)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && steps.sarif_check_arm64.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_scan_arm64.outputs.sarif }}
          category: grype-${{ steps.stack.outputs.stack }}-arm64

      # Scan gate: see base-freshness. An empty count means a platform in
      # PLATFORMS could not be judged.
      - name: Count fixable findings
        id: findings
        if: always() && steps.build.outcome == 'success'
        env:
          IMAGE: devcontainer-${{ steps.stack.outputs.stack }}
          PLATFORMS: ${{ env.PLATFORMS }}
          SARIF_AMD64: ${{ steps.grype_scan.outputs.sarif }}
          SARIF_ARM64: ${{ steps.grype_scan_arm64.outputs.sarif }}
        run: bash scripts/count-fixable-findings.sh

      # Every step after it runs only when it passed.
      - name: Fail when the image has fixable findings
        if: always() && steps.build.outcome == 'success'
        env:
          COUNT: ${{ steps.findings.outputs.count }}
          IMAGE: devcontainer-${{ steps.stack.outputs.stack }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${COUNT}" in
            0)
              exit 0
              ;;
            '' | *[!0-9]*)
              echo "::error::No usable Grype SARIF for ${IMAGE} on at least one platform: an image the" \
                "scan could not judge is not tagged. Check the Grype scan and 'Count fixable findings' steps."
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "::error::${IMAGE} has ${COUNT} fixable high/critical finding(s) on at least one platform," \
              "listed above, and was not tagged: its tags stay on the last image that passed. This build" \
              "reused the registry cache, which can be up to a day old; the next scheduled build rebuilds" \
              "uncached."
          else
            echo "::error::${IMAGE} was freshly built (uncached) and still has ${COUNT} fixable" \
              "high/critical finding(s) on at least one platform, listed above, so it was not tagged: its" \
              "tags stay on the last image that passed. Rebuilding will not clear them: bump the pinned" \
              "component (or widen the Dockerfile's upgrade step) that ships the vulnerable package, or" \
              "record a justified exception in .grype.yaml."
          fi
          exit 1

      # Not for a rejected digest: see build-base.
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Tags last: see build-base.
      - name: Tag the gated digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          TAG_LIST="$(jq -r '.tags[]' <<<"${META_JSON}")"
          if [ -z "${TAG_LIST}" ]; then
            echo "::error::docker/metadata-action produced no tags for ${IMAGE}."
            exit 1
          fi
          mapfile -t TAGS <<<"${TAG_LIST}"
          TAG_ARGS=()
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "${TAG}")
          done
          PLANNED="sha256:$(docker buildx imagetools create --dry-run "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}" \
            | head -c -1 | sha256sum | cut -d' ' -f1)"
          if [ "${PLANNED}" != "${DIGEST}" ]; then
            echo "::error::imagetools would tag a new index ${PLANNED}, not the gated ${DIGEST}; no tag moved."
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}"
          for TAG in "${TAGS[@]}"; do
            RESOLVED="sha256:$(docker buildx imagetools inspect --raw "${TAG}" | sha256sum | cut -d' ' -f1)"
            if [ "${RESOLVED}" != "${DIGEST}" ]; then
              echo "::error::${TAG} resolves to ${RESOLVED}, not the gated ${DIGEST}."
              exit 1
            fi
            echo "${TAG} -> ${DIGEST}"
          done

  build-base:
    # schedule and push always build everything; workflow_dispatch only when
    # the caller asked for 'all' (a single stack goes to build-single).
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.stack == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      # Consumed by build-all so the stacks derive from the base built here.
      digest: ${{ steps.build.outputs.digest }}
      # Consumed by base-freshness.
      fixable_findings: ${{ steps.findings.outputs.count }}
    env:
      # One list for the build and the scan gate, which judges each of them.
      PLATFORMS: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Commit time, not the clock: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive base Python tag
        id: pytag
        run: |
          set -euo pipefail
          # Never hardcode this. See scripts/derive-python-tag.sh for why.
          tag="$(bash scripts/derive-python-tag.sh)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "devcontainer-base Python stream tag: ${tag}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          # `latest` used to be written by ci.yml's publish-base, which built
          # amd64 only; this job builds amd64+arm64, so the tag gains arm64.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pytag.outputs.tag }}
            type=sha
            type=ref,event=branch
          # See build-single.
          labels: org.opencontainers.image.created=${{ steps.epoch.outputs.created }}

      # See build-single.
      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-base:buildcache-publish
        run: |
          set -euo pipefail
          # buildx treats a MISSING cache-from ref as a hard failure --
          # 'failed to configure registry cache importer: <ref>: not found'
          # aborts the whole build -- not as a warning. The registry cache
          # therefore cannot be introduced cold: the tag has to be probed
          # first and the flag omitted until it exists. This seeds itself:
          # a run that finds no tag builds uncached and exports one.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached and seeding it."
          fi
          # ignore-error: a cache export problem must never fail a publish.
          echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"

      # Pushed by digest, untagged (`tags:` names only the repository, and
      # push-by-digest pushes no tag): tags move only once the scan gate has
      # passed and the digest is attested and signed (the last steps), so a
      # rejected image never becomes `latest` or `main`. Its tags stay on the
      # last image that passed, and cleanup-ghcr.yml prunes the untagged
      # digest after two weeks.
      - name: Build and push base by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: devcontainers/base
          file: devcontainers/base/Dockerfile
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          labels: ${{ steps.labels.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          cache-from: ${{ steps.rcache.outputs.from }}
          cache-to: ${{ steps.rcache.outputs.to }}
          # Scheduled and manually dispatched builds run uncached. The
          # registry cache replays the OS upgrade layer (`full-upgrade`,
          # `apk upgrade`) for as long as the Dockerfile and the pinned base
          # digest are unchanged, so a cached "rebuild" ships the same
          # packages forever while the run stays green. `no-cache` only stops
          # the import: cache-to still exports, so every uncached run
          # refreshes :buildcache-publish and push builds reuse that night's
          # layers.
          no-cache: ${{ github.event_name != 'push' }}
          platforms: ${{ env.PLATFORMS }}
          provenance: true
          sbom: true

      - name: Scan base image with Grype
        id: grype_base
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          # By digest: nothing is tagged until this scan has passed.
          # The index: grype resolves it to the runner's platform (amd64).
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-base@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_base.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_base.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_base.outputs.sarif }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for base image"
          fi

      - name: Upload Grype SARIF for base
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_base.outputs.sarif }}
          category: grype-base

      # Given an index, grype scans only the runner's platform, so arm64
      # would be attested, signed and tagged unscanned. It gets its own scan,
      # by the digest of its manifest in the pushed index. continue-on-error
      # like the scan: a failure here leaves arm64 unjudged, which keeps the
      # base untagged and fails base-freshness, while build-all still runs.
      - name: Resolve the arm64 manifest
        id: arm64
        if: always() && steps.build.outcome == 'success' && contains(env.PLATFORMS, 'linux/arm64')
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: linux/arm64
          REQUIRED: "true"
        run: bash scripts/resolve-platform-manifest.sh

      - name: Scan base image (arm64) with Grype
        id: grype_base_arm64
        if: always() && steps.arm64.outputs.ref != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          # registry: reads the gated manifest itself from GHCR. Through the
          # daemon grype pulls and `docker save`s it, which reports a rewritten
          # manifest digest and depends on the runner's Docker.
          image: registry:${{ steps.arm64.outputs.ref }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical arm64 findings in SARIF
        id: sarif_check_arm64
        if: always() && steps.grype_base_arm64.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_base_arm64.outputs.sarif }}
        run: |
          set -euo pipefail
          # Not uploaded when unreadable; the gate reads it again and fails closed.
          if [ -f "${SARIF_FILE}" ] \
            && jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > "${SARIF_FILE}.filtered"; then
            mv "${SARIF_FILE}.filtered" "${SARIF_FILE}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No readable arm64 SARIF for base image"
          fi

      - name: Upload Grype SARIF for base (arm64)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && steps.sarif_check_arm64.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_base_arm64.outputs.sarif }}
          category: grype-base-arm64

      # An empty count means the scan could not judge the image on some
      # platform in PLATFORMS: it is not tagged, and base-freshness fails the
      # run.
      - name: Count fixable findings
        id: findings
        if: always()
        env:
          IMAGE: devcontainer-base
          SARIF_AMD64: ${{ steps.grype_base.outputs.sarif }}
          SARIF_ARM64: ${{ steps.grype_base_arm64.outputs.sarif }}
        run: bash scripts/count-fixable-findings.sh

      # A rejected digest is neither attested nor signed: a signature and a
      # provenance attestation from this workflow mean the image passed.
      - name: Attest
        if: steps.findings.outputs.count == '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: steps.findings.outputs.count == '0'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        if: steps.findings.outputs.count == '0'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Tags last, so a tag never points at a digest that is not attested and
      # signed; a failure above leaves them on the last image that passed.
      # One source and no --annotation: buildx then pushes the scanned index
      # bytes unchanged under every tag. Anything else makes it write a new
      # index, whose digest was never scanned, attested or signed. The dry run
      # (it prints the index plus a newline) proves that before a tag moves,
      # the read-back after.
      - name: Tag the gated digest
        if: steps.findings.outputs.count == '0'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          DIGEST: ${{ steps.build.outputs.digest }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          TAG_LIST="$(jq -r '.tags[]' <<<"${META_JSON}")"
          if [ -z "${TAG_LIST}" ]; then
            echo "::error::docker/metadata-action produced no tags for ${IMAGE}."
            exit 1
          fi
          mapfile -t TAGS <<<"${TAG_LIST}"
          TAG_ARGS=()
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "${TAG}")
          done
          PLANNED="sha256:$(docker buildx imagetools create --dry-run "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}" \
            | head -c -1 | sha256sum | cut -d' ' -f1)"
          if [ "${PLANNED}" != "${DIGEST}" ]; then
            echo "::error::imagetools would tag a new index ${PLANNED}, not the gated ${DIGEST}; no tag moved."
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}"
          for TAG in "${TAGS[@]}"; do
            RESOLVED="sha256:$(docker buildx imagetools inspect --raw "${TAG}" | sha256sum | cut -d' ' -f1)"
            if [ "${RESOLVED}" != "${DIGEST}" ]; then
              echo "::error::${TAG} resolves to ${RESOLVED}, not the gated ${DIGEST}."
              exit 1
            fi
            echo "${TAG} -> ${DIGEST}"
          done

  # Scan gate, here for the base and as a step before tagging in build-all and
  # build-single, on every event: an image with fixable high/critical findings
  # on any platform it is published for is never tagged. Each platform is
  # scanned on its own, and scripts/count-fixable-findings.sh leaves the count
  # empty, which also blocks tagging, when one of them could not be judged.
  # After an uncached (scheduled or dispatched) build such a finding is one
  # the Dockerfile's upgrade step did not clear, so it needs a human. A push
  # build reuses cache up to ~24h old, so its finding may be cleared by the
  # next scheduled build on its own. A separate job because build-all needs
  # build-base: failing build-base itself would stop every stack from being
  # built and judged on its own.
  base-freshness:
    name: Base image has no fixable findings
    needs: build-base
    if: always() && needs.build-base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Fail when the base image has fixable findings
        env:
          FIXABLE_FINDINGS: ${{ needs.build-base.outputs.fixable_findings }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${FIXABLE_FINDINGS}" in
            0)
              echo "devcontainer-base has no fixable high/critical findings and was tagged."
              ;;
            ''|*[!0-9]*)
              echo "::error::build-base has no usable finding count ('${FIXABLE_FINDINGS}'), so the" \
                "base image was not tagged; check its Grype scan and 'Count fixable findings' steps."
              exit 1
              ;;
            *)
              if [ "${EVENT_NAME}" = "push" ]; then
                echo "::error::devcontainer-base has ${FIXABLE_FINDINGS} fixable high/critical" \
                  "finding(s), listed in the build-base job summary, and was not tagged: its tags stay" \
                  "on the last image that passed. This build reused the registry cache, which can be" \
                  "up to a day old; the next scheduled build rebuilds uncached."
              else
                echo "::error::devcontainer-base was freshly built (uncached) and still has" \
                  "${FIXABLE_FINDINGS} fixable high/critical finding(s), listed in the build-base job" \
                  "summary, so it was not tagged: its tags stay on the last image that passed." \
                  "Rebuilding will not clear them: bump the pinned component (or widen the" \
                  "Dockerfile's upgrade step) that ships the vulnerable package, or record a" \
                  "justified exception in .grype.yaml."
              fi
              exit 1
              ;;
          esac

  build-all:
    # schedule and push always build everything; workflow_dispatch only when
    # the caller asked for 'all' (a single stack goes to build-single).
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.stack == 'all'
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Main Dockerfiles
          # base_from_run marks the entries whose Dockerfile consumes
          # BASE_IMAGE. Only devcontainers/ansible/Dockerfile does; the podman
          # variant starts from python:3.14-slim-trixie and golang, terraform
          # and latex do not reference it at all, so they must not be handed
          # an unconsumed build-arg.
          - stack: ansible
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
            base_from_run: true
          - stack: golang
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: terraform
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: latex
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          # Variant Dockerfiles
          - stack: ansible
            dockerfile: Dockerfile.podman
            variant: -podman
            platforms: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Commit time, not the clock: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch
          # See build-single.
          labels: org.opencontainers.image.created=${{ steps.epoch.outputs.created }}

      # See build-single.
      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}:buildcache-publish
        run: |
          set -euo pipefail
          # buildx treats a MISSING cache-from ref as a hard failure --
          # 'failed to configure registry cache importer: <ref>: not found'
          # aborts the whole build -- not as a warning. The registry cache
          # therefore cannot be introduced cold: the tag has to be probed
          # first and the flag omitted until it exists. This seeds itself:
          # a run that finds no tag builds uncached and exports one.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached and seeding it."
          fi
          # ignore-error: a cache export problem must never fail a publish.
          echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"

      # Pushed untagged: see build-base.
      - name: Build and push ${{ matrix.stack }}${{ matrix.variant }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: devcontainers/${{ matrix.stack }}/${{ matrix.dockerfile }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          labels: ${{ steps.labels.outputs.labels }}
          # The published image must sit on the base built in THIS run,
          # otherwise it ships the digest pinned in the Dockerfile, which is
          # by construction at least one rebuild behind (base is rebuilt daily
          # and on every push to main). The pin still serves local and PR
          # builds and Renovate keeps it fresh.
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
            ${{ matrix.base_from_run && format('BASE_IMAGE=ghcr.io/{0}/devcontainer-base@{1}', github.repository_owner, needs.build-base.outputs.digest) || '' }}
          cache-from: ${{ steps.rcache.outputs.from }}
          cache-to: ${{ steps.rcache.outputs.to }}
          # Uncached unless triggered by push: see build-base.
          no-cache: ${{ github.event_name != 'push' }}
          platforms: ${{ matrix.platforms }}
          provenance: true
          sbom: true

      - name: Scan ${{ matrix.stack }}${{ matrix.variant }} with Grype
        id: grype_scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          # The index: grype resolves it to the runner's platform (amd64).
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_scan.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
          IMAGE: devcontainer-${{ matrix.stack }}${{ matrix.variant }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for ${IMAGE}"
          fi

      - name: Upload Grype SARIF for ${{ matrix.stack }}${{ matrix.variant }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_scan.outputs.sarif }}
          category: grype-${{ matrix.stack }}${{ matrix.variant }}

      # arm64 is scanned by its own manifest digest: see build-base.
      - name: Resolve the arm64 manifest
        id: arm64
        if: always() && steps.build.outcome == 'success' && contains(matrix.platforms, 'linux/arm64')
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: linux/arm64
          REQUIRED: "true"
        run: bash scripts/resolve-platform-manifest.sh

      - name: Scan ${{ matrix.stack }}${{ matrix.variant }} (arm64) with Grype
        id: grype_scan_arm64
        if: always() && steps.arm64.outputs.ref != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          # registry: see build-base.
          image: registry:${{ steps.arm64.outputs.ref }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical arm64 findings in SARIF
        id: sarif_check_arm64
        if: always() && steps.grype_scan_arm64.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_scan_arm64.outputs.sarif }}
          IMAGE: devcontainer-${{ matrix.stack }}${{ matrix.variant }}
        run: |
          set -euo pipefail
          # Not uploaded when unreadable; the gate reads it again and fails closed.
          if [ -f "${SARIF_FILE}" ] \
            && jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > "${SARIF_FILE}.filtered"; then
            mv "${SARIF_FILE}.filtered" "${SARIF_FILE}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No readable arm64 SARIF for ${IMAGE}"
          fi

      - name: Upload Grype SARIF for ${{ matrix.stack }}${{ matrix.variant }} (arm64)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && steps.sarif_check_arm64.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_scan_arm64.outputs.sarif }}
          category: grype-${{ matrix.stack }}${{ matrix.variant }}-arm64

      # Scan gate: see base-freshness. An empty count means a platform in
      # PLATFORMS could not be judged.
      - name: Count fixable findings
        id: findings
        if: always() && steps.build.outcome == 'success'
        env:
          IMAGE: devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          PLATFORMS: ${{ matrix.platforms }}
          SARIF_AMD64: ${{ steps.grype_scan.outputs.sarif }}
          SARIF_ARM64: ${{ steps.grype_scan_arm64.outputs.sarif }}
        run: bash scripts/count-fixable-findings.sh

      # Every step after it runs only when it passed.
      - name: Fail when the image has fixable findings
        if: always() && steps.build.outcome == 'success'
        env:
          COUNT: ${{ steps.findings.outputs.count }}
          IMAGE: devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${COUNT}" in
            0)
              exit 0
              ;;
            '' | *[!0-9]*)
              echo "::error::No usable Grype SARIF for ${IMAGE} on at least one platform: an image the" \
                "scan could not judge is not tagged. Check the Grype scan and 'Count fixable findings' steps."
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "::error::${IMAGE} has ${COUNT} fixable high/critical finding(s) on at least one platform," \
              "listed above, and was not tagged: its tags stay on the last image that passed. This build" \
              "reused the registry cache, which can be up to a day old; the next scheduled build rebuilds" \
              "uncached."
          else
            echo "::error::${IMAGE} was freshly built (uncached) and still has ${COUNT} fixable" \
              "high/critical finding(s) on at least one platform, listed above, so it was not tagged: its" \
              "tags stay on the last image that passed. Rebuilding will not clear them: bump the pinned" \
              "component (or widen the Dockerfile's upgrade step) that ships the vulnerable package, or" \
              "record a justified exception in .grype.yaml."
          fi
          exit 1

      # Not for a rejected digest: see build-base.
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Tags last: see build-base.
      - name: Tag the gated digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          TAG_LIST="$(jq -r '.tags[]' <<<"${META_JSON}")"
          if [ -z "${TAG_LIST}" ]; then
            echo "::error::docker/metadata-action produced no tags for ${IMAGE}."
            exit 1
          fi
          mapfile -t TAGS <<<"${TAG_LIST}"
          TAG_ARGS=()
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "${TAG}")
          done
          PLANNED="sha256:$(docker buildx imagetools create --dry-run "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}" \
            | head -c -1 | sha256sum | cut -d' ' -f1)"
          if [ "${PLANNED}" != "${DIGEST}" ]; then
            echo "::error::imagetools would tag a new index ${PLANNED}, not the gated ${DIGEST}; no tag moved."
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE}@${DIGEST}"
          for TAG in "${TAGS[@]}"; do
            RESOLVED="sha256:$(docker buildx imagetools inspect --raw "${TAG}" | sha256sum | cut -d' ' -f1)"
            if [ "${RESOLVED}" != "${DIGEST}" ]; then
              echo "::error::${TAG} resolves to ${RESOLVED}, not the gated ${DIGEST}."
              exit 1
            fi
            echo "${TAG} -> ${DIGEST}"
          done
