---
name: Build and Publish Containers

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - base
          - ansible
          - golang
          - terraform
          - latex
  schedule:
    # Daily: keeps published images at most ~24h behind security updates
    # and covers promotions merged by tokens whose pushes emit no events
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'devcontainers/**'
      - '.github/workflows/build-containers.yml'
  # No `pull_request: [closed]` trigger. It had the same paths filter as the
  # push trigger above, so every promotion merged by a user or a PAT started
  # TWO runs of the same commit that raced each other onto the same tags
  # (2026-09-16: base:main got sha256:712cf704 from the push run and
  # sha256:1f0f2740 from the pull_request run). Merges made with GITHUB_TOKEN
  # emit no event at all and are covered by the daily schedule.

# Never cancel a publish in flight -- a half-pushed multi-arch manifest is
# worse than a duplicate build -- but do serialize, so the daily schedule
# cannot overlap a push run and overwrite its tags.
concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-single:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stack != 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stack input
        id: stack
        run: |
          case "${{ github.event.inputs.stack }}" in
            base|ansible|golang|terraform|latex)
              echo "stack=${{ github.event.inputs.stack }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid stack input: ${{ github.event.inputs.stack }}"
              exit 1
              ;;
          esac

      - name: Configure metadata tags
        id: meta_tags
        run: |
          if [ "${{ steps.stack.outputs.stack }}" = "base" ]; then
            {
              echo "tags<<EOF"
              echo "type=raw,value=$(bash scripts/derive-python-tag.sh)"
              echo "type=sha"
              echo "type=ref,event=branch"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "type=raw,value=latest"
              echo "type=sha"
              echo "type=ref,event=branch"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          tags: ${{ steps.meta_tags.outputs.tags }}

      - name: Determine target platforms
        run: |
          if [ "${{ steps.stack.outputs.stack }}" = "latex" ]; then
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_ENV"
          else
            echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          fi

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}:buildcache-publish
        run: |
          set -euo pipefail
          # buildx treats a MISSING cache-from ref as a hard failure --
          # 'failed to configure registry cache importer: <ref>: not found'
          # aborts the whole build -- not as a warning. The registry cache
          # therefore cannot be introduced cold: the tag has to be probed
          # first and the flag omitted until it exists. This seeds itself,
          # so only the very first run after a new image or a cache reset
          # builds uncached.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached and seeding it."
          fi
          # ignore-error: a cache export problem must never fail a publish.
          echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: devcontainers/${{ steps.stack.outputs.stack }}/Dockerfile
          outputs: type=image,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.rcache.outputs.from }}
          cache-to: ${{ steps.rcache.outputs.to }}
          platforms: ${{ env.PLATFORMS }}
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}@${{ steps.build.outputs.digest }}"

  build-base:
    # schedule and push always build everything; workflow_dispatch only when
    # the caller asked for 'all' (a single stack goes to build-single).
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.stack == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      # Consumed by build-all so the stacks derive from the base built here.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive base Python tag
        id: pytag
        run: |
          set -euo pipefail
          # Never hardcode this. See scripts/derive-python-tag.sh for why.
          tag="$(bash scripts/derive-python-tag.sh)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "devcontainer-base Python stream tag: ${tag}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          tags: |
            type=raw,value=${{ steps.pytag.outputs.tag }}
            type=sha
            type=ref,event=branch

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-base:buildcache-publish
        run: |
          set -euo pipefail
          # buildx treats a MISSING cache-from ref as a hard failure --
          # 'failed to configure registry cache importer: <ref>: not found'
          # aborts the whole build -- not as a warning. The registry cache
          # therefore cannot be introduced cold: the tag has to be probed
          # first and the flag omitted until it exists. This seeds itself,
          # so only the very first run after a new image or a cache reset
          # builds uncached.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached and seeding it."
          fi
          # ignore-error: a cache export problem must never fail a publish.
          echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"

      - name: Build and push base
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: devcontainers/base
          file: devcontainers/base/Dockerfile
          outputs: type=image,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.rcache.outputs.from }}
          cache-to: ${{ steps.rcache.outputs.to }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-base@${{ steps.build.outputs.digest }}"

      - name: Scan base image with Grype
        id: grype_base
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-base:main
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_base.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_base.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_base.outputs.sarif }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for base image"
          fi

      - name: Upload Grype SARIF for base
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_base.outputs.sarif }}
          category: grype-base

  build-all:
    # schedule and push always build everything; workflow_dispatch only when
    # the caller asked for 'all' (a single stack goes to build-single).
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.stack == 'all'
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Main Dockerfiles
          # base_from_run marks the entries whose Dockerfile consumes
          # BASE_IMAGE. Only devcontainers/ansible/Dockerfile does; the podman
          # variant starts from python:3.14-slim-trixie and golang, terraform
          # and latex do not reference it at all, so they must not be handed
          # an unconsumed build-arg.
          - stack: ansible
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
            base_from_run: true
          - stack: golang
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: terraform
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: latex
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          # Variant Dockerfiles
          - stack: ansible
            dockerfile: Dockerfile.podman
            variant: -podman
            platforms: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      - name: Resolve registry cache
        id: rcache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}:buildcache-publish
        run: |
          set -euo pipefail
          # buildx treats a MISSING cache-from ref as a hard failure --
          # 'failed to configure registry cache importer: <ref>: not found'
          # aborts the whole build -- not as a warning. The registry cache
          # therefore cannot be introduced cold: the tag has to be probed
          # first and the flag omitted until it exists. This seeds itself,
          # so only the very first run after a new image or a cache reset
          # builds uncached.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached and seeding it."
          fi
          # ignore-error: a cache export problem must never fail a publish.
          echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.stack }}${{ matrix.variant }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: devcontainers/${{ matrix.stack }}/${{ matrix.dockerfile }}
          outputs: type=image,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The published image must sit on the base built in THIS run,
          # otherwise it ships the digest pinned in the Dockerfile, which is
          # by construction at least one rebuild behind (base is rebuilt daily
          # and on every push to main). The pin still serves local and PR
          # builds and Renovate keeps it fresh.
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
            ${{ matrix.base_from_run && format('BASE_IMAGE=ghcr.io/{0}/devcontainer-base@{1}', github.repository_owner, needs.build-base.outputs.digest) || '' }}
          cache-from: ${{ steps.rcache.outputs.from }}
          cache-to: ${{ steps.rcache.outputs.to }}
          platforms: ${{ matrix.platforms }}
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}@${{ steps.build.outputs.digest }}"

      - name: Scan ${{ matrix.stack }}${{ matrix.variant }} with Grype
        id: grype_scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_scan.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for ${{ matrix.stack }}${{ matrix.variant }}"
          fi

      - name: Upload Grype SARIF for ${{ matrix.stack }}${{ matrix.variant }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_scan.outputs.sarif }}
          category: grype-${{ matrix.stack }}${{ matrix.variant }}
