---
name: Build and Publish Containers

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - base
          - ansible
          - golang
          - terraform
          - latex
  schedule:
    # Daily: keeps published images at most ~24h behind security updates
    # and covers promotions merged by tokens whose pushes emit no events
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'devcontainers/**'
      - '.github/workflows/build-containers.yml'
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'devcontainers/**'
      - '.github/workflows/build-containers.yml'

permissions:
  contents: read

jobs:
  build-single:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stack != 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stack input
        id: stack
        run: |
          case "${{ github.event.inputs.stack }}" in
            base|ansible|golang|terraform|latex)
              echo "stack=${{ github.event.inputs.stack }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid stack input: ${{ github.event.inputs.stack }}"
              exit 1
              ;;
          esac

      - name: Configure metadata tags
        id: meta_tags
        run: |
          if [ "${{ steps.stack.outputs.stack }}" = "base" ]; then
            {
              echo "tags<<EOF"
              echo "type=raw,value=py313"
              echo "type=sha"
              echo "type=ref,event=branch"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "type=raw,value=latest"
              echo "type=sha"
              echo "type=ref,event=branch"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          tags: ${{ steps.meta_tags.outputs.tags }}

      - name: Determine target platforms
        run: |
          if [ "${{ steps.stack.outputs.stack }}" = "latex" ]; then
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_ENV"
          else
            echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: devcontainers/${{ steps.stack.outputs.stack }}/Dockerfile
          outputs: type=image,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.PLATFORMS }}
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-${{ steps.stack.outputs.stack }}@${{ steps.build.outputs.digest }}"

  build-base:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          tags: |
            type=raw,value=py313
            type=sha
            type=ref,event=branch

      - name: Build and push base
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: devcontainers/base
          file: devcontainers/base/Dockerfile
          outputs: type=image,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-base@${{ steps.build.outputs.digest }}"

      - name: Scan base image with Grype
        id: grype_base
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-base:main
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_base.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_base.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_base.outputs.sarif }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for base image"
          fi

      - name: Upload Grype SARIF for base
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_base.outputs.sarif }}
          category: grype-base

  build-all:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'all')
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Main Dockerfiles
          - stack: ansible
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: golang
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: terraform
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64,linux/arm64
          - stack: latex
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          # Variant Dockerfiles
          - stack: ansible
            dockerfile: Dockerfile.podman
            variant: -podman
            platforms: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      - name: Build and push ${{ matrix.stack }}${{ matrix.variant }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: devcontainers/${{ matrix.stack }}/${{ matrix.dockerfile }}
          outputs: type=image,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.stack }}${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stack }}${{ matrix.variant }}
          platforms: ${{ matrix.platforms }}
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}@${{ steps.build.outputs.digest }}"

      - name: Scan ${{ matrix.stack }}${{ matrix.variant }} with Grype
        id: grype_scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        continue-on-error: true
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          fail-build: "false"
      - name: Keep only high/critical findings in SARIF
        if: always() && steps.grype_scan.outputs.sarif != ''
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
        run: |
          jq '.runs[0].results |= map(select(.level == "error"))' "${SARIF_FILE}" > sarif-filtered.json
          mv sarif-filtered.json "${SARIF_FILE}"

      - name: Check if SARIF file exists
        id: sarif_check
        if: always()
        env:
          SARIF_FILE: ${{ steps.grype_scan.outputs.sarif }}
        run: |
          if [ -n "${SARIF_FILE}" ] && [ -f "${SARIF_FILE}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SARIF file not generated for ${{ matrix.stack }}${{ matrix.variant }}"
          fi

      - name: Upload Grype SARIF for ${{ matrix.stack }}${{ matrix.variant }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        if: always() && steps.sarif_check.outputs.exists == 'true'
        with:
          sarif_file: ${{ steps.grype_scan.outputs.sarif }}
          category: grype-${{ matrix.stack }}${{ matrix.variant }}
