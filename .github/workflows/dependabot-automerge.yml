---
name: Dependabot Auto-Merge

# develop is protected with a required "CI Success" check, so enabling
# auto-merge here means "merge when the pipeline is green" — nothing
# lands unverified. Version updates target develop; the promotion gate
# to main still requires a human approval.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  automerge:
    name: Enable Auto-Merge
    runs-on: ubuntu-slim
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          # Dependabot-triggered runs cannot read regular Actions secrets, so
          # BOT_TOKEN is empty here — use the job's GITHUB_TOKEN (it carries
          # the pull-requests:write granted above). The resulting merge push
          # is event-less, so promote-to-main won't fire on it directly; its
          # scheduled sweep carries the change on to main.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PR_URL}"
