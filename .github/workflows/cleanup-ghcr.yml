---
name: Cleanup GHCR Images

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays at 2 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not delete)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  # The base image's Python stream tag is derived, not typed: it was
  # hardcoded `py313` here and in four workflows while base built FROM
  # python:3.14, so this job "verified" a tag whose name asserted a version
  # the image did not carry.
  resolve-tags:
    name: Resolve Derived Tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pytag: ${{ steps.pytag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Derive base Python tag
        id: pytag
        run: |
          set -euo pipefail
          tag="$(bash scripts/derive-python-tag.sh)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "devcontainer-base Python stream tag: ${tag}"

  cleanup-untagged:
    name: Delete Untagged Images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      # Packages are independent: one failing must not stop the others from
      # being pruned.
      fail-fast: false
      matrix:
        # Every image build-containers.yml publishes. ansible-podman was
        # missing until 2026-10-29, so its untagged versions were never pruned.
        image:
          - devcontainer-base
          - devcontainer-ansible
          - devcontainer-ansible-podman
          - devcontainer-ansible-aws
          - devcontainer-terraform
          - devcontainer-terraform-aws
          - devcontainer-golang
          - devcontainer-latex
    steps:
      # actions/delete-package-versions is not multi-arch aware: the
      # platform manifests and attestations of a tagged index show up as
      # "untagged" versions, and deleting them hollows out every
      # published tag (2026-07-05 incident: all :latest/:main/py313 tags
      # broke). ghcr-cleanup-action resolves manifest references and
      # only deletes truly orphaned versions.
      #
      # older-than keeps a 2-week grace window: when a base rebuild moves
      # :main to a new digest, the previous digest becomes untagged but is
      # still pinned by FROM in Dockerfiles on main/develop until the digest
      # bump promotes through. Deleting it immediately broke main's build
      # (2026-07-24). Two weeks spans several promotion cycles, so a pinned
      # digest is never deleted while still referenced. dry-run wires the
      # existing workflow_dispatch input so the policy can be previewed.
      - name: Delete orphaned container versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          package: ${{ matrix.image }}
          delete-untagged: true
          older-than: 2 weeks
          validate: true
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-protected-tags:
    name: Verify Protected Tags
    runs-on: ubuntu-24.04
    needs: [cleanup-untagged, resolve-tags]
    permissions:
      contents: read
      packages: read
    strategy:
      # A verification: every tag gets checked, so one broken tag does not
      # hide whether the others resolve.
      fail-fast: false
      matrix:
        include:
          - image: devcontainer-base
            tag: ${{ needs.resolve-tags.outputs.pytag }}
          - image: devcontainer-base
            tag: main
          - image: devcontainer-ansible
            tag: latest
          - image: devcontainer-ansible
            tag: main
          - image: devcontainer-ansible-podman
            tag: latest
          - image: devcontainer-ansible-aws
            tag: latest
          - image: devcontainer-terraform
            tag: latest
          - image: devcontainer-terraform-aws
            tag: latest
          - image: devcontainer-golang
            tag: latest
          - image: devcontainer-latex
            tag: latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify manifest and platform children resolve
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
        run: |
          # --format .Image forces resolution of the per-platform child
          # manifests and configs; a bare inspect only fetches the index
          # and reported success while every child was missing.
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}:${TAG}" \
            --format '{{json .Image}}' > /dev/null
          echo "OK: all platform manifests resolve"

  report-tagged-cleanup-policy:
    name: Tagged Cleanup Policy
    runs-on: ubuntu-24.04
    needs: cleanup-untagged
    permissions:
      contents: read
    steps:
      - name: Explain policy
        run: |
          {
            echo "Skipping automatic deletion of SHA and branch-tagged versions."
            echo ""
            echo "Reason: deleting tagged versions can break surviving protected tags if a registry manifest list still references removed content."
            echo ""
            echo "Current policy: delete only untagged versions automatically; review tagged cleanup manually."
          } >> "$GITHUB_STEP_SUMMARY"

  # Reports what the jobs above did. It used to print success whatever they
  # returned, and a retention of "keep last 3" that the cleanup step never
  # had.
  report:
    name: Cleanup Summary
    runs-on: ubuntu-24.04
    needs: [resolve-tags, cleanup-untagged, verify-protected-tags, report-tagged-cleanup-policy]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Report results
        env:
          # Through env, not expanded inside the script: a quote in an
          # output would end a shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          # Allow-list: success only when every job above succeeded. A
          # skipped verification means the cleanup before it failed.
          failed=$(jq -r '
            [to_entries[]
             | select(.value.result != "success")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "${NEEDS_JSON:?needs context is empty}")
          {
            echo "## GHCR Cleanup Summary"
            echo ""
            if [ -n "${failed}" ]; then
              echo "❌ Cleanup did not complete. Jobs that did not succeed: ${failed}"
            elif [ "${DRY_RUN}" = "true" ]; then
              echo "✅ Dry run completed: nothing was deleted"
            else
              echo "✅ Cleanup completed"
            fi
            echo ""
            echo "### Retention policy"
            echo "- Untagged versions older than 2 weeks are deleted (\`older-than: 2 weeks\`), in every package of the Delete Untagged Images matrix."
            echo "- The platform manifests, attestations and signatures of a tagged image are not untagged versions and are kept."
            echo "- Tagged versions: no automatic deletion."
            echo "- Checked after cleanup: the derived Python stream tag, \`main\` and \`latest\` resolve with every platform."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${failed}" ]; then
            echo "::error::Jobs that did not succeed: ${failed}"
            exit 1
          fi
