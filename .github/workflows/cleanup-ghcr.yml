---
name: Cleanup GHCR Images

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays at 2 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not delete)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  cleanup-untagged:
    name: Delete Untagged Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        image:
          - devcontainer-base
          - devcontainer-ansible
          - devcontainer-terraform
          - devcontainer-golang
          - devcontainer-latex
    steps:
      # actions/delete-package-versions is not multi-arch aware: the
      # platform manifests and attestations of a tagged index show up as
      # "untagged" versions, and deleting them hollows out every
      # published tag (2026-07-05 incident: all :latest/:main/py313 tags
      # broke). ghcr-cleanup-action resolves manifest references and
      # only deletes truly orphaned versions.
      - name: Delete orphaned container versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          package: ${{ matrix.image }}
          delete-untagged: true
          validate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-protected-tags:
    name: Verify Protected Tags
    runs-on: ubuntu-latest
    needs: cleanup-untagged
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - image: devcontainer-base
            tag: py313
          - image: devcontainer-base
            tag: main
          - image: devcontainer-ansible
            tag: latest
          - image: devcontainer-ansible
            tag: main
          - image: devcontainer-terraform
            tag: latest
          - image: devcontainer-golang
            tag: latest
          - image: devcontainer-latex
            tag: latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify manifest and platform children resolve
        run: |
          # --format .Image forces resolution of the per-platform child
          # manifests and configs; a bare inspect only fetches the index
          # and reported success while every child was missing.
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}" \
            --format '{{json .Image}}' > /dev/null
          echo "OK: all platform manifests resolve"

  report-tagged-cleanup-policy:
    name: Tagged Cleanup Policy
    runs-on: ubuntu-latest
    needs: cleanup-untagged
    permissions:
      contents: read
    steps:
      - name: Explain policy
        run: |
          echo "Skipping automatic deletion of SHA and branch-tagged versions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reason: deleting tagged versions can break surviving protected tags if a registry manifest list still references removed content." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Current policy: delete only untagged versions automatically; review tagged cleanup manually." >> $GITHUB_STEP_SUMMARY

  report:
    name: Cleanup Summary
    runs-on: ubuntu-latest
    needs: [cleanup-untagged, verify-protected-tags, report-tagged-cleanup-policy]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Report results
        run: |
          echo "## GHCR Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cleanup completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images processed:" >> $GITHUB_STEP_SUMMARY
          echo "- devcontainer-base" >> $GITHUB_STEP_SUMMARY
          echo "- devcontainer-ansible" >> $GITHUB_STEP_SUMMARY
          echo "- devcontainer-terraform" >> $GITHUB_STEP_SUMMARY
          echo "- devcontainer-golang" >> $GITHUB_STEP_SUMMARY
          echo "- devcontainer-latex" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Retention policy:" >> $GITHUB_STEP_SUMMARY
          echo "- Untagged: Keep last 3" >> $GITHUB_STEP_SUMMARY
          echo "- Tagged versions: no automatic deletion" >> $GITHUB_STEP_SUMMARY
          echo "- Verified after cleanup: \`py313\`, \`latest\` tags" >> $GITHUB_STEP_SUMMARY
