---
name: Token Health

# Canary for BOT_TOKEN, the personal access token the automation runs on.
# It expired silently on 2026-10-03: Sync Main to Develop went red at
# checkout, Renovate stopped opening PRs, and promote-to-main could neither
# approve its parked runs nor enable auto-merge with it (HTTP 401). Nothing
# warned beforehand. This goes red 14 days before the expiry, and whenever
# the token is rejected or lacks a required scope; the failed scheduled run
# is the alert. Renewal runbook: docs/MAINTENANCE.md, "Automation Token".

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-health:
    name: BOT_TOKEN health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: bash scripts/check-token-health.sh
