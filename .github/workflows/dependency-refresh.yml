---
name: Dependency Refresh

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Update Locks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Refresh dependency locks
        run: |
          uv lock --upgrade
          uv export --format requirements-txt --no-hashes --frozen > requirements.txt
          uv export --format requirements-txt --frozen > requirements-ansible.txt

      - name: Record changes
        run: |
          git status --short
          git diff
        env:
          GIT_PAGER: cat

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          branch: automation/dependency-refresh
          base: develop
          delete-branch: true
          commit-message: "chore: refresh dependency locks"
          title: "chore: refresh dependency locks"
          body: |
            Automated dependency refresh.

            - `uv lock --upgrade`
            - `uv export --format requirements-txt --no-hashes --frozen > requirements.txt`
            - `uv export --format requirements-txt --frozen > requirements-ansible.txt`
          labels: dependencies
