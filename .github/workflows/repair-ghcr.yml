---
name: Repair GHCR Images

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to republish"
        required: true
        default: "terraform"
        type: choice
        options:
          - base
          - ansible
          - terraform
          - golang
          - latex
      include_base:
        description: "Build/push devcontainer-base first"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  repair-base:
    name: Repair Base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.include_base == 'true' || github.event.inputs.stack == 'base'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: devcontainers/base
          file: devcontainers/base/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/devcontainer-base:py313
            ghcr.io/${{ github.repository_owner }}/devcontainer-base:sha-${{ github.sha }}

      - name: Verify base tags
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/devcontainer-base:py313
          docker pull ghcr.io/${{ github.repository_owner }}/devcontainer-base:py313

  repair-stack:
    name: Repair ${{ github.event.inputs.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: repair-base
    if: github.event.inputs.stack != 'base' && always() && (needs.repair-base.result == 'success' || needs.repair-base.result == 'skipped')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push selected stack
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: devcontainers/${{ github.event.inputs.stack }}/Dockerfile
          push: true
          platforms: ${{ github.event.inputs.stack == 'latex' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/devcontainer-base:py313
          tags: |
            ghcr.io/${{ github.repository_owner }}/devcontainer-${{ github.event.inputs.stack }}:latest
            ghcr.io/${{ github.repository_owner }}/devcontainer-${{ github.event.inputs.stack }}:sha-${{ github.sha }}

      - name: Verify latest tag
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/devcontainer-${{ github.event.inputs.stack }}:latest
          docker pull ghcr.io/${{ github.repository_owner }}/devcontainer-${{ github.event.inputs.stack }}:latest

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ github.event.inputs.stack }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test published image
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/devcontainer-${{ github.event.inputs.stack }}:latest \
            sh -c "echo '${{ github.event.inputs.stack }} latest is healthy'"
