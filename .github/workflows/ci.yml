---
name: CI Pipeline

on:
  # No paths filter here on purpose: CI Success is a required check, and one
  # that never appears blocks a pull request forever. The changes job gates
  # the work instead.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_FORCE_COLOR: "1"
  # No Python, Go or Terraform version here on purpose: the changes job
  # derives them from the Dockerfiles that ship them, so CI cannot drift from
  # the images. See scripts/derive-toolchain-versions.sh.
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.6"
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CST_VERSION: v1.22.1

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      terraform: ${{ steps.filter.outputs.terraform }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      images: ${{ steps.images.outputs.images }}
      base: ${{ steps.images.outputs.base }}
      template_images: ${{ steps.filter.outputs.template-images }}
      scripts: ${{ steps.filter.outputs.scripts }}
      python: ${{ steps.filter.outputs.python }}
      python_version: ${{ steps.toolchain.outputs.python_version }}
      terraform_version: ${{ steps.toolchain.outputs.terraform_version }}
      tflint_version: ${{ steps.toolchain.outputs.tflint_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Derive toolchain versions from the Dockerfiles
        id: toolchain
        run: bash scripts/derive-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            # Note: .devcontainer/ (repo's dev environment) is intentionally excluded
            # Only devcontainers/ (published stacks) triggers the image jobs
            ansible:
              - 'playbooks/**'
              - 'roles/**'
              - 'collections/**'
              - 'requirements.yml'
              - 'ansible.cfg'
              - 'devcontainers/ansible/**'
              # The base Dockerfile sets the Python these jobs run on (see
              # the toolchain step below), so a base bump must exercise them.
              - 'devcontainers/base/Dockerfile'
              # playbooks/test-environment.yml asserts the installed ansible
              # against the pins in this export, and molecule converges
              # install from it.
              - 'requirements-ansible.txt'
            terraform:
              - '**/*.tf'
              - 'terraform/**'
              - 'infrastructure/**'
              - 'devcontainers/terraform/**'
            # What every image job runs, reads or is judged by, so a change to
            # any of it runs every image, as a Dockerfile change runs its own.
            # Each image-<name> filter below starts with this list. Named
            # images-all, not image-all: the image list keeps only the
            # image-<name> filters.
            images-all: &images-all
              # This workflow: a change to the image jobs, their runner or
              # their gates must run them. PR #606 (2026-10-30) changed only
              # the build job's runs-on, every build job skipped and CI went
              # green without running on the new runner.
              - '.github/workflows/ci.yml'
              # The scan ignore policy decides what the image scan blocks, so
              # a change to it must run that scan. PR #546 (2026-10-12) changed
              # only this file, every build job skipped and CI went green
              # without exercising the policy it was changing.
              - '.grype.yaml'
              # The size gate: a budget edit, or a change to how the size is
              # judged, must run that gate against the images it judges, as a
              # .grype.yaml change runs the scan.
              - '.github/image-size-budgets.json'
              - 'scripts/check-image-size.py'
              # The structure tests, and what the jobs check inside the
              # container: the template's workload and the Docker profiles.
              - 'tests/container-structure/**'
              - 'scripts/check-devcontainer-workload.sh'
              - 'scripts/test-devcontainer-profile.sh'
              - 'scripts/assert-image-id.sh'
              # The CLI pin: these jobs are the only thing that exercises
              # `npm ci` against it, and without this a change to how the CLI
              # is installed skips the very jobs that would prove it still
              # works.
              - 'scripts/devcontainers-cli/**'
              # How the jobs build: the commit's epoch and the labels.
              - 'scripts/derive-source-date-epoch.sh'
              - 'scripts/strip-description-label.sh'
            # Devcontainer State's: every image input, and what the image jobs
            # run.
            devcontainer:
              - *images-all
              - 'devcontainers/**'
              # The Dockerfiles copy these into the images.
              - 'templates/**'
              - 'requirements-ansible.txt'
              - 'requirements-aws.txt'
              - 'requirements-devcontainer-tools.txt'
            # One filter per image, after the inputs its Dockerfile reads:
            # what it COPYs or bind-mounts, the uv.lock export it installs and,
            # for ansible and ansible-aws, devcontainers/base/, which they are
            # built on here. A lock bump changes an image as much as a
            # Dockerfile edit, so the exports are here too. The directory of a
            # stack also holds the template and the profiles brought up on its
            # image. images-all has the paths every image shares.
            image-base:
              - *images-all
              - 'devcontainers/base/**'
              - 'requirements-devcontainer-tools.txt'
              # The base job's smoke test.
              - 'scripts/smoke-devcontainer-image.sh'
            image-ansible:
              - *images-all
              - 'devcontainers/ansible/**'
              - 'devcontainers/base/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
              - 'requirements-devcontainer-tools.txt'
            image-ansible-podman:
              - *images-all
              - 'devcontainers/ansible/Dockerfile.podman'
              - 'devcontainers/ansible/collections*.txt'
              - 'devcontainers/ansible/install-collections.sh'
              # The profile brought up on this image.
              - 'devcontainers/ansible/devcontainer.podman.json'
              - 'devcontainers/scripts/**'
              - 'templates/ansible/**'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
            image-ansible-aws:
              - *images-all
              - 'devcontainers/ansible/**'
              - 'devcontainers/base/**'
              - 'devcontainers/scripts/**'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
              - 'requirements-aws.txt'
              - 'requirements-devcontainer-tools.txt'
            image-terraform:
              - *images-all
              - 'devcontainers/terraform/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/terraform/**'
              - 'requirements-devcontainer-tools.txt'
            image-terraform-aws:
              - *images-all
              - 'devcontainers/terraform/**'
              - 'devcontainers/scripts/**'
              - 'templates/pre-commit/terraform/**'
              - 'requirements-devcontainer-tools.txt'
            image-golang:
              - *images-all
              - 'devcontainers/golang/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/golang/**'
              - 'requirements-devcontainer-tools.txt'
            image-latex:
              - *images-all
              - 'devcontainers/latex/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/latex/**'
              - 'requirements-devcontainer-tools.txt'
              # The LaTeX scenario this image's job runs, and the smoke test it
              # starts with.
              - 'scripts/scenarios/run-latex-cv.sh'
              - 'scripts/smoke-devcontainer-image.sh'
              - 'docs/scenarios/examples/**'
            # The files that name the images the templates and examples open
            # from, checked by Devcontainer State. A filter of its own, not
            # more paths under devcontainer: examples/ is no image input.
            template-images:
              - 'devcontainers/**/devcontainer*.json'
              - '.devcontainer/**/devcontainer*.json'
              - 'examples/*/.devcontainer/*.json'
            scripts:
              - 'scripts/**'
            python:
              - '**/*.py'
              - 'requirements.txt'
              # `uv run pytest` builds its environment from the lock, and
              # pyproject.toml holds pytest's configuration.
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/**'
              # tests/ covers the shell scripts too (the scan gate's among
              # them), so a change to a script alone must run its tests.
              - 'scripts/**'
              # tests/test_check_image_size.py checks this file's shape: one
              # budget per published image, both limits positive integers.
              - '.github/image-size-budgets.json'
              # tests/test_derive_toolchain_versions.py reads the versions in
              # the Dockerfiles; tests/test_refresh_tool_pins.py its pin patterns
              # in them and in the script, and that no Dockerfile pins the AWS
              # CLI, .devcontainer's copy included.
              - 'devcontainers/*/Dockerfile*'
              - '.devcontainer/Dockerfile*'
              - 'devcontainers/scripts/install-aws-cli.sh'
              # tests/test_check_devcontainer_images.py runs the offline check
              # on these; tests/test_test_devcontainer_profile.py renders the
              # profiles among them.
              - 'devcontainers/**/devcontainer*.json'
              - '.devcontainer/**/devcontainer*.json'
              - 'examples/*/.devcontainer/*.json'
              # tests/test_workflow_contracts.py reads them all, and checks
              # the Lint job against these two: the lint-deps target it runs
              # and the hooks it runs.
              - '.github/workflows/*.yml'
              - 'Makefile'
              - '.pre-commit-config.yaml'

      # The image job's matrix: the images whose image-<name> filter matched,
      # and whether the base job must run, for base itself or for an image
      # built on it (ansible and ansible-aws, whose Dockerfile takes
      # BASE_IMAGE). paths-filter lists every filter that matched, never an
      # `any_changed`. A dispatch diffs only the last commit (or the branch
      # against main), usually nothing, so it runs every image.
      - name: Resolve the images to test
        id: images
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          ALL_IMAGES='["ansible","ansible-podman","ansible-aws","terraform","terraform-aws","golang","latex"]'
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MATCHED="$(jq -c '["image-base"] + map("image-" + .)' <<< "${ALL_IMAGES}")"
          else
            MATCHED="${CHANGES:?paths-filter gave no changes output}"
          fi
          IMAGES="$(jq -c --argjson matched "${MATCHED}" \
            'map(. as $image | select(any($matched[]; . == "image-" + $image)))' <<< "${ALL_IMAGES}")"
          BASE="$(jq -r --argjson images "${IMAGES}" \
            'any(.[]; . == "image-base") or any($images[]; . == "ansible" or . == "ansible-aws")' <<< "${MATCHED}")"
          echo "Images to test: ${IMAGES}; base: ${BASE}"
          {
            echo "images=${IMAGES}"
            echo "base=${BASE}"
          } >> "$GITHUB_OUTPUT"

  # The only lint in CI: the pre-commit hooks, the same run as `make lint`.
  # The script-lint, dockerfile-lint and terraform-ci jobs here and
  # quality.yml's lint jobs ran a second copy of some hooks, at other
  # versions, over other files. No changes filter, on purpose: this is the
  # lint contract, and each hook selects its own files. The Python tools come
  # from uv.lock; terraform and tflint are the versions the terraform image
  # ships (scripts/derive-toolchain-versions.sh).
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: changes
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ needs.changes.outputs.python_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.changes.outputs.terraform_version }}
          terraform_wrapper: false

      # Checked against the release's checksums.txt, as the terraform image
      # checks the same download (devcontainers/terraform/Dockerfile).
      - name: Install tflint
        env:
          TFLINT_VERSION: ${{ needs.changes.outputs.tflint_version }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/tflint"
          BASE="https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}"
          mkdir -p "${DEST}/bin"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE}/tflint_linux_amd64.zip" -o "${DEST}/tflint_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE}/checksums.txt" -o "${DEST}/checksums.txt"
          (cd "${DEST}" && grep ' tflint_linux_amd64.zip$' checksums.txt | sha256sum --check --strict -)
          unzip -q "${DEST}/tflint_linux_amd64.zip" tflint -d "${DEST}/bin"
          echo "${DEST}/bin" >> "${GITHUB_PATH}"
          "${DEST}/bin/tflint" --version

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The uv.lock environment, and the Ansible collections the ansible
      # images ship, which ansible-lint (offline) resolves modules against.
      - name: Install the lint dependencies
        run: make lint-deps

      - name: Run pre-commit
        run: uv run --locked --no-build pre-commit run --all-files --show-diff-on-failure

  test-playbooks:
    name: Test Playbooks
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run test playbook
        run: |
          if [ -f "playbooks/test-environment.yml" ]; then
            ansible-playbook playbooks/test-environment.yml --check
          else
            echo "::warning::Test playbook not found, skipping"
          fi

  # PSScriptAnalyzer, as Script Lint ran it before shellcheck moved to
  # pre-commit: unpinned Install-Module and non-blocking, unchanged. Whether
  # it becomes a pinned, blocking check of the user-facing .ps1 scripts or
  # goes is the owner's call; until then it keeps a job of its own.
  powershell-lint:
    name: PowerShell Lint
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint PowerShell scripts
        if: hashFiles('scripts/*.ps1') != ''
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $scripts = Get-ChildItem -Path scripts -Filter *.ps1
          foreach ($script in $scripts) {
            Write-Host "Analyzing $($script.Name)"
            Invoke-ScriptAnalyzer -Path $script.FullName -Recurse
          }
        continue-on-error: true

  devcontainer-state:
    name: Devcontainer State
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      needs.changes.outputs.devcontainer == 'true'
      || needs.changes.outputs.template_images == 'true'
      || needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Verify active .devcontainer metadata
        run: python3 scripts/devcontainer-metadata.py

      - name: Verify active .devcontainer sync
        run: python3 scripts/devcontainer-diff.py

      - name: Run devcontainer doctor
        run: bash scripts/doctor-devcontainer.sh

      # Every template and example opens from a GHCR image pinned by digest.
      # A digest GHCR no longer serves, or one that pins a single platform
      # instead of the multi-arch index, breaks every dev container that
      # opens from it, and nothing else here pulls those images.
      - name: Verify template images resolve in GHCR
        run: python3 scripts/check-devcontainer-images.py


  # The image jobs build each image once and run every image check on that
  # build. Each check used to build the image for itself: up to five builds
  # of each image per pull request, in devcontainer-build and
  # devcontainer-cli-test here, scenario-tests, test-containers.yml and
  # sbom-verification.yml. Every check now asserts, before it runs, that the
  # image still has the ID the build gave it (scripts/assert-image-id.sh).
  # The checks after the build run whether or not an earlier one failed, as
  # they did when they were separate jobs, so one run reports them all.
  #
  # What these jobs test is a presubmit build: amd64 only, loaded into the
  # runner's Docker and never pushed. It is not the image build-containers.yml
  # publishes, which is built again, multi-arch, and gated again there.

  # base is built once, here, for its own checks and for the images built on
  # it, which take it as an artifact instead of building it again. One build
  # writes it twice: to an OCI layout, which the children read as a named
  # build context (the docker-container builder does not see the daemon's
  # images), and into Docker, for the checks.
  base:
    name: Image (base)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes, lint]
    if: needs.changes.outputs.base == 'true'
    env:
      IMAGE_REF: devcontainer-base:ci
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # As build-containers.yml publishes: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      # Read-only. build-base in build-containers.yml is the one writer of
      # this tag, and a cache export replaces the manifest at its tag, so a
      # second writer here would overwrite it every run. The package is
      # public, so reading needs no credentials and fork pull requests use it
      # too. Probed first: buildx aborts on a missing cache-from ref.
      #
      # The cache also keeps the children's own cache useful. rewrite-timestamp
      # clamps only the mtimes later than SOURCE_DATE_EPOCH, so cached base
      # layers older than the commit come out byte-identical on every commit
      # and the stack layers above them still hit. Built fresh, after the
      # commit, base changes with every commit's epoch and the stacks rebuild
      # in full.
      - name: Resolve the base build cache
        id: base_cache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-base:buildcache-publish
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF}; building base uncached."
          fi

      # The ansible Dockerfile pins BASE_IMAGE to the devcontainer-base that
      # build-containers.yml last published, and only main publishes it. On
      # that pin CI scanned every pull request on the base main already ships,
      # never on the PR's own devcontainers/base/Dockerfile. The move to Python
      # 3.14.10 for CVE-2026-115557 (2026-10-30) could not pass the gate: the
      # image scanned still ran main's 3.14.8, on every pull request up to the
      # develop -> main promotion that would publish the fix. Built from this
      # commit, base is what a merge would publish.
      #
      # Same epoch and timestamp rewrite on both outputs, as build-base
      # publishes it. No provenance: the layout never leaves this run, and
      # without an attestation manifest its index names the amd64 image
      # manifest itself.
      - name: Build base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # The repository root: the Dockerfile bind-mounts
          # requirements-devcontainer-tools.txt.
          context: .
          file: devcontainers/base/Dockerfile
          outputs: |
            type=oci,dest=${{ runner.temp }}/devcontainer-base,tar=false,rewrite-timestamp=true
            type=docker,name=${{ env.IMAGE_REF }},rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          cache-from: ${{ steps.base_cache.outputs.from }}
          platforms: linux/amd64
          provenance: false

      # The checks below run on the image in Docker and the children build on
      # the layout, so the two must be one image: the same layers. The
      # layout's manifest digest is this job's output, which every child
      # checks the artifact against.
      - name: Check the loaded base is the layout's image
        id: layout
        env:
          LAYOUT: ${{ runner.temp }}/devcontainer-base
        run: |
          set -euo pipefail
          blob() {
            cat "${LAYOUT}/blobs/sha256/${1#sha256:}"
          }
          COUNT="$(jq '.manifests | length' "${LAYOUT}/index.json")"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::The base layout's index lists ${COUNT} manifests, not one"
            exit 1
          fi
          MANIFEST="$(jq -r '.manifests[0].digest' "${LAYOUT}/index.json")"
          if [[ ! "${MANIFEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The base layout's index names no manifest digest (${MANIFEST})"
            exit 1
          fi
          CONFIG="$(blob "${MANIFEST}" | jq -r '.config.digest')"
          LAYOUT_LAYERS="$(blob "${CONFIG}" | jq -c '.rootfs.diff_ids')"
          LOADED_LAYERS="$(docker image inspect --format '{{json .RootFS.Layers}}' -- "${IMAGE_REF}" | jq -c .)"
          if [ "${LAYOUT_LAYERS}" != "${LOADED_LAYERS}" ]; then
            echo "::error::${IMAGE_REF} has layers ${LOADED_LAYERS}, the layout ${LAYOUT_LAYERS}"
            exit 1
          fi
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' -- "${IMAGE_REF}")"
          echo "${IMAGE_REF} is ${IMAGE_ID}; layout manifest ${MANIFEST}"
          {
            echo "digest=${MANIFEST}"
            echo "id=${IMAGE_ID}"
          } >> "$GITHUB_OUTPUT"

      # Only for the children in this run, hence one day. The blobs are
      # compressed layers already.
      - name: Upload the base layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: devcontainer-base-layout
          path: ${{ runner.temp }}/devcontainer-base
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      # What the LaTeX scenario used to check of base on develop and main,
      # where it built base for a latex image that does not take it.
      - name: Smoke test base
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          bash scripts/smoke-devcontainer-image.sh --stack base --image "${IMAGE_REF}"

      # Gated now that base is loaded here, against the budget only the
      # publish report used to read: see the size gate in the image job.
      - name: Check base image size against its budget
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          python3 scripts/check-image-size.py local --image "${IMAGE_REF}" --name base

      - name: Install container-structure-test
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        run: |
          # Pinned, over HTTPS, and checked against the release's
          # checksums.txt before the binary is ever made executable.
          set -euo pipefail
          BASE_URL="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
          DEST="$(mktemp -d)"
          # --retry: a 504 from GitHub releases broke builds on 2026-09-14.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/container-structure-test-linux-amd64" -o "${DEST}/container-structure-test-linux-amd64"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/checksums.txt" -o "${DEST}/checksums.txt"
          (cd "${DEST}" && grep ' container-structure-test-linux-amd64$' checksums.txt | sha256sum --check --strict -)
          install -m 0755 "${DEST}/container-structure-test-linux-amd64" /usr/local/bin/container-structure-test
          rm -rf "${DEST}"

      - name: Run the structure tests for base
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          container-structure-test test --image "${IMAGE_REF}" \
            --config tests/container-structure/base.yaml

      - name: Assert the image before its SBOM
        id: sbom_image
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"

      - name: Generate the SBOM of base
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          # The upload step below names it: the action's own upload would add
          # a second artifact.
          upload-artifact: false
          output-file: ${{ runner.temp }}/presubmit-sbom-base.spdx.json
          format: spdx-json

      # What sbom-verification.yml's checks could fail on: an SBOM that is not
      # JSON, or that has no package list. Its NTIA, license and Grype steps
      # could not fail and are gone. An empty list fails too: an SBOM of
      # nothing describes no image.
      - name: Check the SBOM of base
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        env:
          SBOM: ${{ runner.temp }}/presubmit-sbom-base.spdx.json
        run: |
          set -euo pipefail
          PACKAGES="$(jq -e '.packages | if type == "array" and length > 0 then length else error("no packages") end' "${SBOM}")"
          echo "${IMAGE_REF}: ${PACKAGES} packages in the SBOM"

      # presubmit: the SBOM of this run's amd64 build, not of a published
      # image. release.yml attaches the released digests' SBOMs.
      - name: Upload the SBOM of base
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: presubmit-sbom-base
          path: ${{ runner.temp }}/presubmit-sbom-base.spdx.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  image:
    name: Image (${{ matrix.image }})
    # Not ubuntu-latest: that label moves to Ubuntu 26.04 by 2026-11-19, with
    # Docker 29 where 24.04 has Docker 28. The size gate below needs the classic
    # overlay2 store its budgets were measured on, and fails on the containerd
    # store, the default for a new Docker 29 install. Renovate ignores runner
    # labels, so move this by hand and re-measure the budgets in that change.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # For the registry cache, which only a push writes (see "Determine cache
      # strategy"). A permission cannot depend on the event, so a pull request
      # from this repository gets a token that carries it too. That grants
      # its author nothing new: a branch in this repository takes write
      # access, which can already change this workflow. No step logs in with
      # it there, and a fork's token is read-only.
      packages: write
    needs: [changes, lint, base]
    # Whatever base's result. It is skipped whenever no image in the list is
    # built on it, and under the implicit success() a skipped need would skip
    # this job too (actions/runner#2205). An image not built on base does not
    # need it, so a failed base check must not hide that image's results; an
    # image built on it fails at "Check this run built the base" when base did
    # not succeed. A failed base fails the base job, and the summaries with
    # it.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.lint.result == 'success'
      && needs.changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE_REF: devcontainer-${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Every image is devcontainers/<image>/Dockerfile tested with
      # <image>.yaml, except the variants, which are a stack plus one layer:
      # ansible-podman, built from Dockerfile.podman, and the -aws images,
      # built from the stack's Dockerfile with --target <image>. The stack's
      # file holds for them unchanged (user, workdir, tools, the bytecode
      # check), so they run it and <variant>.yaml for the layer, instead of a
      # copy. terraform and ansible, built without a target (their
      # Dockerfile's last stage), also run no-aws.yaml: it fails if that last
      # stage ever became an -aws image. base_from_run marks the images whose
      # Dockerfile consumes BASE_IMAGE: only devcontainers/ansible/Dockerfile
      # does. Dockerfile.podman starts from python:3.14-slim-trixie, and the
      # others do not reference it at all, so they must not be handed an
      # unconsumed build-arg. template marks the images whose stack's
      # devcontainer.json is brought up on them; cli, the images with a
      # Dev Containers CLI check at all.
      - name: Resolve the image's files
        id: files
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          TARGET=""
          case "${IMAGE}" in
            ansible-podman)
              DOCKERFILE=devcontainers/ansible/Dockerfile.podman
              CONFIGS="ansible ansible-podman"
              ;;
            terraform-aws|ansible-aws)
              DOCKERFILE="devcontainers/${IMAGE%-aws}/Dockerfile"
              TARGET="${IMAGE}"
              CONFIGS="${IMAGE%-aws} ${IMAGE}"
              ;;
            terraform|ansible)
              DOCKERFILE="devcontainers/${IMAGE}/Dockerfile"
              CONFIGS="${IMAGE} no-aws"
              ;;
            *)
              DOCKERFILE="devcontainers/${IMAGE}/Dockerfile"
              CONFIGS="${IMAGE}"
              ;;
          esac
          case "${IMAGE}" in
            ansible|ansible-aws)
              BASE_FROM_RUN=true
              ;;
            *)
              BASE_FROM_RUN=false
              ;;
          esac
          case "${IMAGE}" in
            ansible|terraform|golang|latex)
              TEMPLATE=true
              CLI=true
              ;;
            ansible-podman)
              TEMPLATE=false
              CLI=true
              ;;
            *)
              TEMPLATE=false
              CLI=false
              ;;
          esac
          {
            echo "dockerfile=${DOCKERFILE}"
            echo "target=${TARGET}"
            echo "configs=${CONFIGS}"
            echo "base_from_run=${BASE_FROM_RUN}"
            echo "template=${TEMPLATE}"
            echo "cli=${CLI}"
          } >> "$GITHUB_OUTPUT"

      # This job runs whatever base's result (see its if). An image built on
      # base has no layout to build on when base did not succeed, and building
      # it on any other base would test another image: stop here, saying so,
      # instead of at the layout's download.
      - name: Check this run built the base
        if: steps.files.outputs.base_from_run == 'true' && needs.base.result != 'success'
        env:
          BASE_RESULT: ${{ needs.base.result }}
        run: |
          echo "::error::base ${BASE_RESULT} in this run; not testing ${IMAGE_REF} on another base."
          exit 1

      # As build-containers.yml publishes: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      # Not made the default builder: the Dev Containers CLI builds its feature
      # and UID layers FROM the image this job loads, and only the daemon's own
      # builder sees the daemon's images. The build below names this one.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container
          use: false

      - name: Download the base layout
        if: steps.files.outputs.base_from_run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: devcontainer-base-layout
          path: ${{ runner.temp }}/devcontainer-base

      # The layout must be the base the base job built and checked: its index
      # names that job's manifest digest and nothing else, and every blob is
      # named after its own sha256, so one that changed on the way fails here.
      - name: Check the base layout
        if: steps.files.outputs.base_from_run == 'true'
        env:
          EXPECTED: ${{ needs.base.outputs.digest }}
          LAYOUT: ${{ runner.temp }}/devcontainer-base
        run: |
          set -euo pipefail
          DIGESTS="$(jq -r '.manifests[].digest' "${LAYOUT}/index.json")"
          if [ -z "${EXPECTED}" ] || [ "${DIGESTS}" != "${EXPECTED}" ]; then
            echo "::error::The base layout holds ${DIGESTS:-nothing}, not the base built in this run (${EXPECTED:-no digest})"
            exit 1
          fi
          cd "${LAYOUT}/blobs/sha256"
          for BLOB in *; do
            printf '%s  %s\n' "${BLOB}" "${BLOB}"
          done | sha256sum --check --strict --quiet
          echo "Base layout ${EXPECTED}: index and every blob verified."

      # Registry cache-to only on a push: a pull request reads the cache
      # and never writes it, so no pull request, Renovate's included, can
      # put layers into the cache that develop and main build from. A fork
      # gets the Actions cache instead, from and to: its writes are scoped to
      # the pull request's ref, which no other ref reads.
      - name: Determine cache strategy
        id: cache
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] \
            && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            {
              echo "cache_from=type=gha,scope=${IMAGE}"
              echo "cache_to=type=gha,scope=${IMAGE}"
              echo "login=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CACHE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${IMAGE}:buildcache"
          # Probed, as build-containers.yml does: a missing cache-from ref
          # has been a fatal error in some BuildKit versions, and a new image
          # has no :buildcache until a push writes the first.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "cache_from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "cache_from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached."
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            {
              echo "cache_to=type=registry,ref=${CACHE_REF},mode=max"
              echo "login=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "cache_to="
              echo "login=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.cache.outputs.login == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.image }}
          tags: type=raw,value=ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.epoch.outputs.created }}
            org.opencontainers.image.version=sha-{{sha}}

      # Each Dockerfile labels its own description; metadata-action's
      # repository-wide one would replace it.
      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ steps.files.outputs.dockerfile }}
          target: ${{ steps.files.outputs.target }}
          push: false
          # Loaded like `load: true`, plus the timestamp rewrite the published
          # images get, so what this job tests is built the way
          # build-containers.yml publishes it: the stale-bytecode structure
          # test can only fail on an image whose mtimes were rewritten.
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.IMAGE_REF }}
          labels: ${{ steps.labels.outputs.labels }}
          # BASE_IMAGE names the build context below, which a FROM resolves
          # before any registry, so the image sits on the base this run built,
          # by the digest checked above. Without the context the name would be
          # looked up as docker.io/library/devcontainer-base, which does not
          # exist: the build fails instead of falling back to the pin. An
          # image without base_from_run gets neither line.
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
            ${{ steps.files.outputs.base_from_run == 'true' && 'BASE_IMAGE=devcontainer-base' || '' }}
          build-contexts: |
            ${{ steps.files.outputs.base_from_run == 'true' && format('devcontainer-base=oci-layout://{0}/devcontainer-base@{1}', runner.temp, needs.base.outputs.digest) || '' }}
          cache-from: |
            ${{ steps.cache.outputs.cache_from }}
          cache-to: |
            ${{ steps.cache.outputs.cache_to }}
          platforms: linux/amd64

      # The ID every check below asserts before it runs.
      - name: Record the image under test
        id: image
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' -- "${IMAGE_REF}")"
          echo "${IMAGE_REF} is ${IMAGE_ID}"
          echo "id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"

      # Size gate, first, so an oversized image fails in seconds. It compares
      # `docker image inspect` .Size with the image's max_uncompressed_mib in
      # .github/image-size-budgets.json and fails the job when it is over.
      # Uncompressed because that is the one faithful size here: nothing is
      # pushed, so there is no registry manifest to read, and the layers this
      # job exports are not compressed the way build-containers.yml publishes
      # them (zstd), so their size would not be the download either. On this
      # runner's classic overlay2 store .Size is the sum of the files in the
      # image's layers, which is what the budgets were measured as. The script
      # also fails closed (exit 2) when it cannot judge: an image with no
      # budget, a budgets file it cannot read, a docker error, or a Docker on
      # the containerd image store, where .Size counts something else.
      # Raising a budget is a reviewed edit to that file.
      - name: Check ${{ matrix.image }} image size against its budget
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          python3 scripts/check-image-size.py local --image "${IMAGE_REF}" --name "${IMAGE}"

      - name: Smoke test ${{ matrix.image }} container
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          docker run --rm "${IMAGE_REF}" \
            bash -lc "echo '${IMAGE} container is healthy' && whoami && which bash"

      - name: Install container-structure-test
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          # Pinned, over HTTPS, and checked against the release's
          # checksums.txt before the binary is ever made executable.
          set -euo pipefail
          BASE_URL="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
          DEST="$(mktemp -d)"
          # --retry: a 504 from GitHub releases broke builds on 2026-09-14.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/container-structure-test-linux-amd64" -o "${DEST}/container-structure-test-linux-amd64"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/checksums.txt" -o "${DEST}/checksums.txt"
          (cd "${DEST}" && grep ' container-structure-test-linux-amd64$' checksums.txt | sha256sum --check --strict -)
          install -m 0755 "${DEST}/container-structure-test-linux-amd64" /usr/local/bin/container-structure-test
          rm -rf "${DEST}"

      - name: Run the structure tests for ${{ matrix.image }}
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          STRUCTURE_TESTS: ${{ steps.files.outputs.configs }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          read -r -a TEST_FILES <<< "${STRUCTURE_TESTS}"
          ARGS=()
          for TEST_FILE in "${TEST_FILES[@]}"; do
            ARGS+=(--config "tests/container-structure/${TEST_FILE}.yaml")
          done
          container-structure-test test --image "${IMAGE_REF}" "${ARGS[@]}"

      # The structure tests only ask podman for its version, and `podman run`
      # failed in the image for lack of pasta with all of them green. Privileged
      # because Docker's default seccomp profile stops rootless podman at
      # "cannot clone: Operation not permitted". Retried for quay.io, which the
      # script pulls from.
      - name: Run the podman smoke test
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'ansible-podman' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          for ATTEMPT in 1 2 3; do
            if docker run --rm --privileged "${IMAGE_REF}" podman-smoke-test; then
              exit 0
            fi
            echo "::warning::podman smoke test attempt ${ATTEMPT} failed; retrying"
            sleep "$((ATTEMPT * 20))"
          done
          echo "::error::podman smoke test failed after 3 attempts"
          exit 1

      - name: Assert the image before the scan
        id: scan_image
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"

      # JSON rather than the default SARIF, which nothing here uploads: its
      # levels are relative to severity-cutoff, so at critical a high finding
      # reads as a warning, while the JSON names each finding's severity.
      - name: Scan image with Grype
        id: grype
        if: ${{ !cancelled() && steps.scan_image.outcome == 'success' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: ${{ env.IMAGE_REF }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: "true"
          output-format: json

      # Fixable high findings do not fail a pull request: CI blocks on
      # critical, the owner's decision. build-containers.yml tags nothing
      # with a fixable high finding, so each warning here is one that would
      # hold back the publish of this image after the merge.
      - name: Annotate fixable high findings
        if: ${{ !cancelled() && steps.grype.outputs.json != '' }}
        env:
          REPORT: ${{ steps.grype.outputs.json }}
        run: |
          set -euo pipefail
          if [ ! -f "${REPORT}" ] || ! jq -e '.matches | type == "array"' "${REPORT}" >/dev/null; then
            echo "::warning::No readable Grype report for ${IMAGE_REF}; its fixable high findings are not listed"
            exit 0
          fi
          mapfile -t FINDINGS < <(jq -r '.matches[]
            | select(.vulnerability.severity == "High")
            | "\(.vulnerability.id) in \(.artifact.name) \(.artifact.version), fixed in \(.vulnerability.fix.versions // [] | join(", "))"' \
            "${REPORT}" | sort -u)
          echo "Fixable high findings in ${IMAGE_REF}: ${#FINDINGS[@]}"
          if [ "${#FINDINGS[@]}" -eq 0 ]; then
            exit 0
          fi
          # GitHub shows ten annotations a step; the summary lists them all.
          for FINDING in "${FINDINGS[@]}"; do
            echo "::warning title=Fixable high finding in ${IMAGE_REF}::${FINDING}"
          done
          {
            echo "### ${IMAGE_REF}: ${#FINDINGS[@]} fixable high finding(s), not blocking here"
            echo ""
            printf -- '- %s\n' "${FINDINGS[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the image before its SBOM
        id: sbom_image
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"

      - name: Generate the SBOM of ${{ matrix.image }}
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          # The upload step below names it: the action's own upload would add
          # a second artifact.
          upload-artifact: false
          output-file: ${{ runner.temp }}/presubmit-sbom-${{ matrix.image }}.spdx.json
          format: spdx-json

      # What sbom-verification.yml's checks could fail on: an SBOM that is not
      # JSON, or that has no package list. Its NTIA, license and Grype steps
      # could not fail and are gone. An empty list fails too: an SBOM of
      # nothing describes no image.
      - name: Check the SBOM of ${{ matrix.image }}
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        env:
          SBOM: ${{ runner.temp }}/presubmit-sbom-${{ matrix.image }}.spdx.json
        run: |
          set -euo pipefail
          PACKAGES="$(jq -e '.packages | if type == "array" and length > 0 then length else error("no packages") end' "${SBOM}")"
          echo "${IMAGE_REF}: ${PACKAGES} packages in the SBOM"

      # presubmit: the SBOM of this run's amd64 build, not of a published
      # image. release.yml attaches the released digests' SBOMs.
      - name: Upload the SBOM of ${{ matrix.image }}
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: presubmit-sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/presubmit-sbom-${{ matrix.image }}.spdx.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Cache npm packages
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.cli == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-devcontainers-${{ runner.os }}-${{ hashFiles('scripts/devcontainers-cli/package-lock.json') }}
          restore-keys: npm-devcontainers-${{ runner.os }}-

      - name: Install Dev Containers CLI
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.cli == 'true' }}
        run: |
          # npm ci against a committed lockfile, not `npm install <pkg>@<ver>`.
          # The version pin alone left the transitive tree free to resolve
          # afresh on every run, with no integrity check on what arrived --
          # Scorecard counted it under Pinned-Dependencies, and it is the same
          # class of hole the bare `pip install` steps had. The lock carries an
          # integrity hash per package; Renovate manages the version in
          # scripts/devcontainers-cli/package.json through its npm manager.
          #
          # --ignore-scripts: no lifecycle script from the package or its deps
          # runs at install time.
          npm ci --ignore-scripts --prefix scripts/devcontainers-cli
          echo "${GITHUB_WORKSPACE}/scripts/devcontainers-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify devcontainer config
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.template == 'true' }}
        env:
          STACK: ${{ matrix.image }}
        run: |
          set -euo pipefail
          for CONFIG in devcontainer.json local-build/devcontainer.json; do
            if [ ! -f "devcontainers/${STACK}/${CONFIG}" ]; then
              echo "::error::devcontainers/${STACK}/${CONFIG} is missing"
              exit 1
            fi
            echo "Checking devcontainers/${STACK}/${CONFIG}"
            jq . "devcontainers/${STACK}/${CONFIG}"
          done

      # The stack's devcontainer.json as it ships, on the image this job built
      # instead of the published one it pins: its lifecycle commands, mounts
      # and users are the template's. It used to be local-build/, which
      # scripts/check-devcontainer-images.py keeps identical apart from name,
      # image and build, rebuilding the image from its Dockerfile.
      - name: Test devcontainer up
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.template == 'true' }}
        env:
          STACK: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          # A directory of its own: the CLI takes no other file name than
          # devcontainer.json.
          CONFIG_DIR="$(mktemp -d)"
          CONFIG="${CONFIG_DIR}/devcontainer.json"
          jq --arg image "${IMAGE_REF}" '.image = $image' \
            "devcontainers/${STACK}/devcontainer.json" > "${CONFIG}"
          # From the repository root: the template's workspaceMount is
          # ${localWorkspaceFolder}.
          DEVCONTAINER_ARGS=(--workspace-folder . --config "${CONFIG}")
          # The CLI builds through a generated Dockerfile whose own
          # '# syntax=docker/dockerfile:1.27' directive forces an
          # unauthenticated docker.io pull on every run. Anonymous Docker Hub
          # pulls are rate-limited per source IP and runners share a NAT pool,
          # so this resolves outside our control and fails in bursts: on
          # 2026-09-14 it reset main's CI with 'connection reset by peer'
          # against auth.docker.io while the identical tree had passed on
          # develop two hours earlier, and a bare re-run went green. Retry
          # rather than pin: the directive lives in a Dockerfile the CLI
          # generates at build time, so pinning ours does not affect it.
          #
          # --remove-existing-container so that a retry runs the lifecycle
          # again. Without it a postCreateCommand failure on attempt 1 left the
          # container behind, attempt 2 reused it, skipped the lifecycle and
          # reported success, and the job went green on a template that fails
          # for every user who opens it (run 41140335315, latex).
          for ATTEMPT in 1 2 3; do
            if devcontainer up --remove-existing-container "${DEVCONTAINER_ARGS[@]}"; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "::error::devcontainer up failed after 3 attempts"
              exit 1
            fi
            echo "::warning::devcontainer up attempt ${ATTEMPT} failed; retrying"
            sleep "$((ATTEMPT * 20))"
          done
          # jq fails on a mount written as an object, instead of skipping it.
          VOLUME_TARGETS="$(jq -r '.mounts // [] | .[]
            | select(test("(^|,)type=volume(,|$)"))
            | capture("(^|,)target=(?<target>[^,]+)").target' "${CONFIG}")"
          VOLUME_TARGET_ARGS=()
          if [ -n "${VOLUME_TARGETS}" ]; then
            mapfile -t VOLUME_TARGET_ARGS <<< "${VOLUME_TARGETS}"
          fi
          # The repository root is the template's workspaceMount, /workspace.
          devcontainer exec "${DEVCONTAINER_ARGS[@]}" -- \
            bash /workspace/scripts/check-devcontainer-workload.sh "${STACK}" "${VOLUME_TARGET_ARGS[@]}"
          # no 'devcontainer stop' subcommand exists; the runner cleans up

      # The docker-in-docker profile, which only ansible has. Its feature starts
      # dockerd from the container's entrypoint, through sudo unless the
      # container runs as root, and the images have no working sudo (no rules
      # since 1a62ea6, no package since): no dockerd, and `devcontainer up` still
      # reported success. The script brings it up on the image this job built.
      - name: Test the docker-in-docker profile
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'ansible' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          IMAGE="${IMAGE_REF}" bash scripts/test-devcontainer-profile.sh ansible devcontainer.dind.json 'docker info'

      # The docker-socket profile, which ansible and terraform have. It used to
      # mount the socket and stop there: the images have no docker CLI, vscode
      # is not in the socket's group, and `devcontainer up` reported success. Its
      # feature adds both, again from an entrypoint that needs root. docker
      # version asks the runner's own daemon, so it fails without that access.
      - name: Test the docker-socket profile
        if: ${{ !cancelled() && steps.image.outcome == 'success' && (matrix.image == 'ansible' || matrix.image == 'terraform') }}
        env:
          STACK: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          IMAGE="${IMAGE_REF}" bash scripts/test-devcontainer-profile.sh "${STACK}" devcontainer.docker-socket.json 'docker version'

      # The podman profile, which only ansible has, on the image Dockerfile.podman
      # builds. The podman smoke test above runs under `docker run --privileged`,
      # so it never saw the template, whose --userns=keep-id stopped Docker at
      # once with "invalid USER mode". The check is the smoke test plus a
      # playbook in the Execution Environment, what the profile is for and
      # nothing ran before: a 1.4 GB pull from ghcr.io. Two attempts, for
      # ghcr.io and quay.io: there is no daemon to wait for here, and the
      # default 30 would take most of this job's timeout to fail.
      - name: Test the podman profile
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'ansible-podman' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          IMAGE="${IMAGE_REF}" CHECK_ATTEMPTS=2 \
            bash scripts/test-devcontainer-profile.sh ansible devcontainer.podman.json 'podman-smoke-test --ee'

      # resume.tex compiled with tectonic on the image this job built. It used
      # to run only on develop and main pushes, in scenario-tests, on a latex
      # and a base image of its own (base, which latex does not take).
      - name: Run the LaTeX scenario
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'latex' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          bash scripts/scenarios/run-latex-cv.sh --image "${IMAGE_REF}"

  unit-tests:
    name: Python Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["${{ needs.changes.outputs.python_version }}"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ -n "$(ls -A tests/*.py 2>/dev/null)" ]; then
            uv run pytest tests/ \
              --verbose \
              --tb=short \
              --maxfail=5 \
              --no-cov \
              -p no:ansible \
              -p no:pytest-ansible
          else
            echo "::notice::No Python tests found, skipping"
          fi

  ansible-test:
    name: Ansible Test
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run ansible-test
        run: |
          if [ -x "./scripts/run-ansible-tests.sh" ]; then
            ./scripts/run-ansible-tests.sh
          else
            echo "::notice::ansible-test script not found"
          fi
        env:
          ANSIBLE_TEST_PYTHON_VERSION: ${{ needs.changes.outputs.python_version }}

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    needs: [changes, test-playbooks]
    if: |
      needs.changes.outputs.ansible == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ansible 13.x (core 2.20) requires Python >= 3.12 on the node where
        # the tooling is installed: debian13 ships 3.13, ubuntu2404 ships 3.12
        distro: [debian13, ubuntu2404]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule
        run: |
          set -euo pipefail

          run_scenario() {
            scenario="$1"
            status=0

            molecule converge --scenario-name "$scenario" || status=$?
            if [ "$status" -eq 0 ]; then
              molecule verify --scenario-name "$scenario" || status=$?
            fi

            molecule destroy --scenario-name "$scenario" || true
            return "$status"
          }

          if command -v molecule &> /dev/null; then
            for scenario in default latex ansible_environment devcontainer_base python_tools vscode_config; do
              if [ -d "molecule/${scenario}" ]; then
                run_scenario "${scenario}"
              fi
            done
          else
            echo "::notice::Molecule not installed"
          fi
        env:
          TEST_DISTRO: ${{ matrix.distro }}
          TEST_IMAGE: geerlingguy/docker-${{ matrix.distro }}-ansible:latest

  # The Terraform scenario. The LaTeX one runs in the latex image job, on
  # the image that job built; it built its own here. Both used to wait for
  # devcontainer-build, so a skipped build skipped them too.
  scenario-tests:
    name: Scenario Tests
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      needs.changes.outputs.terraform == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.changes.outputs.terraform_version }}

      - name: Run Terraform scenario
        run: |
          if [ -x "./scripts/scenarios/run-terraform-proxmox.sh" ]; then
            ./scripts/scenarios/run-terraform-proxmox.sh
          fi

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # Every job but the three aliases of required checks below, which only
    # repeat results already here under other names. There is no filesystem
    # Grype scan here any more: it sat outside this check on purpose, so it
    # decided nothing. A scan of the
    # checkout against the database of the day must not become a need: an
    # advisory published overnight for a package this repository already
    # pins would block every pull request but the fix (11 on 2026-10-26, 12
    # on 2026-08-10).
    needs:
      - changes
      - lint
      - powershell-lint
      - test-playbooks
      - devcontainer-state
      - base
      - image
      - unit-tests
      - ansible-test
      - molecule
      - scenario-tests
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of the changes job, and a quote in one of them would end
          # a single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Checking CI results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list: only "success" and "skipped" pass. A skipped job is
          # a job the changes filter decided was irrelevant, and it has to
          # stay green or every filtered pull request would be blocked.
          # "cancelled" fails with "failure": a job that hits its
          # timeout-minutes ends as cancelled, and a cancelled job proved
          # nothing. Any other result fails closed.
          #
          # A run superseded through cancel-in-progress therefore reports
          # CI Success as failed on the OLD commit. That is intended; the new
          # commit gets its own run. Do not relax this to make it green.
          failed=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "$NEEDS_JSON")

          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not pass: $failed"
            exit 1
          fi

          echo "✅ CI passed!"

  # TEMPORARY ALIAS for branch protection. Develop and main require a check
  # named "Quality Summary", which quality.yml produced. That workflow is
  # gone: its lint is the Lint job above, and its radon, vulture and bandit
  # reports, which could not fail, come back later as a real quality gate.
  # This job keeps the required name alive and passes only when Lint
  # passed. Delete it when protection moves to the single ci-gate check.
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: lint
    if: always()
    steps:
      - name: Check results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          # Allow-list: only success passes. Lint has no changes filter, so a
          # skipped Lint means the job it needs failed, and a cancelled one
          # proved nothing.
          if [ "${LINT_RESULT}" != "success" ]; then
            echo "::error::Lint did not pass (${LINT_RESULT:-no result})"
            exit 1
          fi
          echo "Lint passed."

  # TEMPORARY ALIAS for branch protection. Develop and main require a check
  # named "Test Summary", which test-containers.yml produced. Its structure
  # tests run in the image jobs above now, on the image each one built, and
  # the workflow is gone. This job keeps the required name alive. Delete it
  # when protection moves to the single ci-gate check.
  #
  # changes and lint are listed on purpose: when either fails, base and image
  # are skipped, and a skip passes, so without them this check stayed green
  # with no image tested at all.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [changes, lint, base, image]
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of the changes job, and a quote in one of them would end a
          # single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
          BASE_RESULT: ${{ needs.base.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          echo "Checking image test results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list, as CI Success: only "success" and "skipped" pass. A
          # skipped job is a job the filter decided was irrelevant, and it has
          # to stay green or every filtered pull request would be blocked.
          # "cancelled" fails with "failure": a job that hits its
          # timeout-minutes ends as cancelled, and a cancelled job proved
          # nothing. Any other result fails closed. A run superseded through
          # cancel-in-progress therefore reports this as failed on the OLD
          # commit. That is intended; the new commit gets its own run.
          FAILED=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "${NEEDS_JSON}")

          {
            echo "# Image Tests"
            echo ""
            if [ -n "${FAILED}" ]; then
              echo "❌ Jobs that did not pass: ${FAILED}"
            elif [ "${BASE_RESULT}" = "skipped" ] && [ "${IMAGE_RESULT}" = "skipped" ]; then
              echo "No image changed, so no image was built or tested."
            else
              echo "✅ All image tests passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FAILED}" ]; then
            echo "::error::Jobs that did not pass: ${FAILED}"
            exit 1
          fi

  # TEMPORARY ALIAS for branch protection. Develop and main require a check
  # named "SBOM Verification Success", which sbom-verification.yml produced.
  # Each image job above now generates its image's SBOM and fails when it is
  # unusable; the workflow's other checks (NTIA, licenses, a Grype scan of
  # the SBOMs) could not fail and are gone, with the workflow. This job keeps
  # the required name alive, and passes when the jobs that make the SBOMs
  # passed or were skipped. Delete it when protection moves to the single
  # ci-gate check.
  sbom-verification-success:
    name: SBOM Verification Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # changes and lint are listed for the reason given at Test Summary.
    needs: [changes, lint, base, image]
    if: always()
    steps:
      - name: Check results
        env:
          # Through env: see Test Summary.
          NEEDS_JSON: ${{ toJSON(needs) }}
          BASE_RESULT: ${{ needs.base.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          echo "Checking SBOM results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list, as Test Summary: only "success" and "skipped" pass.
          FAILED=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "${NEEDS_JSON}")

          {
            echo "# SBOMs"
            echo ""
            if [ -n "${FAILED}" ]; then
              echo "❌ Jobs that did not pass: ${FAILED}"
            elif [ "${BASE_RESULT}" = "skipped" ] && [ "${IMAGE_RESULT}" = "skipped" ]; then
              echo "No image changed, so no SBOM was generated."
            else
              echo "✅ Every image built here has a usable SBOM (presubmit-sbom-* artifacts)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FAILED}" ]; then
            echo "::error::Jobs that did not pass: ${FAILED}"
            exit 1
          fi
