---
name: CI Pipeline

on:
  # No paths filter here on purpose: CI Success is a required check, and one
  # that never appears blocks a pull request forever. The changes job gates
  # the work instead.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_FORCE_COLOR: "1"
  # No Python, Go or Terraform version here on purpose: the changes job
  # derives them from the Dockerfiles that ship them, so CI cannot drift from
  # the images. See scripts/derive-toolchain-versions.sh.
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.5"
  # Must equal the pins in the Makefile and the pre-commit hook:
  # scripts/check-hadolint-parity.sh fails Dockerfile Lint otherwise.
  # HADOLINT_DIGEST is the index digest of that tag. Docker ignores the tag
  # when a digest is given, so a version bump without a digest bump keeps
  # running the old image.
  # renovate: datasource=docker depName=hadolint/hadolint
  HADOLINT_VERSION: "v2.15.1"
  HADOLINT_DIGEST: "sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d"

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      golang: ${{ steps.golang-check.outputs.enabled }}
      terraform: ${{ steps.filter.outputs.terraform }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      scripts: ${{ steps.filter.outputs.scripts }}
      hadolint: ${{ steps.filter.outputs.hadolint }}
      python: ${{ steps.filter.outputs.python }}
      python_version: ${{ steps.toolchain.outputs.python_version }}
      go_version: ${{ steps.toolchain.outputs.go_version }}
      terraform_version: ${{ steps.toolchain.outputs.terraform_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Derive toolchain versions from the Dockerfiles
        id: toolchain
        run: bash scripts/derive-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            # Note: .devcontainer/ (repo's dev environment) is intentionally excluded
            # Only devcontainers/ (published stacks) triggers devcontainer builds
            ansible:
              - 'playbooks/**'
              - 'roles/**'
              - 'collections/**'
              - 'requirements.yml'
              - 'ansible.cfg'
              - 'devcontainers/ansible/**'
              # The base Dockerfile sets the Python these jobs run on (see
              # the toolchain step below), so a base bump must exercise them.
              - 'devcontainers/base/Dockerfile'
              # playbooks/test-environment.yml asserts the installed ansible
              # against the pins in this export, and molecule converges
              # install from it.
              - 'requirements-ansible.txt'
            golang-files:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'devcontainers/golang/**'
            terraform:
              - '**/*.tf'
              - 'terraform/**'
              - 'infrastructure/**'
              - 'devcontainers/terraform/**'
            devcontainer:
              - 'devcontainers/**'
              # The CLI pin belongs here too: the devcontainer-cli-test jobs
              # are the only thing that exercises `npm ci` against it, and
              # without this a change to how the CLI is installed skips the
              # very jobs that would prove it still works. Same blind spot as
              # a published image with no gating scan.
              - 'scripts/devcontainers-cli/**'
              # The scan ignore policy decides what the image scan blocks, so
              # a change to it must run that scan. PR #546 (2026-10-12) changed
              # only this file, every build job skipped and CI went green
              # without exercising the policy it was changing.
              - '.grype.yaml'
              # Both ansible Dockerfiles install exactly this export, so a
              # lock bump changes the image as much as a Dockerfile edit and
              # must be built and scanned the same way.
              - 'requirements-ansible.txt'
            scripts:
              - 'scripts/**'
            # The files that pin hadolint and the guard that compares them,
            # so a pull request moving a single pin still runs Dockerfile
            # Lint. A filter of its own, not more paths under devcontainer:
            # that one also starts the image builds.
            hadolint:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'scripts/check-hadolint-parity.sh'
            python:
              - '**/*.py'
              - 'requirements.txt'
              - 'tests/**'
              - 'devcontainers/base/Dockerfile'
              # tests/ covers the shell scripts too (the scan gate's among
              # them), so a change to a script alone must run its tests.
              - 'scripts/**'

      - name: Check Go module exists
        id: golang-check
        env:
          GOLANG_FILES: ${{ steps.filter.outputs.golang-files }}
        run: |
          if [ -f "go.mod" ] && [ "${GOLANG_FILES}" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Go changes detected but no go.mod found, skipping Go CI"
          fi

  test-playbooks:
    name: Test Playbooks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run test playbook
        run: |
          if [ -f "playbooks/test-environment.yml" ]; then
            ansible-playbook playbooks/test-environment.yml --check
          else
            echo "::warning::Test playbook not found, skipping"
          fi

  golang-ci:
    name: Golang CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.golang == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ needs.changes.outputs.go_version }}
          cache: true

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files need formatting:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test -v -race -coverprofile=coverage.txt ./...


  terraform-ci:
    name: Terraform Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.changes.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      - name: Run Terraform validation
        run: |
          if [ -x "./scripts/run-terraform-tests.sh" ]; then
            ./scripts/run-terraform-tests.sh
          else
            echo "::notice::Terraform test script not found or not executable"
          fi

  script-lint:
    name: Script Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './scripts'
          severity: error
          ignore_paths: '*.ps1'

      - name: Lint PowerShell scripts
        if: hashFiles('scripts/*.ps1') != ''
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $scripts = Get-ChildItem -Path scripts -Filter *.ps1
          foreach ($script in $scripts) {
            Write-Host "Analyzing $($script.Name)"
            Invoke-ScriptAnalyzer -Path $script.FullName -Recurse
          }
        continue-on-error: true

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true' || needs.changes.outputs.hadolint == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check hadolint version parity
        run: bash scripts/check-hadolint-parity.sh

      - name: Run hadolint on each Dockerfile
        run: |
          # Dockerfile*, not Dockerfile: the narrower glob never linted
          # devcontainers/ansible/Dockerfile.podman.
          for dockerfile in devcontainers/*/Dockerfile*; do
            if [ -f "$dockerfile" ]; then
              echo "Linting $dockerfile"
              docker run --rm -i "hadolint/hadolint:${HADOLINT_VERSION}@${HADOLINT_DIGEST}" hadolint \
                --failure-threshold error \
                - < "$dockerfile"
            fi
          done

  devcontainer-state:
    name: Devcontainer State
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true' || needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Verify active .devcontainer metadata
        run: python3 scripts/devcontainer-metadata.py

      - name: Verify active .devcontainer sync
        run: python3 scripts/devcontainer-diff.py

      - name: Run devcontainer doctor
        run: bash scripts/doctor-devcontainer.sh


  devcontainer-build:
    name: Build Devcontainer (${{ matrix.stack }}${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    needs: [changes, dockerfile-lint]
    if: needs.changes.outputs.devcontainer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: ansible
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          - stack: terraform
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          - stack: golang
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          - stack: latex
            dockerfile: Dockerfile
            variant: ""
            platforms: linux/amd64
          # The podman variant is published by build-containers.yml, whose
          # Grype step is report-only (fail-build false, continue-on-error),
          # and it was absent from this matrix -- the one image with no
          # blocking scan anywhere. It silently accumulated 23 CRITICAL
          # alerts by 2026-09-13 while every gated image sat at zero.
          - stack: ansible
            dockerfile: Dockerfile.podman
            variant: -podman
            platforms: linux/amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Determine cache strategy
        id: cache
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          IMAGE_STACK: ${{ matrix.stack }}${{ matrix.variant }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] \
            && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "cache_from=type=gha,scope=${IMAGE_STACK}" >>"$GITHUB_OUTPUT"
            echo "cache_to=type=gha,scope=${IMAGE_STACK}" >>"$GITHUB_OUTPUT"
            echo "use_registry=false" >>"$GITHUB_OUTPUT"
          else
            CACHE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${IMAGE_STACK}:buildcache"
            echo "cache_from=type=registry,ref=${CACHE_REF}" >>"$GITHUB_OUTPUT"
            echo "cache_to=type=registry,ref=${CACHE_REF},mode=max" >>"$GITHUB_OUTPUT"
            echo "use_registry=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.cache.outputs.use_registry == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}${{ matrix.variant }}
          tags: type=raw,value=ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Each Dockerfile labels its own description; metadata-action's
      # repository-wide one would replace it.
      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      - name: Prepare build metadata
        id: buildmeta
        run: |
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.stack }}${{ matrix.variant }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: devcontainers/${{ matrix.stack }}/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: devcontainer-${{ matrix.stack }}${{ matrix.variant }}:ci
          labels: ${{ steps.labels.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.buildmeta.outputs.created }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            ${{ steps.cache.outputs.cache_from }}
          cache-to: |
            ${{ steps.cache.outputs.cache_to }}
          platforms: ${{ matrix.platforms }}

      - name: Smoke test ${{ matrix.stack }}${{ matrix.variant }} container
        env:
          IMAGE_STACK: ${{ matrix.stack }}${{ matrix.variant }}
        run: |
          docker run --rm "devcontainer-${IMAGE_STACK}:ci" \
            bash -lc "echo '${IMAGE_STACK} container is healthy' && whoami && which bash"

      - name: Scan image with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: devcontainer-${{ matrix.stack }}${{ matrix.variant }}:ci
          severity-cutoff: critical
          only-fixed: true
          fail-build: "true"

  devcontainer-cli-test:
    name: DevContainer CLI (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: [changes, devcontainer-build]
    if: needs.changes.outputs.devcontainer == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [ansible, golang, terraform, latex]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-devcontainers-${{ runner.os }}-${{ hashFiles('scripts/devcontainers-cli/package-lock.json') }}
          restore-keys: npm-devcontainers-${{ runner.os }}-

      - name: Install Dev Containers CLI
        run: |
          # npm ci against a committed lockfile, not `npm install <pkg>@<ver>`.
          # The version pin alone left the transitive tree free to resolve
          # afresh on every run, with no integrity check on what arrived --
          # Scorecard counted it under Pinned-Dependencies, and it is the same
          # class of hole the bare `pip install` steps had. The lock carries an
          # integrity hash per package; Renovate manages the version in
          # scripts/devcontainers-cli/package.json through its npm manager, so
          # the '# renovate:' annotation this step used to carry is no longer
          # needed.
          #
          # --ignore-scripts: no lifecycle script from the package or its deps
          # runs at install time.
          npm ci --ignore-scripts --prefix scripts/devcontainers-cli
          echo "${GITHUB_WORKSPACE}/scripts/devcontainers-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify devcontainer config
        env:
          STACK: ${{ matrix.stack }}
        run: |
          if [ -f "devcontainers/${STACK}/devcontainer.json" ]; then
            echo "Checking devcontainers/${STACK}/devcontainer.json"
            cat "devcontainers/${STACK}/devcontainer.json" | jq .
          else
            echo "::warning::No devcontainer.json found for ${STACK}"
          fi

      - name: Test devcontainer up
        env:
          STACK: ${{ matrix.stack }}
        run: |
          if [ -f "devcontainers/${STACK}/devcontainer.json" ]; then
            cd "devcontainers/${STACK}"
            DEVCONTAINER_ARGS=(--workspace-folder . --config devcontainer.json)
            # The CLI builds through a generated Dockerfile-with-features whose
            # own '# syntax=docker/dockerfile:1.27' directive forces an
            # unauthenticated docker.io pull on every run. Anonymous Docker Hub
            # pulls are rate-limited per source IP and runners share a NAT pool,
            # so this resolves outside our control and fails in bursts: on
            # 2026-09-14 it reset main's CI with 'connection reset by peer'
            # against auth.docker.io while the identical tree had passed on
            # develop two hours earlier, and a bare re-run went green. Retry
            # rather than pin: the directive lives in a Dockerfile the CLI
            # generates at build time, so pinning ours does not affect it.
            for attempt in 1 2 3; do
              if devcontainer up "${DEVCONTAINER_ARGS[@]}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::devcontainer up failed after 3 attempts"
                exit 1
              fi
              echo "::warning::devcontainer up attempt ${attempt} failed; retrying"
              sleep "$((attempt * 20))"
            done
            devcontainer exec "${DEVCONTAINER_ARGS[@]}" -- bash -c "echo '${STACK} container is running'"
            # no 'devcontainer stop' subcommand exists; the runner cleans up
          fi

  unit-tests:
    name: Python Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["${{ needs.changes.outputs.python_version }}"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ -n "$(ls -A tests/*.py 2>/dev/null)" ]; then
            uv run pytest tests/ \
              --verbose \
              --tb=short \
              --maxfail=5 \
              --no-cov \
              -p no:ansible \
              -p no:pytest-ansible
          else
            echo "::notice::No Python tests found, skipping"
          fi

  ansible-test:
    name: Ansible Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run ansible-test
        run: |
          if [ -x "./scripts/run-ansible-tests.sh" ]; then
            ./scripts/run-ansible-tests.sh
          else
            echo "::notice::ansible-test script not found"
          fi
        env:
          ANSIBLE_TEST_PYTHON_VERSION: ${{ needs.changes.outputs.python_version }}

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: [changes, test-playbooks]
    if: |
      needs.changes.outputs.ansible == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ansible 13.x (core 2.20) requires Python >= 3.12 on the node where
        # the tooling is installed: debian13 ships 3.13, ubuntu2404 ships 3.12
        distro: [debian13, ubuntu2404]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule
        run: |
          set -euo pipefail

          run_scenario() {
            scenario="$1"
            status=0

            molecule converge --scenario-name "$scenario" || status=$?
            if [ "$status" -eq 0 ]; then
              molecule verify --scenario-name "$scenario" || status=$?
            fi

            molecule destroy --scenario-name "$scenario" || true
            return "$status"
          }

          if command -v molecule &> /dev/null; then
            for scenario in default latex ansible_environment devcontainer_base python_tools vscode_config; do
              if [ -d "molecule/${scenario}" ]; then
                run_scenario "${scenario}"
              fi
            done
          else
            echo "::notice::Molecule not installed"
          fi
        env:
          TEST_DISTRO: ${{ matrix.distro }}
          TEST_IMAGE: geerlingguy/docker-${{ matrix.distro }}-ansible:latest

  scenario-tests:
    name: Scenario Tests
    runs-on: ubuntu-latest
    needs: [changes, devcontainer-build]
    if: |
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        if: needs.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.changes.outputs.terraform_version }}

      - name: Run Terraform scenario
        if: needs.changes.outputs.terraform == 'true'
        run: |
          if [ -x "./scripts/scenarios/run-terraform-proxmox.sh" ]; then
            ./scripts/scenarios/run-terraform-proxmox.sh
          fi

      - name: Run LaTeX scenario
        run: |
          if [ -x "./scripts/scenarios/run-latex-cv.sh" ]; then
            ./scripts/scenarios/run-latex-cv.sh
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    # PRs get the scan too so dependency vulns surface before merge;
    # SARIF upload stays main-only (PR uploads pollute branch alerts)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run filesystem scan with Grype
        id: grype-fs
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          path: "."
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        if: always() && github.event_name == 'push'
        with:
          sarif_file: ${{ steps.grype-fs.outputs.sarif }}
          category: grype-fs

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - changes
      - test-playbooks
      - golang-ci
      - terraform-ci
      - script-lint
      - dockerfile-lint
      - devcontainer-build
      - devcontainer-cli-test
      - unit-tests
      - ansible-test
      - molecule
      - scenario-tests
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of the changes job, and a quote in one of them would end
          # a single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Checking CI results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list: only "success" and "skipped" pass. A skipped job is
          # a job the changes filter decided was irrelevant, and it has to
          # stay green or every filtered pull request would be blocked.
          # "cancelled" fails with "failure": a job that hits its
          # timeout-minutes ends as cancelled, and a cancelled job proved
          # nothing. Any other result fails closed.
          #
          # A run superseded through cancel-in-progress therefore reports
          # CI Success as failed on the OLD commit. That is intended; the new
          # commit gets its own run. Do not relax this to make it green.
          failed=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "$NEEDS_JSON")

          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not pass: $failed"
            exit 1
          fi

          echo "✅ CI passed!"
