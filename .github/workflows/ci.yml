---
name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_FORCE_COLOR: "1"
  PYTHON_VERSION: "3.13"
  GO_VERSION: "1.25"
  TERRAFORM_VERSION: "1.15.7"

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      golang: ${{ steps.golang-check.outputs.enabled }}
      terraform: ${{ steps.filter.outputs.terraform }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      scripts: ${{ steps.filter.outputs.scripts }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            # Note: .devcontainer/ (repo's dev environment) is intentionally excluded
            # Only devcontainers/ (published stacks) triggers devcontainer builds
            ansible:
              - 'playbooks/**'
              - 'roles/**'
              - 'collections/**'
              - 'requirements.yml'
              - 'ansible.cfg'
              - 'devcontainers/ansible/**'
            golang-files:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'devcontainers/golang/**'
            terraform:
              - '**/*.tf'
              - 'terraform/**'
              - 'infrastructure/**'
              - 'devcontainers/terraform/**'
            devcontainer:
              - 'devcontainers/**'
            scripts:
              - 'scripts/**'
            python:
              - '**/*.py'
              - 'requirements.txt'
              - 'tests/**'

      - name: Check Go module exists
        id: golang-check
        run: |
          if [ -f "go.mod" ] && [ "${{ steps.filter.outputs.golang-files }}" == "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::Go changes detected but no go.mod found, skipping Go CI"
          fi

  test-playbooks:
    name: Test Playbooks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run test playbook
        run: |
          if [ -f "playbooks/test-environment.yml" ]; then
            ansible-playbook playbooks/test-environment.yml --check
          else
            echo "::warning::Test playbook not found, skipping"
          fi

  golang-ci:
    name: Golang CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.golang == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files need formatting:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test -v -race -coverprofile=coverage.txt ./...


  terraform-ci:
    name: Terraform Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      - name: Run Terraform validation
        run: |
          if [ -x "./scripts/run-terraform-tests.sh" ]; then
            ./scripts/run-terraform-tests.sh
          else
            echo "::notice::Terraform test script not found or not executable"
          fi

  script-lint:
    name: Script Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './scripts'
          severity: error
          ignore_paths: '*.ps1'

      - name: Lint PowerShell scripts
        if: hashFiles('scripts/*.ps1') != ''
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $scripts = Get-ChildItem -Path scripts -Filter *.ps1
          foreach ($script in $scripts) {
            Write-Host "Analyzing $($script.Name)"
            Invoke-ScriptAnalyzer -Path $script.FullName -Recurse
          }
        continue-on-error: true

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run hadolint on each Dockerfile
        run: |
          for dockerfile in devcontainers/*/Dockerfile; do
            if [ -f "$dockerfile" ]; then
              echo "Linting $dockerfile"
              docker run --rm -i hadolint/hadolint:v2.14.0 hadolint \
                --failure-threshold error \
                - < "$dockerfile"
            fi
          done

  devcontainer-state:
    name: Devcontainer State
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true' || needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify active .devcontainer metadata
        run: python3 scripts/devcontainer-metadata.py

      - name: Verify active .devcontainer sync
        run: python3 scripts/devcontainer-diff.py

      - name: Run devcontainer doctor
        run: bash scripts/doctor-devcontainer.sh


  devcontainer-build:
    name: Build Devcontainer (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    needs: [changes, dockerfile-lint]
    if: needs.changes.outputs.devcontainer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: ansible
            platforms: linux/amd64
          - stack: terraform
            platforms: linux/amd64
          - stack: golang
            platforms: linux/amd64
          - stack: latex
            platforms: linux/amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker-container

      - name: Determine cache strategy
        id: cache
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.event.pull_request.head.repo.full_name || '' }}" != "${{ github.repository }}" ]; then
            echo "cache_from=type=gha,scope=${{ matrix.stack }}" >>"$GITHUB_OUTPUT"
            echo "cache_to=type=gha,scope=${{ matrix.stack }}" >>"$GITHUB_OUTPUT"
            echo "use_registry=false" >>"$GITHUB_OUTPUT"
          else
            CACHE_REF="ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}:buildcache"
            echo "cache_from=type=registry,ref=${CACHE_REF}" >>"$GITHUB_OUTPUT"
            echo "cache_to=type=registry,ref=${CACHE_REF},mode=max" >>"$GITHUB_OUTPUT"
            echo "use_registry=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.cache.outputs.use_registry == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}
          tags: type=raw,value=ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prepare build metadata
        id: buildmeta
        run: |
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.stack }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: devcontainers/${{ matrix.stack }}/Dockerfile
          push: false
          load: true
          tags: devcontainer-${{ matrix.stack }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.buildmeta.outputs.created }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            ${{ steps.cache.outputs.cache_from }}
          cache-to: |
            ${{ steps.cache.outputs.cache_to }}
          platforms: ${{ matrix.platforms }}

      - name: Smoke test ${{ matrix.stack }} container
        run: |
          docker run --rm devcontainer-${{ matrix.stack }}:ci \
            bash -lc "echo '${{ matrix.stack }} container is healthy' && whoami && which bash"

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: devcontainer-${{ matrix.stack }}:ci
          severity-cutoff: critical
          only-fixed: true
          fail-build: "true"

  devcontainer-cli-test:
    name: DevContainer CLI (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: [changes, devcontainer-build]
    if: needs.changes.outputs.devcontainer == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [ansible, golang, terraform, latex]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm-global
          key: npm-devcontainers-${{ runner.os }}
          restore-keys: npm-devcontainers-

      - name: Install Dev Containers CLI
        env:
          # renovate: datasource=npm depName=@devcontainers/cli
          DEVCONTAINERS_CLI_VERSION: 0.88.0
        run: |
          export NPM_CONFIG_PREFIX="$HOME/.npm-global"
          # --ignore-scripts: no lifecycle script from the package or its
          # deps runs at install time. Version pinned so the toolchain is
          # reproducible (Renovate keeps it current).
          npm install --global --ignore-scripts "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Verify devcontainer config
        run: |
          if [ -f "devcontainers/${{ matrix.stack }}/devcontainer.json" ]; then
            echo "Checking devcontainers/${{ matrix.stack }}/devcontainer.json"
            cat devcontainers/${{ matrix.stack }}/devcontainer.json | jq .
          else
            echo "::warning::No devcontainer.json found for ${{ matrix.stack }}"
          fi

      - name: Test devcontainer up
        run: |
          if [ -f "devcontainers/${{ matrix.stack }}/devcontainer.json" ]; then
            cd devcontainers/${{ matrix.stack }}
            DEVCONTAINER_ARGS=(--workspace-folder . --config devcontainer.json)
            devcontainer up "${DEVCONTAINER_ARGS[@]}"
            devcontainer exec "${DEVCONTAINER_ARGS[@]}" -- bash -c "echo '${{ matrix.stack }} container is running'"
            # no 'devcontainer stop' subcommand exists; the runner cleans up
          fi

  unit-tests:
    name: Python Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ -n "$(ls -A tests/*.py 2>/dev/null)" ]; then
            uv run pytest tests/ \
              --verbose \
              --tb=short \
              --maxfail=5 \
              --no-cov \
              -p no:ansible \
              -p no:pytest-ansible
          else
            echo "::notice::No Python tests found, skipping"
          fi

  ansible-test:
    name: Ansible Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run ansible-test
        run: |
          if [ -x "./scripts/run-ansible-tests.sh" ]; then
            ./scripts/run-ansible-tests.sh
          else
            echo "::notice::ansible-test script not found"
          fi
        env:
          ANSIBLE_TEST_PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: [changes, test-playbooks]
    if: |
      needs.changes.outputs.ansible == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ansible 13.x (core 2.20) requires Python >= 3.12 on the node where
        # the tooling is installed: debian13 ships 3.13, ubuntu2404 ships 3.12
        distro: [debian13, ubuntu2404]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule
        run: |
          set -euo pipefail

          run_scenario() {
            scenario="$1"
            status=0

            molecule converge --scenario-name "$scenario" || status=$?
            if [ "$status" -eq 0 ]; then
              molecule verify --scenario-name "$scenario" || status=$?
            fi

            molecule destroy --scenario-name "$scenario" || true
            return "$status"
          }

          if command -v molecule &> /dev/null; then
            for scenario in default latex ansible_environment devcontainer_base python_tools vscode_config; do
              if [ -d "molecule/${scenario}" ]; then
                run_scenario "${scenario}"
              fi
            done
          else
            echo "::notice::Molecule not installed"
          fi
        env:
          TEST_DISTRO: ${{ matrix.distro }}
          TEST_IMAGE: geerlingguy/docker-${{ matrix.distro }}-ansible:latest

  scenario-tests:
    name: Scenario Tests
    runs-on: ubuntu-latest
    needs: [changes, devcontainer-build]
    if: |
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        if: needs.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run Terraform scenario
        if: needs.changes.outputs.terraform == 'true'
        run: |
          if [ -x "./scripts/scenarios/run-terraform-proxmox.sh" ]; then
            ./scripts/scenarios/run-terraform-proxmox.sh
          fi

      - name: Run LaTeX scenario
        run: |
          if [ -x "./scripts/scenarios/run-latex-cv.sh" ]; then
            ./scripts/scenarios/run-latex-cv.sh
          fi

  publish-base:
    name: Publish Base to GHCR
    runs-on: ubuntu-latest
    needs: [changes, devcontainer-build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.devcontainer == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          tags: |
            type=raw,value=latest
            type=raw,value=py313
            type=sha

      - name: Build and push base
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: devcontainers/base
          file: devcontainers/base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-containers:
    name: Publish ${{ matrix.stack }} to GHCR
    runs-on: ubuntu-latest
    needs: [changes, devcontainer-build, publish-base]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.devcontainer == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        stack: [ansible, golang, terraform, latex]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.stack }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: devcontainers/${{ matrix.stack }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.stack }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stack }}
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  devcontainer-ghcr-test:
    name: Test GHCR Image (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: publish-containers
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        stack: [ansible, terraform, golang, latex]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test published GHCR image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}:latest
          docker run --rm ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.stack }}:latest \
            sh -c "echo 'GHCR ${{ matrix.stack }} image healthy'"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    # PRs get the scan too so dependency vulns surface before merge;
    # SARIF upload stays main-only (PR uploads pollute branch alerts)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run filesystem scan with Grype
        id: grype-fs
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          path: "."
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        if: always() && github.event_name == 'push'
        with:
          sarif_file: ${{ steps.grype-fs.outputs.sarif }}
          category: grype-fs

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - changes
      - test-playbooks
      - golang-ci
      - terraform-ci
      - script-lint
      - dockerfile-lint
      - devcontainer-build
      - devcontainer-cli-test
      - unit-tests
      - ansible-test
      - molecule
      - scenario-tests
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Checking CI results..."
          results='${{ toJSON(needs) }}'
          echo "$results" | jq .

          failed=$(echo "$results" | jq -r '
            to_entries[]
            | select(.value.result == "failure")
            | .key
          ')

          if [ -n "$failed" ]; then
            echo "::error::Failed jobs: $failed"
            exit 1
          fi

          echo "✅ CI passed!"
