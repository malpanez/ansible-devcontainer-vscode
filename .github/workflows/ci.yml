---
name: CI Pipeline

on:
  # No paths filter here on purpose: CI Success is a required check, and one
  # that never appears blocks a pull request forever. The changes job gates
  # the work instead.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # mode: see "Decide the image mode". A dispatch without it runs as every
  # dispatch did before it existed.
  workflow_dispatch:
    inputs:
      mode:
        description: 'verification: test what changed, as a pull request does. nightly: build, test and record every image'
        required: false
        default: verification
        type: choice
        options:
          - verification
          - nightly
  # nightly.yml calls this workflow in nightly mode. Never a schedule here:
  # GitHub disables a scheduled workflow in a public repository after 60 days
  # without activity, and that disables every trigger it has, the pull
  # request checks branch protection requires among them.
  workflow_call:
    inputs:
      mode:
        description: 'verification or nightly: see "Decide the image mode".'
        required: true
        type: string

# A called workflow's github.workflow is its caller's name ("Reuse workflow
# configurations", jobs.<job_id>.concurrency, in GitHub's docs), so a caller
# grouped on ${{ github.workflow }}-${{ github.ref }} would share this group
# and be cancelled by its own call. inputs.mode is set only on a call or a
# dispatch, so those get a suffix no caller writes, and a push or a pull
# request keeps the group it always had.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.mode && format('-ci.yml-{0}', inputs.mode) || '' }}
  cancel-in-progress: true

env:
  ANSIBLE_FORCE_COLOR: "1"
  # No Python, Go or Terraform version here on purpose: the changes job
  # derives them from the Dockerfiles that ship them, so CI cannot drift from
  # the images. See scripts/derive-toolchain-versions.sh.
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.6"
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CST_VERSION: v1.22.1

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      terraform: ${{ steps.filter.outputs.terraform }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      images: ${{ steps.images.outputs.images }}
      base: ${{ steps.images.outputs.base }}
      mode: ${{ steps.mode.outputs.mode }}
      cache_write: ${{ steps.mode.outputs.cache_write }}
      legs: ${{ steps.legs.outputs.legs }}
      builds: ${{ steps.legs.outputs.builds }}
      base_platforms: ${{ steps.legs.outputs.base_platforms }}
      template_images: ${{ steps.filter.outputs.template-images }}
      scripts: ${{ steps.filter.outputs.scripts }}
      python: ${{ steps.filter.outputs.python }}
      python_version: ${{ steps.toolchain.outputs.python_version }}
      terraform_version: ${{ steps.toolchain.outputs.terraform_version }}
      tflint_version: ${{ steps.toolchain.outputs.tflint_version }}
    steps:
      # Full history, for the ancestor check below: 2 MiB of packs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive toolchain versions from the Dockerfiles
        id: toolchain
        run: bash scripts/derive-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      # How this run tests images. Candidate mode is the develop -> main
      # promotion pull request, which promote-to-main.yml keeps open and every
      # develop push updates: main can take a tree only once that pull
      # request's checks passed on it. It builds every image as
      # build-containers.yml publishes it (multi-arch, pushed by digest),
      # tests the digest on every platform and tags it candidate-<tree12>.
      # Nightly mode builds and tests the same way, on the commit the run is
      # for, and records the digests without tagging them; it tests images
      # only. Every other run is verification mode, a dispatch without the
      # nightly input among them: an amd64 build of each image that changed,
      # loaded and never pushed.
      #
      # Candidate mode takes all four conditions, never the branch name
      # alone: a fork can name a branch develop, and candidate mode pushes to
      # GHCR. pull_request, never pull_request_target, so a fork's run keeps
      # its read-only token.
      #
      # Nightly mode takes the input and an event only someone with write
      # access can start: a dispatch, or the schedule of a workflow on this
      # repository's default branch (nightly.yml's, from 2d-2). Both run a
      # workflow file from a branch of this repository. A pull_request run
      # takes its workflow files from the pull request, a fork's included, so
      # a caller there could ask for nightly mode: it fails instead, as does
      # any mode this workflow does not know. A call from another repository
      # runs with that repository's token and pushes to its owner's GHCR
      # namespace, never this one.
      - name: Decide the image mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
          MODE_INPUT: ${{ inputs.mode || '' }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          MODE=verification
          case "${MODE_INPUT}" in
            '' | verification)
              if [ "${EVENT_NAME}" = "pull_request" ] \
                && [ "${HEAD_REPO}" = "${REPOSITORY}" ] \
                && [ "${HEAD_REF}" = "develop" ] \
                && [ "${BASE_REF}" = "main" ]; then
                MODE=candidate
              fi
              ;;
            nightly)
              if [ "${EVENT_NAME}" != "workflow_dispatch" ] && [ "${EVENT_NAME}" != "schedule" ]; then
                echo "::error::Nightly mode runs on a dispatch or a schedule, not on ${EVENT_NAME}."
                exit 1
              fi
              MODE=nightly
              ;;
            *)
              echo "::error::Unknown mode '${MODE_INPUT}': verification or nightly."
              exit 1
              ;;
          esac
          CACHE_WRITE=false
          if [ "${MODE}" = "candidate" ] || { [ "${MODE}" = "nightly" ] && [ "${RUN_REF}" = "refs/heads/main" ]; }; then
            CACHE_WRITE=true
          fi
          echo "Image mode: ${MODE}"
          echo "Registry cache write: ${CACHE_WRITE}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "cache_write=${CACHE_WRITE}" >> "$GITHUB_OUTPUT"

      # Candidate mode builds, labels and records the pull request's head, the
      # develop commit, not refs/pull/N/merge: the image's revision label and
      # SOURCE_DATE_EPOCH must name a real commit, one main will contain. The
      # two have the same tree only while main is an ancestor of develop, as
      # sync-main-to-develop.yml keeps it. When it is not, the run would test
      # a tree that is not the one the merge gives main.
      - name: Check main is an ancestor of develop
        if: steps.mode.outputs.mode == 'candidate'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            echo "::error::main (${BASE_SHA}) is not an ancestor of develop (${HEAD_SHA}): merge main into develop first. Candidate mode builds develop's commit, which must have the tree this pull request would give main."
            exit 1
          fi
          HEAD_TREE="$(git rev-parse "${HEAD_SHA}^{tree}")"
          MERGE_TREE="$(git rev-parse "${MERGE_SHA}^{tree}")"
          if [ "${HEAD_TREE}" != "${MERGE_TREE}" ]; then
            echo "::error::develop (${HEAD_SHA}) has tree ${HEAD_TREE}, the merge ${MERGE_SHA} tree ${MERGE_TREE}: merge main into develop first."
            exit 1
          fi
          echo "main ${BASE_SHA} is an ancestor of develop ${HEAD_SHA}; both trees are ${HEAD_TREE}."

      # Not in nightly mode: what changed decides nothing there. Every output
      # of this step stays empty, so no job gated on one runs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: steps.mode.outputs.mode != 'nightly'
        with:
          filters: |
            # Note: .devcontainer/ (repo's dev environment) is intentionally excluded
            # Only devcontainers/ (published stacks) triggers the image jobs
            ansible:
              - 'playbooks/**'
              - 'roles/**'
              - 'collections/**'
              - 'requirements.yml'
              - 'ansible.cfg'
              - 'devcontainers/ansible/**'
              # The base Dockerfile sets the Python these jobs run on (see
              # the toolchain step below), so a base bump must exercise them.
              - 'devcontainers/base/Dockerfile'
              # playbooks/test-environment.yml asserts the installed ansible
              # against the pins in this export, and molecule converges
              # install from it.
              - 'requirements-ansible.txt'
            terraform:
              - '**/*.tf'
              - 'terraform/**'
              - 'infrastructure/**'
              - 'devcontainers/terraform/**'
            # What every image job runs, reads or is judged by, so a change to
            # any of it runs every image, as a Dockerfile change runs its own.
            # Each image-<name> filter below starts with this list. Named
            # images-all, not image-all: the image list keeps only the
            # image-<name> filters.
            images-all: &images-all
              # This workflow: a change to the image jobs, their runner or
              # their gates must run them. PR #606 (2026-10-30) changed only
              # the build job's runs-on, every build job skipped and CI went
              # green without running on the new runner.
              - '.github/workflows/ci.yml'
              # The scan ignore policy decides what the image scan blocks, so
              # a change to it must run that scan. PR #546 (2026-10-12) changed
              # only this file, every build job skipped and CI went green
              # without exercising the policy it was changing.
              - '.grype.yaml'
              # The size gate: a budget edit, or a change to how the size is
              # judged, must run that gate against the images it judges, as a
              # .grype.yaml change runs the scan.
              - '.github/image-size-budgets.json'
              - 'scripts/check-image-size.py'
              # The structure tests, and what the jobs check inside the
              # container: the template's workload and the Docker profiles.
              - 'tests/container-structure/**'
              - 'scripts/check-devcontainer-workload.sh'
              - 'scripts/test-devcontainer-profile.sh'
              - 'scripts/assert-image-id.sh'
              # The CLI pin: these jobs are the only thing that exercises
              # `npm ci` against it, and without this a change to how the CLI
              # is installed skips the very jobs that would prove it still
              # works.
              - 'scripts/devcontainers-cli/**'
              # How the jobs build: the commit's epoch and the labels.
              - 'scripts/derive-source-date-epoch.sh'
              - 'scripts/strip-description-label.sh'
              # What each image is built from, the platforms and runners of
              # its legs, and how candidate mode caches and tags the build.
              - 'scripts/resolve-image-files.sh'
              - 'scripts/release-images.py'
              - 'scripts/tag-candidates.sh'
            # Devcontainer State's: every image input, and what the image jobs
            # run.
            devcontainer:
              - *images-all
              - 'devcontainers/**'
              # The Dockerfiles copy these into the images.
              - 'templates/**'
              - 'requirements-ansible.txt'
              - 'requirements-aws.txt'
              - 'requirements-devcontainer-tools.txt'
            # One filter per image, after the inputs its Dockerfile reads:
            # what it COPYs or bind-mounts, the uv.lock export it installs and,
            # for ansible and ansible-aws, devcontainers/base/, which they are
            # built on here. A lock bump changes an image as much as a
            # Dockerfile edit, so the exports are here too. The directory of a
            # stack also holds the template and the profiles brought up on its
            # image. images-all has the paths every image shares.
            image-base:
              - *images-all
              - 'devcontainers/base/**'
              - 'requirements-devcontainer-tools.txt'
              # The base job's smoke test.
              - 'scripts/smoke-devcontainer-image.sh'
            image-ansible:
              - *images-all
              - 'devcontainers/ansible/**'
              - 'devcontainers/base/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
              - 'requirements-devcontainer-tools.txt'
            image-ansible-podman:
              - *images-all
              - 'devcontainers/ansible/Dockerfile.podman'
              - 'devcontainers/ansible/collections*.txt'
              - 'devcontainers/ansible/install-collections.sh'
              # The profile brought up on this image.
              - 'devcontainers/ansible/devcontainer.podman.json'
              - 'devcontainers/scripts/**'
              - 'templates/ansible/**'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
            image-ansible-aws:
              - *images-all
              - 'devcontainers/ansible/**'
              - 'devcontainers/base/**'
              - 'devcontainers/scripts/**'
              - 'templates/pre-commit/ansible/**'
              - 'requirements-ansible.txt'
              - 'requirements-aws.txt'
              - 'requirements-devcontainer-tools.txt'
            image-terraform:
              - *images-all
              - 'devcontainers/terraform/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/terraform/**'
              - 'requirements-devcontainer-tools.txt'
            image-terraform-aws:
              - *images-all
              - 'devcontainers/terraform/**'
              - 'devcontainers/scripts/**'
              - 'templates/pre-commit/terraform/**'
              - 'requirements-devcontainer-tools.txt'
            image-golang:
              - *images-all
              - 'devcontainers/golang/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/golang/**'
              - 'requirements-devcontainer-tools.txt'
            image-latex:
              - *images-all
              - 'devcontainers/latex/**'
              - 'devcontainers/scripts/ensure-precommit.sh'
              - 'templates/pre-commit/latex/**'
              - 'requirements-devcontainer-tools.txt'
              # The LaTeX scenario this image's job runs, and the smoke test it
              # starts with.
              - 'scripts/scenarios/run-latex-cv.sh'
              - 'scripts/smoke-devcontainer-image.sh'
              - 'docs/scenarios/examples/**'
            # The files that name the images the templates and examples open
            # from, checked by Devcontainer State. A filter of its own, not
            # more paths under devcontainer: examples/ is no image input.
            template-images:
              - 'devcontainers/**/devcontainer*.json'
              - '.devcontainer/**/devcontainer*.json'
              - 'examples/*/.devcontainer/*.json'
            scripts:
              - 'scripts/**'
            python:
              - '**/*.py'
              - 'requirements.txt'
              # `uv run pytest` builds its environment from the lock, and
              # pyproject.toml holds pytest's configuration.
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/**'
              # tests/ covers the shell scripts too (the scan gate's among
              # them), so a change to a script alone must run its tests.
              - 'scripts/**'
              # tests/test_check_image_size.py checks this file's shape: one
              # budget per published image, both limits positive integers.
              - '.github/image-size-budgets.json'
              # tests/test_derive_toolchain_versions.py reads the versions in
              # the Dockerfiles; tests/test_refresh_tool_pins.py its pin patterns
              # in them and in the script, and that no Dockerfile pins the AWS
              # CLI, .devcontainer's copy included.
              - 'devcontainers/*/Dockerfile*'
              - '.devcontainer/Dockerfile*'
              - 'devcontainers/scripts/install-aws-cli.sh'
              # tests/test_check_devcontainer_images.py runs the offline check
              # on these; tests/test_test_devcontainer_profile.py renders the
              # profiles among them.
              - 'devcontainers/**/devcontainer*.json'
              - '.devcontainer/**/devcontainer*.json'
              - 'examples/*/.devcontainer/*.json'
              # tests/test_workflow_contracts.py reads them all, and checks
              # the Lint job against these two: the lint-deps target it runs
              # and the hooks it runs.
              - '.github/workflows/*.yml'
              - 'Makefile'
              - '.pre-commit-config.yaml'

      # The image job's matrix: the images whose image-<name> filter matched,
      # and whether the base job must run, for base itself or for an image
      # built on it (ansible and ansible-aws, whose Dockerfile takes
      # BASE_IMAGE). paths-filter lists every filter that matched, never an
      # `any_changed`. A dispatch diffs only the last commit (or the branch
      # against main), usually nothing, so it runs every image.
      #
      # Candidate and nightly mode build every image, base included, whatever
      # changed: what they build is what 2d publishes, all eight images from
      # one run, and each must carry the OS packages of the day it was built
      # (see candidate-base), not those of the last promotion that changed it.
      #
      # A push tests no image. Every develop commit came through a pull
      # request whose run tested its images, every main commit through the
      # promotion pull request's candidate run, and develop's merged state is
      # tested together at that promotion. build-containers.yml still builds
      # and publishes main until 2d publishes the candidates instead.
      - name: Resolve the images to test
        id: images
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          ALL_IMAGES='["ansible","ansible-podman","ansible-aws","terraform","terraform-aws","golang","latex"]'
          EVERY_FILTER="$(jq -c '["image-base"] + map("image-" + .)' <<< "${ALL_IMAGES}")"
          case "${MODE}:${GITHUB_EVENT_NAME}" in
            candidate:* | nightly:*)
              echo "${MODE} mode tests every image."
              MATCHED="${EVERY_FILTER}"
              ;;
            *:push)
              echo "A push tests no image: the pull request that brought each change tested them."
              MATCHED='[]'
              ;;
            *:workflow_dispatch)
              MATCHED="${EVERY_FILTER}"
              ;;
            *)
              MATCHED="${CHANGES:?paths-filter gave no changes output}"
              ;;
          esac
          IMAGES="$(jq -c --argjson matched "${MATCHED}" \
            'map(. as $image | select(any($matched[]; . == "image-" + $image)))' <<< "${ALL_IMAGES}")"
          BASE="$(jq -r --argjson images "${IMAGES}" \
            'any(.[]; . == "image-base") or any($images[]; . == "ansible" or . == "ansible-aws")' <<< "${MATCHED}")"
          echo "Images to test: ${IMAGES}; base: ${BASE}"
          {
            echo "images=${IMAGES}"
            echo "base=${BASE}"
          } >> "$GITHUB_OUTPUT"

      # The image job's legs, one per image and platform, and the candidate
      # builds, from scripts/release-images.py: the one list of the platforms
      # each image is published for and the runner of each platform, which
      # tests/test_release_images.py keeps equal to build-containers.yml.
      - name: Resolve the image legs
        id: legs
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          IMAGES: ${{ steps.images.outputs.images }}
          BASE: ${{ steps.images.outputs.base }}
        run: |
          set -euo pipefail
          python3 scripts/release-images.py ci-matrix --mode "${MODE}" --images "${IMAGES}" --base "${BASE}" \
            | tee -a "$GITHUB_OUTPUT"

  # The only lint in CI: the pre-commit hooks, the same run as `make lint`.
  # The script-lint, dockerfile-lint and terraform-ci jobs here and
  # quality.yml's lint jobs ran a second copy of some hooks, at other
  # versions, over other files. No changes filter, on purpose: this is the
  # lint contract, and each hook selects its own files. The Python tools come
  # from uv.lock; terraform and tflint are the versions the terraform image
  # ships (scripts/derive-toolchain-versions.sh).
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: changes
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ needs.changes.outputs.python_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.changes.outputs.terraform_version }}
          terraform_wrapper: false

      # Checked against the release's checksums.txt, as the terraform image
      # checks the same download (devcontainers/terraform/Dockerfile).
      - name: Install tflint
        env:
          TFLINT_VERSION: ${{ needs.changes.outputs.tflint_version }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/tflint"
          BASE="https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}"
          mkdir -p "${DEST}/bin"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE}/tflint_linux_amd64.zip" -o "${DEST}/tflint_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE}/checksums.txt" -o "${DEST}/checksums.txt"
          (cd "${DEST}" && grep ' tflint_linux_amd64.zip$' checksums.txt | sha256sum --check --strict -)
          unzip -q "${DEST}/tflint_linux_amd64.zip" tflint -d "${DEST}/bin"
          echo "${DEST}/bin" >> "${GITHUB_PATH}"
          "${DEST}/bin/tflint" --version

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The uv.lock environment, and the Ansible collections the ansible
      # images ship, which ansible-lint (offline) resolves modules against.
      - name: Install the lint dependencies
        run: make lint-deps

      - name: Run pre-commit
        run: uv run --locked --no-build pre-commit run --all-files --show-diff-on-failure

  # Nightly mode tests the images and nothing else. The jobs that test the
  # repository skip in it: this one, powershell-lint, devcontainer-state,
  # unit-tests, ansible-test, molecule and scenario-tests. The pull requests
  # that brought the commit ran them, and no change is under test. Lint
  # stays: the candidate builds need it.
  test-playbooks:
    name: Test Playbooks
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.mode != 'nightly' && needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run test playbook
        run: |
          if [ -f "playbooks/test-environment.yml" ]; then
            ansible-playbook playbooks/test-environment.yml --check
          else
            echo "::warning::Test playbook not found, skipping"
          fi

  # PSScriptAnalyzer, as Script Lint ran it before shellcheck moved to
  # pre-commit: unpinned Install-Module and non-blocking, unchanged. Whether
  # it becomes a pinned, blocking check of the user-facing .ps1 scripts or
  # goes is the owner's call; until then it keeps a job of its own.
  powershell-lint:
    name: PowerShell Lint
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.mode != 'nightly' && needs.changes.outputs.scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint PowerShell scripts
        if: hashFiles('scripts/*.ps1') != ''
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $scripts = Get-ChildItem -Path scripts -Filter *.ps1
          foreach ($script in $scripts) {
            Write-Host "Analyzing $($script.Name)"
            Invoke-ScriptAnalyzer -Path $script.FullName -Recurse
          }
        continue-on-error: true

  devcontainer-state:
    name: Devcontainer State
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      needs.changes.outputs.mode != 'nightly'
      && (needs.changes.outputs.devcontainer == 'true'
      || needs.changes.outputs.template_images == 'true'
      || needs.changes.outputs.scripts == 'true')
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Verify active .devcontainer metadata
        run: python3 scripts/devcontainer-metadata.py

      - name: Verify active .devcontainer sync
        run: python3 scripts/devcontainer-diff.py

      - name: Run devcontainer doctor
        run: bash scripts/doctor-devcontainer.sh

      # Every template and example opens from a GHCR image pinned by digest.
      # A digest GHCR no longer serves, or one that pins a single platform
      # instead of the multi-arch index, breaks every dev container that
      # opens from it, and nothing else here pulls those images.
      - name: Verify template images resolve in GHCR
        run: python3 scripts/check-devcontainer-images.py


  # The image jobs build each image once and run every image check on that
  # build. Each check used to build the image for itself: up to five builds
  # of each image per pull request, in devcontainer-build and
  # devcontainer-cli-test here, scenario-tests, test-containers.yml and
  # sbom-verification.yml. Every check now asserts, before it runs, that the
  # image still has the ID the build gave it (scripts/assert-image-id.sh).
  # The checks after the build run whether or not an earlier one failed, as
  # they did when they were separate jobs, so one run reports them all.
  #
  # In verification mode what these jobs test is a presubmit build: amd64
  # only, loaded into the runner's Docker and never pushed. It is not the
  # image build-containers.yml publishes, which is built again, multi-arch,
  # and gated again there.
  #
  # In candidate and nightly mode (see "Decide the image mode") the candidate
  # jobs build each image as build-containers.yml publishes it and push it
  # untagged, by digest. The image job then runs the same checks on that
  # digest, pulled on a runner of each platform it is published for, and
  # candidate-tag records it, and in candidate mode tags it, only once every
  # leg and every other job passed.

  # base is built once, here, for its own checks and for the images built on
  # it, which take it as an artifact instead of building it again. One build
  # writes it twice: to an OCI layout, which the children read as a named
  # build context (the docker-container builder does not see the daemon's
  # images), and into Docker, for the checks. Verification mode only:
  # candidate and nightly mode build base in candidate-base and test it in
  # the image job, on both platforms, as they test the others.
  base:
    name: Image (base)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes, lint]
    if: needs.changes.outputs.mode == 'verification' && needs.changes.outputs.base == 'true'
    env:
      IMAGE_REF: devcontainer-base:ci
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # As build-containers.yml publishes: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      # Read-only. candidate-base is the one writer of this tag, in candidate
      # and nightly mode, and a cache export replaces the manifest at its tag,
      # so a second writer here would overwrite it every run. It was
      # build-containers.yml's :buildcache-publish, which stops moving once 2d
      # publishes the candidates instead of building again; :buildcache holds
      # the base the promotion and the nightly last built, as the children's
      # :buildcache holds theirs. The package is public, so reading needs no
      # credentials and fork pull requests use it too. Probed first: buildx
      # aborts on a missing cache-from ref.
      #
      # The cache also keeps the children's own cache useful. rewrite-timestamp
      # clamps only the mtimes later than SOURCE_DATE_EPOCH, so cached base
      # layers older than the commit come out byte-identical on every commit
      # and the stack layers above them still hit. Built fresh, after the
      # commit, base changes with every commit's epoch and the stacks rebuild
      # in full.
      - name: Resolve the base build cache
        id: base_cache
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/devcontainer-base:buildcache
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF}; building base uncached."
          fi

      # The ansible Dockerfile pins BASE_IMAGE to the devcontainer-base that
      # build-containers.yml last published, and only main publishes it. On
      # that pin CI scanned every pull request on the base main already ships,
      # never on the PR's own devcontainers/base/Dockerfile. The move to Python
      # 3.14.10 for CVE-2026-115557 (2026-10-30) could not pass the gate: the
      # image scanned still ran main's 3.14.8, on every pull request up to the
      # develop -> main promotion that would publish the fix. Built from this
      # commit, base is what a merge would publish.
      #
      # Same epoch and timestamp rewrite on both outputs, as build-base
      # publishes it. No provenance: the layout never leaves this run, and
      # without an attestation manifest its index names the amd64 image
      # manifest itself.
      - name: Build base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # The repository root: the Dockerfile bind-mounts
          # requirements-devcontainer-tools.txt.
          context: .
          file: devcontainers/base/Dockerfile
          outputs: |
            type=oci,dest=${{ runner.temp }}/devcontainer-base,tar=false,rewrite-timestamp=true
            type=docker,name=${{ env.IMAGE_REF }},rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          cache-from: ${{ steps.base_cache.outputs.from }}
          platforms: linux/amd64
          provenance: false

      # The checks below run on the image in Docker and the children build on
      # the layout, so the two must be one image: the same layers. The
      # layout's manifest digest is this job's output, which every child
      # checks the artifact against.
      - name: Check the loaded base is the layout's image
        id: layout
        env:
          LAYOUT: ${{ runner.temp }}/devcontainer-base
        run: |
          set -euo pipefail
          blob() {
            cat "${LAYOUT}/blobs/sha256/${1#sha256:}"
          }
          COUNT="$(jq '.manifests | length' "${LAYOUT}/index.json")"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::The base layout's index lists ${COUNT} manifests, not one"
            exit 1
          fi
          MANIFEST="$(jq -r '.manifests[0].digest' "${LAYOUT}/index.json")"
          if [[ ! "${MANIFEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The base layout's index names no manifest digest (${MANIFEST})"
            exit 1
          fi
          CONFIG="$(blob "${MANIFEST}" | jq -r '.config.digest')"
          LAYOUT_LAYERS="$(blob "${CONFIG}" | jq -c '.rootfs.diff_ids')"
          LOADED_LAYERS="$(docker image inspect --format '{{json .RootFS.Layers}}' -- "${IMAGE_REF}" | jq -c .)"
          if [ "${LAYOUT_LAYERS}" != "${LOADED_LAYERS}" ]; then
            echo "::error::${IMAGE_REF} has layers ${LOADED_LAYERS}, the layout ${LAYOUT_LAYERS}"
            exit 1
          fi
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' -- "${IMAGE_REF}")"
          echo "${IMAGE_REF} is ${IMAGE_ID}; layout manifest ${MANIFEST}"
          {
            echo "digest=${MANIFEST}"
            echo "id=${IMAGE_ID}"
          } >> "$GITHUB_OUTPUT"

      # Only for the children in this run, hence one day. The blobs are
      # compressed layers already.
      - name: Upload the base layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: devcontainer-base-layout
          path: ${{ runner.temp }}/devcontainer-base
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      # What the LaTeX scenario used to check of base on develop and main,
      # where it built base for a latex image that does not take it.
      - name: Smoke test base
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          bash scripts/smoke-devcontainer-image.sh --stack base --image "${IMAGE_REF}"

      # Gated now that base is loaded here, against the budget only the
      # publish report used to read: see the size gate in the image job.
      - name: Check base image size against its budget
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          python3 scripts/check-image-size.py local --image "${IMAGE_REF}" --name base

      - name: Install container-structure-test
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        run: |
          # Pinned, over HTTPS, and checked against the release's
          # checksums.txt before the binary is ever made executable.
          set -euo pipefail
          BASE_URL="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
          DEST="$(mktemp -d)"
          # --retry: a 504 from GitHub releases broke builds on 2026-09-14.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/container-structure-test-linux-amd64" -o "${DEST}/container-structure-test-linux-amd64"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/checksums.txt" -o "${DEST}/checksums.txt"
          (cd "${DEST}" && grep ' container-structure-test-linux-amd64$' checksums.txt | sha256sum --check --strict -)
          install -m 0755 "${DEST}/container-structure-test-linux-amd64" /usr/local/bin/container-structure-test
          rm -rf "${DEST}"

      - name: Run the structure tests for base
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          container-structure-test test --image "${IMAGE_REF}" \
            --config tests/container-structure/base.yaml

      - name: Assert the image before its SBOM
        id: sbom_image
        if: ${{ !cancelled() && steps.layout.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.layout.outputs.id }}
        run: bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"

      - name: Generate the SBOM of base
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          # The upload step below names it: the action's own upload would add
          # a second artifact.
          upload-artifact: false
          output-file: ${{ runner.temp }}/presubmit-sbom-base.spdx.json
          format: spdx-json

      # What sbom-verification.yml's checks could fail on: an SBOM that is not
      # JSON, or that has no package list. Its NTIA, license and Grype steps
      # could not fail and are gone. An empty list fails too: an SBOM of
      # nothing describes no image.
      - name: Check the SBOM of base
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        env:
          SBOM: ${{ runner.temp }}/presubmit-sbom-base.spdx.json
        run: |
          set -euo pipefail
          PACKAGES="$(jq -e '.packages | if type == "array" and length > 0 then length else error("no packages") end' "${SBOM}")"
          echo "${IMAGE_REF}: ${PACKAGES} packages in the SBOM"

      # presubmit: the SBOM of this run's amd64 build, not of a published
      # image. release.yml attaches the released digests' SBOMs.
      - name: Upload the SBOM of base
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: presubmit-sbom-base
          path: ${{ runner.temp }}/presubmit-sbom-base.spdx.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  # Candidate and nightly mode only: base as build-base in
  # build-containers.yml publishes it, pushed untagged by digest, so that 2d
  # can publish this very digest. The build step's settings are build-base's
  # (tests/test_workflow_contracts.py compares them) but for the cache. The
  # checkout is the pull request's head, so the labels and SOURCE_DATE_EPOCH
  # name the develop commit (see "Check main is an ancestor of develop"); in
  # nightly mode, which has no pull request, the commit the run is for.
  #
  # Uncached, as the nightly publish builds: a candidate is what 2d publishes,
  # so it must hold today's OS packages. The first candidate run (#636,
  # 2026-11-06) read a cached upgrade layer and shipped apt 3.0.3 and libexpat
  # 2.9.0 when trixie-security and Alpine 3.23 already had the fixed 3.0.4 and
  # 2.10.0; the layer cache cannot know the package index moved. It still
  # writes :buildcache, its one writer, for pull requests to read.
  #
  # packages: write on candidate-base, candidate-build and candidate-tag only,
  # each behind the mode. Candidate mode needs this repository's develop as
  # the head, and pushing to develop already takes write access; nightly mode
  # a dispatch or a schedule, which only write access starts. id-token and
  # attestations: write on the two builds alone, for their attestation.
  candidate-base:
    name: Candidate (base)
    runs-on: ubuntu-24.04
    # build-base's build step took 30-467 s cached and 47-497 s uncached, both
    # platforms under QEMU.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: [changes, lint]
    if: contains(fromJSON('["candidate", "nightly"]'), needs.changes.outputs.mode) && needs.changes.outputs.base == 'true'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.mode == 'nightly' && github.sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-base's labels. On a pull_request event the action labels the
      # merge commit unless DOCKER_METADATA_PR_HEAD_SHA is true: then {{sha}},
      # type=sha and the revision label take the pull request's head
      # (src/context.ts at this pin, lines 70-77).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          tags: type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.epoch.outputs.created }}
            org.opencontainers.image.version=sha-{{sha}}

      # Each Dockerfile labels its own description; metadata-action's
      # repository-wide one would replace it.
      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      # Untagged: candidate-tag tags it once every leg and job passed.
      - name: Build and push base by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: devcontainers/base/Dockerfile
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          labels: ${{ steps.labels.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          # :buildcache is what every pull request's base job builds from, so
          # only the promotion and main's nightly write it (cache_write, see
          # "Decide the image mode"). A nightly dispatched on another branch
          # builds and tests as main's does, but must not replace it.
          cache-to: >-
            ${{ needs.changes.outputs.cache_write == 'true'
            && format('type=registry,ref=ghcr.io/{0}/devcontainer-base:buildcache,mode=max,ignore-error=true', github.repository_owner)
            || '' }}
          no-cache: true
          platforms: ${{ needs.changes.outputs.base_platforms }}
          provenance: true
          sbom: true

      # A matrix job has one set of outputs, the last leg's, so each build
      # hands its digest to the legs and to candidate-tag as an artifact.
      - name: Record the candidate digest
        env:
          IMAGE: base
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build of ${IMAGE} gave no digest ('${DIGEST}')."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/candidate-digest"
          jq -n --arg name "${IMAGE}" --arg digest "${DIGEST}" '{name: $name, digest: $digest}' \
            > "${RUNNER_TEMP}/candidate-digest/${IMAGE}.json"
          echo "devcontainer-${IMAGE}@${DIGEST}"

      # SLSA build provenance, signed with this workflow's identity and pushed
      # beside the digest, as build-containers.yml attests what it publishes:
      # 2d publishes this digest and builds nothing to attest. It says what
      # built the digest, from which commit, not that it passed; the record
      # candidate-tag writes once every leg passed says that. After the
      # digest was checked and before it is handed on, so every digest a leg
      # pulls is attested.
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Two weeks: as long as cleanup-ghcr.yml keeps the untagged digest, so a
      # re-run of a failed leg can still pull it.
      - name: Upload the candidate digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: candidate-digest-base
          path: ${{ runner.temp }}/candidate-digest/base.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # Candidate and nightly mode only: every other image, as build-all in
  # build-containers.yml publishes it, on the base candidate-base pushed. One
  # job per image, for every platform scripts/release-images.py gives it. No
  # max-parallel: build-all's 2 has no recorded reason.
  candidate-build:
    name: Candidate (${{ matrix.image }})
    runs-on: ubuntu-24.04
    # build-all's build step took 30-467 s cached and 47-497 s uncached.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: [changes, lint, candidate-base]
    # Whatever candidate-base's result, as the image job takes base's: it is
    # skipped when no image here is built on it, and an image built on it
    # stops at "Check this run built the base".
    if: >-
      !cancelled()
      && contains(fromJSON('["candidate", "nightly"]'), needs.changes.outputs.mode)
      && needs.changes.result == 'success'
      && needs.lint.result == 'success'
      && needs.changes.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.mode == 'nightly' && github.sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve the image's files
        id: files
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/resolve-image-files.sh "${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Check this run built the base
        if: steps.files.outputs.base_from_run == 'true' && needs.candidate-base.result != 'success'
        env:
          BASE_RESULT: ${{ needs.candidate-base.result }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "::error::candidate-base ${BASE_RESULT} in this run; not building ${IMAGE} on another base."
          exit 1

      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-all's labels, of the head: see candidate-base.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.image }}
          tags: type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.epoch.outputs.created }}
            org.opencontainers.image.version=sha-{{sha}}

      - name: Keep the Dockerfile's description label
        id: labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      # build-all's settings: the base by its candidate digest, as build-all
      # takes the base its run built. Uncached: see candidate-base.
      - name: Build and push ${{ matrix.image }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ steps.files.outputs.dockerfile }}
          target: ${{ steps.files.outputs.target }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=12,force-compression=true,oci-mediatypes=true,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.image }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
            ${{ steps.files.outputs.base_from_run == 'true' && format('BASE_IMAGE=ghcr.io/{0}/devcontainer-base@{1}', github.repository_owner, needs.candidate-base.outputs.digest) || '' }}
          # See candidate-base.
          cache-to: >-
            ${{ needs.changes.outputs.cache_write == 'true'
            && format('type=registry,ref=ghcr.io/{0}/devcontainer-{1}:buildcache,mode=max,ignore-error=true', github.repository_owner, matrix.image)
            || '' }}
          no-cache: true
          platforms: ${{ matrix.platforms }}
          provenance: true
          sbom: true

      # See candidate-base.
      - name: Record the candidate digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build of ${IMAGE} gave no digest ('${DIGEST}')."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/candidate-digest"
          jq -n --arg name "${IMAGE}" --arg digest "${DIGEST}" '{name: $name, digest: $digest}' \
            > "${RUNNER_TEMP}/candidate-digest/${IMAGE}.json"
          echo "devcontainer-${IMAGE}@${DIGEST}"

      # See candidate-base.
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload the candidate digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: candidate-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/candidate-digest/${{ matrix.image }}.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # One leg per image and platform (see "Resolve the image legs"): the amd64
  # build in verification mode, every published platform of the candidate
  # digest in candidate and nightly mode, base among them. Only how the image
  # under test gets into the runner's Docker differs between the two; every
  # check after "Record the image under test" runs on that image either way.
  image:
    name: Image (${{ matrix.image }}, ${{ matrix.arch }})
    # From RUNNERS in scripts/release-images.py: ubuntu-24.04 and
    # ubuntu-24.04-arm. Not ubuntu-latest: that label moves to Ubuntu 26.04 by
    # 2026-11-19, with Docker 29 where 24.04 has Docker 28. The size gate below
    # needs the classic overlay2 store its budgets were measured on, and fails
    # on the containerd store, the default for a new Docker 29 install.
    # Renovate ignores runner labels, so move them by hand and re-measure the
    # budgets in that change.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Candidate and nightly mode pull the candidate with it. The package is
      # public, so this only spares the pulls the anonymous limits. Nothing
      # here writes a registry: :buildcache has one writer, the candidate
      # builds.
      packages: read
    needs: [changes, lint, base, candidate-base, candidate-build]
    # Whatever base's result. It is skipped whenever no image in the list is
    # built on it, and under the implicit success() a skipped need would skip
    # this job too (actions/runner#2205). An image not built on base does not
    # need it, so a failed base check must not hide that image's results; an
    # image built on it fails at "Check this run built the base" when base did
    # not succeed. A failed base fails the base job, and the summaries with
    # it. The same holds for the candidate builds: a leg whose candidate was
    # not built fails at "Download the candidate digest".
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.lint.result == 'success'
      && needs.changes.outputs.legs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.legs) }}
    env:
      IMAGE_REF: devcontainer-${{ matrix.image }}:ci
      MODE: ${{ needs.changes.outputs.mode }}
      # One SBOM a leg: a candidate image has one per platform.
      SBOM_NAME: ${{ contains(fromJSON('["candidate", "nightly"]'), needs.changes.outputs.mode) && 'candidate' || 'presubmit' }}-sbom-${{ matrix.image }}-${{ matrix.arch }}
    steps:
      # The head in candidate mode, as the candidate builds check it out. The
      # default otherwise: the run's commit, which nightly mode builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.mode == 'candidate' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Its Dockerfile and stage, structure tests and Dev Containers checks:
      # see the script.
      - name: Resolve the image's files
        id: files
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/resolve-image-files.sh "${IMAGE}" >> "$GITHUB_OUTPUT"

      # Verification mode builds the image here, from "Check this run built
      # the base" to the build step. This job runs whatever base's result (see
      # its if). An image built on base has no layout to build on when base did
      # not succeed, and building it on any other base would test another
      # image: stop here, saying so, instead of at the layout's download.
      - name: Check this run built the base
        if: env.MODE == 'verification' && steps.files.outputs.base_from_run == 'true' && needs.base.result != 'success'
        env:
          BASE_RESULT: ${{ needs.base.result }}
        run: |
          echo "::error::base ${BASE_RESULT} in this run; not testing ${IMAGE_REF} on another base."
          exit 1

      # As build-containers.yml publishes: see scripts/derive-source-date-epoch.sh.
      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        if: env.MODE == 'verification'
        run: bash scripts/derive-source-date-epoch.sh >> "$GITHUB_OUTPUT"

      # Not made the default builder: the Dev Containers CLI builds its feature
      # and UID layers FROM the image this job loads, and only the daemon's own
      # builder sees the daemon's images. The build below names this one.
      - name: Set up Docker Buildx
        id: buildx
        if: env.MODE == 'verification'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker-container
          use: false

      - name: Download the base layout
        if: env.MODE == 'verification' && steps.files.outputs.base_from_run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: devcontainer-base-layout
          path: ${{ runner.temp }}/devcontainer-base

      # The layout must be the base the base job built and checked: its index
      # names that job's manifest digest and nothing else, and every blob is
      # named after its own sha256, so one that changed on the way fails here.
      - name: Check the base layout
        if: env.MODE == 'verification' && steps.files.outputs.base_from_run == 'true'
        env:
          EXPECTED: ${{ needs.base.outputs.digest }}
          LAYOUT: ${{ runner.temp }}/devcontainer-base
        run: |
          set -euo pipefail
          DIGESTS="$(jq -r '.manifests[].digest' "${LAYOUT}/index.json")"
          if [ -z "${EXPECTED}" ] || [ "${DIGESTS}" != "${EXPECTED}" ]; then
            echo "::error::The base layout holds ${DIGESTS:-nothing}, not the base built in this run (${EXPECTED:-no digest})"
            exit 1
          fi
          cd "${LAYOUT}/blobs/sha256"
          for BLOB in *; do
            printf '%s  %s\n' "${BLOB}" "${BLOB}"
          done | sha256sum --check --strict --quiet
          echo "Base layout ${EXPECTED}: index and every blob verified."

      # Verification never writes a registry cache. :buildcache has one writer,
      # the candidate builds (candidate-base, candidate-build) of candidate
      # and nightly mode, so no other pull request, Renovate's included, can
      # put layers into the cache every pull request builds from. A fork gets
      # the Actions cache instead, from and to: its writes are scoped to the
      # pull request's ref, which no other ref reads.
      - name: Determine cache strategy
        id: cache
        if: env.MODE == 'verification'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] \
            && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            {
              echo "cache_from=type=gha,scope=${IMAGE}"
              echo "cache_to=type=gha,scope=${IMAGE}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CACHE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${IMAGE}:buildcache"
          # Probed, as build-containers.yml does: a missing cache-from ref
          # has been a fatal error in some BuildKit versions, and a new image
          # has no :buildcache until a candidate build writes the first.
          if docker buildx imagetools inspect "${CACHE_REF}" >/dev/null 2>&1; then
            echo "cache_from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "cache_from=" >> "$GITHUB_OUTPUT"
            echo "::notice::No cache at ${CACHE_REF} yet; building uncached."
          fi
          echo "cache_to=" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        if: env.MODE == 'verification'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.image }}
          tags: type=raw,value=ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.epoch.outputs.created }}
            org.opencontainers.image.version=sha-{{sha}}

      # Each Dockerfile labels its own description; metadata-action's
      # repository-wide one would replace it.
      - name: Keep the Dockerfile's description label
        id: labels
        if: env.MODE == 'verification'
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: bash scripts/strip-description-label.sh

      - name: Build ${{ matrix.image }}
        if: env.MODE == 'verification'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ steps.files.outputs.dockerfile }}
          target: ${{ steps.files.outputs.target }}
          push: false
          # Loaded like `load: true`, plus the timestamp rewrite the published
          # images get, so what this job tests is built the way
          # build-containers.yml publishes it: the stale-bytecode structure
          # test can only fail on an image whose mtimes were rewritten.
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.IMAGE_REF }}
          labels: ${{ steps.labels.outputs.labels }}
          # BASE_IMAGE names the build context below, which a FROM resolves
          # before any registry, so the image sits on the base this run built,
          # by the digest checked above. Without the context the name would be
          # looked up as docker.io/library/devcontainer-base, which does not
          # exist: the build fails instead of falling back to the pin. An
          # image without base_from_run gets neither line.
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
            ${{ steps.files.outputs.base_from_run == 'true' && 'BASE_IMAGE=devcontainer-base' || '' }}
          build-contexts: |
            ${{ steps.files.outputs.base_from_run == 'true' && format('devcontainer-base=oci-layout://{0}/devcontainer-base@{1}', runner.temp, needs.base.outputs.digest) || '' }}
          cache-from: |
            ${{ steps.cache.outputs.cache_from }}
          cache-to: |
            ${{ steps.cache.outputs.cache_to }}
          platforms: linux/amd64

      # Candidate and nightly mode pull the image instead: the digest its
      # candidate build pushed, for this leg's platform.
      - name: Login to GHCR
        if: contains(fromJSON('["candidate", "nightly"]'), env.MODE)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the candidate digest
        if: contains(fromJSON('["candidate", "nightly"]'), env.MODE)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: candidate-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/candidate-digest

      # docker picks the runner's platform from the index, and fails when the
      # index does not hold it. The comparison is what makes a green leg
      # evidence about this platform, as in release.yml's smoke: it would catch
      # a runner label that stopped meaning arm64. Then the digest takes the
      # tag every check below uses, so they run unchanged.
      - name: Pull the candidate by digest
        if: contains(fromJSON('["candidate", "nightly"]'), env.MODE)
        env:
          RECORD: ${{ runner.temp }}/candidate-digest/${{ matrix.image }}.json
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/devcontainer-${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          DIGEST="$(jq -r '.digest // ""' "${RECORD}")"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${RECORD} holds no digest ('${DIGEST}')."
            exit 1
          fi
          REF="${REPOSITORY}@${DIGEST}"
          docker pull "${REF}"
          PULLED="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' -- "${REF}")"
          if [ "${PULLED}" != "${PLATFORM}" ]; then
            echo "::error::${REF} pulled as ${PULLED} on the ${PLATFORM} leg, so it proves nothing about ${PLATFORM}."
            exit 1
          fi
          docker tag "${REF}" "${IMAGE_REF}"
          echo "${REF} is ${PULLED}, tagged ${IMAGE_REF}; the runner is $(uname -m)."

      # The ID every check below asserts before it runs.
      - name: Record the image under test
        id: image
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' -- "${IMAGE_REF}")"
          echo "${IMAGE_REF} is ${IMAGE_ID}"
          echo "id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"

      # Size gate, first, so an oversized image fails in seconds. It compares
      # `docker image inspect` .Size with the image's max_uncompressed_mib in
      # .github/image-size-budgets.json and fails the job when it is over.
      # Uncompressed because that is the one faithful size here: nothing is
      # pushed, so there is no registry manifest to read, and the layers this
      # job exports are not compressed the way build-containers.yml publishes
      # them (zstd), so their size would not be the download either. On this
      # runner's classic overlay2 store .Size is the sum of the files in the
      # image's layers, which is what the budgets were measured as. The script
      # also fails closed (exit 2) when it cannot judge: an image with no
      # budget, a budgets file it cannot read, a docker error, or a Docker on
      # the containerd image store, where .Size counts something else.
      # Raising a budget is a reviewed edit to that file. amd64 only: the
      # budgets were measured there, and it is the larger platform of every
      # image. The one check that differs by platform.
      - name: Check ${{ matrix.image }} image size against its budget
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.arch == 'amd64' }}
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          python3 scripts/check-image-size.py local --image "${IMAGE_REF}" --name "${IMAGE}"

      - name: Smoke test ${{ matrix.image }} container
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          docker run --rm "${IMAGE_REF}" \
            bash -lc "echo '${IMAGE} container is healthy' && whoami && which bash"

      # The base job's smoke test, for base tested here in candidate and
      # nightly mode.
      - name: Smoke test base with its stack's checks
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'base' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          bash scripts/smoke-devcontainer-image.sh --stack base --image "${IMAGE_REF}"

      # The runner's own architecture: the release publishes linux-amd64 and
      # linux-arm64 builds, each with its line in checksums.txt.
      - name: Install container-structure-test
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          # Pinned, over HTTPS, and checked against the release's
          # checksums.txt before the binary is ever made executable.
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              ASSET=container-structure-test-linux-amd64
              ;;
            aarch64)
              ASSET=container-structure-test-linux-arm64
              ;;
            *)
              echo "::error::container-structure-test ${CST_VERSION} has no build for $(uname -m)"
              exit 1
              ;;
          esac
          BASE_URL="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
          DEST="$(mktemp -d)"
          # --retry: a 504 from GitHub releases broke builds on 2026-09-14.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/${ASSET}" -o "${DEST}/${ASSET}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "${BASE_URL}/checksums.txt" -o "${DEST}/checksums.txt"
          (cd "${DEST}" && grep " ${ASSET}\$" checksums.txt | sha256sum --check --strict -)
          install -m 0755 "${DEST}/${ASSET}" /usr/local/bin/container-structure-test
          rm -rf "${DEST}"

      - name: Run the structure tests for ${{ matrix.image }}
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          STRUCTURE_TESTS: ${{ steps.files.outputs.configs }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          read -r -a TEST_FILES <<< "${STRUCTURE_TESTS}"
          ARGS=()
          for TEST_FILE in "${TEST_FILES[@]}"; do
            ARGS+=(--config "tests/container-structure/${TEST_FILE}.yaml")
          done
          container-structure-test test --image "${IMAGE_REF}" "${ARGS[@]}"

      # The structure tests only ask podman for its version, and `podman run`
      # failed in the image for lack of pasta with all of them green. Privileged
      # because Docker's default seccomp profile stops rootless podman at
      # "cannot clone: Operation not permitted". Retried for quay.io, which the
      # script pulls from.
      - name: Run the podman smoke test
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'ansible-podman' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          for ATTEMPT in 1 2 3; do
            if docker run --rm --privileged "${IMAGE_REF}" podman-smoke-test; then
              exit 0
            fi
            echo "::warning::podman smoke test attempt ${ATTEMPT} failed; retrying"
            sleep "$((ATTEMPT * 20))"
          done
          echo "::error::podman smoke test failed after 3 attempts"
          exit 1

      - name: Assert the image before the scan
        id: scan_image
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"

      # JSON rather than the default SARIF, which nothing here uploads: its
      # levels are relative to severity-cutoff, so at critical a high finding
      # reads as a warning, while the JSON names each finding's severity.
      # Verification blocks on critical, the owner's decision for pull
      # requests. Candidate and nightly mode block on fixable high on every
      # platform: the bar build-containers.yml tags at, and the digest is what
      # 2d publishes.
      - name: Scan image with Grype
        id: grype
        if: ${{ !cancelled() && steps.scan_image.outcome == 'success' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_CONFIG: ${{ github.workspace }}/.grype.yaml
        with:
          image: ${{ env.IMAGE_REF }}
          severity-cutoff: ${{ contains(fromJSON('["candidate", "nightly"]'), env.MODE) && 'high' || 'critical' }}
          only-fixed: true
          fail-build: "true"
          output-format: json

      # Fixable high findings do not fail a pull request in verification mode:
      # CI blocks on critical, the owner's decision. build-containers.yml tags
      # nothing with a fixable high finding, so each warning here is one that
      # would hold back the publish of this image after the merge. In
      # candidate and nightly mode the scan above failed on them; this lists
      # them.
      - name: Annotate fixable high findings
        if: ${{ !cancelled() && steps.grype.outputs.json != '' }}
        env:
          REPORT: ${{ steps.grype.outputs.json }}
        run: |
          set -euo pipefail
          if [ ! -f "${REPORT}" ] || ! jq -e '.matches | type == "array"' "${REPORT}" >/dev/null; then
            echo "::warning::No readable Grype report for ${IMAGE_REF}; its fixable high findings are not listed"
            exit 0
          fi
          mapfile -t FINDINGS < <(jq -r '.matches[]
            | select(.vulnerability.severity == "High")
            | "\(.vulnerability.id) in \(.artifact.name) \(.artifact.version), fixed in \(.vulnerability.fix.versions // [] | join(", "))"' \
            "${REPORT}" | sort -u)
          echo "Fixable high findings in ${IMAGE_REF}: ${#FINDINGS[@]}"
          if [ "${#FINDINGS[@]}" -eq 0 ]; then
            exit 0
          fi
          # GitHub shows ten annotations a step; the summary lists them all.
          for FINDING in "${FINDINGS[@]}"; do
            echo "::warning title=Fixable high finding in ${IMAGE_REF}::${FINDING}"
          done
          case "${MODE}" in
            candidate | nightly)
              VERDICT="blocking this candidate"
              ;;
            *)
              VERDICT="not blocking here"
              ;;
          esac
          {
            echo "### ${IMAGE_REF}: ${#FINDINGS[@]} fixable high finding(s), ${VERDICT}"
            echo ""
            printf -- '- %s\n' "${FINDINGS[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the image before its SBOM
        id: sbom_image
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"

      - name: Generate the SBOM of ${{ matrix.image }}
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          # The upload step below names it: the action's own upload would add
          # a second artifact.
          upload-artifact: false
          output-file: ${{ runner.temp }}/${{ env.SBOM_NAME }}.spdx.json
          format: spdx-json

      # What sbom-verification.yml's checks could fail on: an SBOM that is not
      # JSON, or that has no package list. Its NTIA, license and Grype steps
      # could not fail and are gone. An empty list fails too: an SBOM of
      # nothing describes no image.
      - name: Check the SBOM of ${{ matrix.image }}
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        env:
          SBOM: ${{ runner.temp }}/${{ env.SBOM_NAME }}.spdx.json
        run: |
          set -euo pipefail
          PACKAGES="$(jq -e '.packages | if type == "array" and length > 0 then length else error("no packages") end' "${SBOM}")"
          echo "${IMAGE_REF}: ${PACKAGES} packages in the SBOM"

      # presubmit-: the SBOM of this run's amd64 build, not of a published
      # image. candidate-: of the candidate digest on this leg's platform.
      # release.yml attaches the released digests' SBOMs.
      - name: Upload the SBOM of ${{ matrix.image }}
        if: ${{ !cancelled() && steps.sbom_image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.SBOM_NAME }}
          path: ${{ runner.temp }}/${{ env.SBOM_NAME }}.spdx.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Cache npm packages
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.cli == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-devcontainers-${{ runner.os }}-${{ hashFiles('scripts/devcontainers-cli/package-lock.json') }}
          restore-keys: npm-devcontainers-${{ runner.os }}-

      - name: Install Dev Containers CLI
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.cli == 'true' }}
        run: |
          # npm ci against a committed lockfile, not `npm install <pkg>@<ver>`.
          # The version pin alone left the transitive tree free to resolve
          # afresh on every run, with no integrity check on what arrived --
          # Scorecard counted it under Pinned-Dependencies, and it is the same
          # class of hole the bare `pip install` steps had. The lock carries an
          # integrity hash per package; Renovate manages the version in
          # scripts/devcontainers-cli/package.json through its npm manager.
          #
          # --ignore-scripts: no lifecycle script from the package or its deps
          # runs at install time.
          npm ci --ignore-scripts --prefix scripts/devcontainers-cli
          echo "${GITHUB_WORKSPACE}/scripts/devcontainers-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify devcontainer config
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.template == 'true' }}
        env:
          STACK: ${{ matrix.image }}
        run: |
          set -euo pipefail
          for CONFIG in devcontainer.json local-build/devcontainer.json; do
            if [ ! -f "devcontainers/${STACK}/${CONFIG}" ]; then
              echo "::error::devcontainers/${STACK}/${CONFIG} is missing"
              exit 1
            fi
            echo "Checking devcontainers/${STACK}/${CONFIG}"
            jq . "devcontainers/${STACK}/${CONFIG}"
          done

      # The stack's devcontainer.json as it ships, on the image this job built
      # instead of the published one it pins: its lifecycle commands, mounts
      # and users are the template's. It used to be local-build/, which
      # scripts/check-devcontainer-images.py keeps identical apart from name,
      # image and build, rebuilding the image from its Dockerfile.
      - name: Test devcontainer up
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.files.outputs.template == 'true' }}
        env:
          STACK: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          # A directory of its own: the CLI takes no other file name than
          # devcontainer.json.
          CONFIG_DIR="$(mktemp -d)"
          CONFIG="${CONFIG_DIR}/devcontainer.json"
          jq --arg image "${IMAGE_REF}" '.image = $image' \
            "devcontainers/${STACK}/devcontainer.json" > "${CONFIG}"
          # From the repository root: the template's workspaceMount is
          # ${localWorkspaceFolder}.
          DEVCONTAINER_ARGS=(--workspace-folder . --config "${CONFIG}")
          # The CLI builds through a generated Dockerfile whose own
          # '# syntax=docker/dockerfile:1.27' directive forces an
          # unauthenticated docker.io pull on every run. Anonymous Docker Hub
          # pulls are rate-limited per source IP and runners share a NAT pool,
          # so this resolves outside our control and fails in bursts: on
          # 2026-09-14 it reset main's CI with 'connection reset by peer'
          # against auth.docker.io while the identical tree had passed on
          # develop two hours earlier, and a bare re-run went green. Retry
          # rather than pin: the directive lives in a Dockerfile the CLI
          # generates at build time, so pinning ours does not affect it.
          #
          # --remove-existing-container so that a retry runs the lifecycle
          # again. Without it a postCreateCommand failure on attempt 1 left the
          # container behind, attempt 2 reused it, skipped the lifecycle and
          # reported success, and the job went green on a template that fails
          # for every user who opens it (run 41140335315, latex).
          for ATTEMPT in 1 2 3; do
            if devcontainer up --remove-existing-container "${DEVCONTAINER_ARGS[@]}"; then
              break
            fi
            if [ "${ATTEMPT}" -eq 3 ]; then
              echo "::error::devcontainer up failed after 3 attempts"
              exit 1
            fi
            echo "::warning::devcontainer up attempt ${ATTEMPT} failed; retrying"
            sleep "$((ATTEMPT * 20))"
          done
          # jq fails on a mount written as an object, instead of skipping it.
          VOLUME_TARGETS="$(jq -r '.mounts // [] | .[]
            | select(test("(^|,)type=volume(,|$)"))
            | capture("(^|,)target=(?<target>[^,]+)").target' "${CONFIG}")"
          VOLUME_TARGET_ARGS=()
          if [ -n "${VOLUME_TARGETS}" ]; then
            mapfile -t VOLUME_TARGET_ARGS <<< "${VOLUME_TARGETS}"
          fi
          # The repository root is the template's workspaceMount, /workspace.
          devcontainer exec "${DEVCONTAINER_ARGS[@]}" -- \
            bash /workspace/scripts/check-devcontainer-workload.sh "${STACK}" "${VOLUME_TARGET_ARGS[@]}"
          # no 'devcontainer stop' subcommand exists; the runner cleans up

      # The docker-in-docker profile, which only ansible has. Its feature starts
      # dockerd from the container's entrypoint, through sudo unless the
      # container runs as root, and the images have no working sudo (no rules
      # since 1a62ea6, no package since): no dockerd, and `devcontainer up` still
      # reported success. The script brings it up on the image this job built.
      - name: Test the docker-in-docker profile
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'ansible' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          IMAGE="${IMAGE_REF}" bash scripts/test-devcontainer-profile.sh ansible devcontainer.dind.json 'docker info'

      # The docker-socket profile, which ansible and terraform have. It used to
      # mount the socket and stop there: the images have no docker CLI, vscode
      # is not in the socket's group, and `devcontainer up` reported success. Its
      # feature adds both, again from an entrypoint that needs root. docker
      # version asks the runner's own daemon, so it fails without that access.
      - name: Test the docker-socket profile
        if: ${{ !cancelled() && steps.image.outcome == 'success' && (matrix.image == 'ansible' || matrix.image == 'terraform') }}
        env:
          STACK: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          IMAGE="${IMAGE_REF}" bash scripts/test-devcontainer-profile.sh "${STACK}" devcontainer.docker-socket.json 'docker version'

      # The podman profile, which only ansible has, on the image Dockerfile.podman
      # builds. The podman smoke test above runs under `docker run --privileged`,
      # so it never saw the template, whose --userns=keep-id stopped Docker at
      # once with "invalid USER mode". The check is the smoke test plus a
      # playbook in the Execution Environment, what the profile is for and
      # nothing ran before: a 1.4 GB pull from ghcr.io. Two attempts, for
      # ghcr.io and quay.io: there is no daemon to wait for here, and the
      # default 30 would take most of this job's timeout to fail.
      - name: Test the podman profile
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'ansible-podman' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          IMAGE="${IMAGE_REF}" CHECK_ATTEMPTS=2 \
            bash scripts/test-devcontainer-profile.sh ansible devcontainer.podman.json 'podman-smoke-test --ee'

      # resume.tex compiled with tectonic on the image this job built. It used
      # to run only on develop and main pushes, in scenario-tests, on a latex
      # and a base image of its own (base, which latex does not take).
      - name: Run the LaTeX scenario
        if: ${{ !cancelled() && steps.image.outcome == 'success' && matrix.image == 'latex' }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          bash scripts/assert-image-id.sh "${IMAGE_REF}" "${IMAGE_ID}"
          bash scripts/scenarios/run-latex-cv.sh --image "${IMAGE_REF}"

  # Candidate and nightly mode only, and only once the run passed: every job
  # CI Success aggregates ended in success or skipped, none failed or was
  # cancelled. A record says "this tree passed CI", which a passing image job
  # alone does not. Then each candidate digest gets the tag candidate-<first
  # 12 of the head's tree>, and the run records what it tested in
  # tested-digests.json (scripts/tested-digests.py), the record main's
  # provenance job asks for and 2d publishes from. It names every image:
  # candidate and nightly mode build them all, whatever changed.
  #
  # Nightly mode records and does not tag: its tree is main's, which the
  # promotion that put it there already tagged, and a nightly tag would move
  # candidate-<tree12> off the digests that promotion tested. Its record names
  # the commit it built as both head and base, as main has no other commit to
  # be based on, and 2d publishes from it through this run's id. It still
  # takes the whole run to pass, though the repository's own jobs skip.
  candidate-tag:
    name: Candidate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # CI Success's needs, but provenance (push to main only) and this job.
    needs:
      - changes
      - lint
      - powershell-lint
      - test-playbooks
      - devcontainer-state
      - base
      - candidate-base
      - candidate-build
      - image
      - unit-tests
      - ansible-test
      - molecule
      - scenario-tests
    if: >-
      !cancelled()
      && contains(fromJSON('["candidate", "nightly"]'), needs.changes.outputs.mode)
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.mode == 'nightly' && github.sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      # Skipped is no failure, but legs that were resolved and skipped
      # tested nothing.
      - name: Check every leg ran
        env:
          LEGS: ${{ needs.changes.outputs.legs }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          if [ "${LEGS}" != "[]" ] && [ "${IMAGE_RESULT}" != "success" ]; then
            echo "::error::The image legs ${IMAGE_RESULT:-did not run}; nothing is tagged or recorded."
            exit 1
          fi

      - name: Download the candidate digests
        if: needs.changes.outputs.base == 'true' || needs.changes.outputs.builds != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: candidate-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-digest

      # Fails unless the digests are exactly the images this run built. The
      # attempt is this job's, which GitHub sets on every job; after a re-run
      # it can be later than the candidate builds' (scripts/tested-digests.py).
      - name: Write the record of what this run tested
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
          BASE: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.mode == 'nightly' && github.sha || github.event.pull_request.head.sha }}
          BASE_SHA: ${{ needs.changes.outputs.mode == 'nightly' && github.sha || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TREE="$(git rev-parse "${HEAD_SHA}^{tree}")"
          python3 scripts/tested-digests.py write --digests "${RUNNER_TEMP}/candidate-digest" \
            --images "${IMAGES}" --base "${BASE}" --tree "${TREE}" --head "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}" --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            > "${RUNNER_TEMP}/tested-digests.json"

      # Candidate mode only: see the job's comment.
      - name: Login to GHCR
        if: needs.changes.outputs.mode == 'candidate'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-containers.yml's planned-digest check, then the tag, then the
      # read-back: see the script.
      - name: Tag the tested digests
        if: needs.changes.outputs.mode == 'candidate'
        run: bash scripts/tag-candidates.sh "${RUNNER_TEMP}/tested-digests.json"

      # Last, once every tag resolves: 90 days, longer than a promotion waits
      # for its review.
      - name: Upload the record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tested-digests
          path: ${{ runner.temp }}/tested-digests.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  # On a push to main: the promotion pull request merged as this commit, and
  # the candidate run that tested it, must have recorded this very tree. A
  # port of malpanez/security's scripts/ci/provenance.sh, kept to the one
  # question 2c asks. It fails CI Success on main, loudly, when it cannot
  # prove the tree was tested, and 2d will publish only from its record.
  # Never in nightly mode, which runs on a dispatch or a schedule only (see
  # "Decide the image mode"), never on a push.
  provenance:
    name: Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # The promotion run and its artifact.
      actions: read
      # The pull request merged as this commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Find the run that tested this tree
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/tested-digests.py find-run --repository "${REPOSITORY}" --sha "${SHA}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Download its record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tested-digests
          path: ${{ runner.temp }}/tested-digests
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the record names this tree
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          TREE="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/tested-digests.py verify --tree "${TREE}" --run-id "${RUN_ID}" \
            < "${RUNNER_TEMP}/tested-digests/tested-digests.json"

  unit-tests:
    name: Python Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.mode != 'nightly' && needs.changes.outputs.python == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["${{ needs.changes.outputs.python_version }}"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ -n "$(ls -A tests/*.py 2>/dev/null)" ]; then
            uv run pytest tests/ \
              --verbose \
              --tb=short \
              --maxfail=5 \
              --no-cov \
              -p no:ansible \
              -p no:pytest-ansible
          else
            echo "::notice::No Python tests found, skipping"
          fi

  ansible-test:
    name: Ansible Test
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.mode != 'nightly' && needs.changes.outputs.ansible == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run ansible-test
        run: |
          if [ -x "./scripts/run-ansible-tests.sh" ]; then
            ./scripts/run-ansible-tests.sh
          else
            echo "::notice::ansible-test script not found"
          fi
        env:
          ANSIBLE_TEST_PYTHON_VERSION: ${{ needs.changes.outputs.python_version }}

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    needs: [changes, test-playbooks]
    if: |
      needs.changes.outputs.mode != 'nightly' &&
      needs.changes.outputs.ansible == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ansible 13.x (core 2.20) requires Python >= 3.12 on the node where
        # the tooling is installed: debian13 ships 3.13, ubuntu2404 ships 3.12
        distro: [debian13, ubuntu2404]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install dependencies
        run: |
          # Install from the generated export, not by re-resolving
          # pyproject: `uv pip install .` ignores uv.lock and picks the
          # newest compatible release, which is how CI ended up running
          # ansible 14.3.1 against a lock pinning 14.2.0 and failing the
          # version assertion in playbooks/test-environment.yml.
          # requirements.txt is exported with --all-groups, so it already
          # carries the dev group; the project itself goes in --no-deps.
          uv pip install --system --only-binary :all: -r requirements.txt
          uv pip install --system --no-deps .
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule
        run: |
          set -euo pipefail

          run_scenario() {
            scenario="$1"
            status=0

            molecule converge --scenario-name "$scenario" || status=$?
            if [ "$status" -eq 0 ]; then
              molecule verify --scenario-name "$scenario" || status=$?
            fi

            molecule destroy --scenario-name "$scenario" || true
            return "$status"
          }

          if command -v molecule &> /dev/null; then
            for scenario in default latex ansible_environment devcontainer_base python_tools vscode_config; do
              if [ -d "molecule/${scenario}" ]; then
                run_scenario "${scenario}"
              fi
            done
          else
            echo "::notice::Molecule not installed"
          fi
        env:
          TEST_DISTRO: ${{ matrix.distro }}
          TEST_IMAGE: geerlingguy/docker-${{ matrix.distro }}-ansible:latest

  # The Terraform scenario. The LaTeX one runs in the latex image job, on
  # the image that job built; it built its own here. Both used to wait for
  # devcontainer-build, so a skipped build skipped them too.
  scenario-tests:
    name: Scenario Tests
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      needs.changes.outputs.mode != 'nightly' &&
      needs.changes.outputs.terraform == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.changes.outputs.terraform_version }}

      - name: Run Terraform scenario
        run: |
          if [ -x "./scripts/scenarios/run-terraform-proxmox.sh" ]; then
            ./scripts/scenarios/run-terraform-proxmox.sh
          fi

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # Every job but the three aliases of required checks below, which only
    # repeat results already here under other names. There is no filesystem
    # Grype scan here any more: it sat outside this check on purpose, so it
    # decided nothing. A scan of the
    # checkout against the database of the day must not become a need: an
    # advisory published overnight for a package this repository already
    # pins would block every pull request but the fix (11 on 2026-10-26, 12
    # on 2026-08-10).
    needs:
      - changes
      - lint
      - powershell-lint
      - test-playbooks
      - devcontainer-state
      - base
      - candidate-base
      - candidate-build
      - image
      - candidate-tag
      - provenance
      - unit-tests
      - ansible-test
      - molecule
      - scenario-tests
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of the changes job, and a quote in one of them would end
          # a single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Checking CI results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list: only "success" and "skipped" pass. A skipped job is
          # a job the changes filter decided was irrelevant, and it has to
          # stay green or every filtered pull request would be blocked.
          # "cancelled" fails with "failure": a job that hits its
          # timeout-minutes ends as cancelled, and a cancelled job proved
          # nothing. Any other result fails closed.
          #
          # A run superseded through cancel-in-progress therefore reports
          # CI Success as failed on the OLD commit. That is intended; the new
          # commit gets its own run. Do not relax this to make it green.
          failed=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "$NEEDS_JSON")

          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not pass: $failed"
            exit 1
          fi

          echo "✅ CI passed!"

  # TEMPORARY ALIAS for branch protection. Develop and main require a check
  # named "Quality Summary", which quality.yml produced. That workflow is
  # gone: its lint is the Lint job above, and its radon, vulture and bandit
  # reports, which could not fail, come back later as a real quality gate.
  # This job keeps the required name alive and passes only when Lint
  # passed. Delete it when protection moves to the single ci-gate check.
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: lint
    if: always()
    steps:
      - name: Check results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          # Allow-list: only success passes. Lint has no changes filter, so a
          # skipped Lint means the job it needs failed, and a cancelled one
          # proved nothing.
          if [ "${LINT_RESULT}" != "success" ]; then
            echo "::error::Lint did not pass (${LINT_RESULT:-no result})"
            exit 1
          fi
          echo "Lint passed."

  # TEMPORARY ALIAS for branch protection. Develop and main require a check
  # named "Test Summary", which test-containers.yml produced. Its structure
  # tests run in the image jobs above now, on the image each one built, and
  # the workflow is gone. This job keeps the required name alive. Delete it
  # when protection moves to the single ci-gate check.
  #
  # changes and lint are listed on purpose: when either fails, base and image
  # are skipped, and a skip passes, so without them this check stayed green
  # with no image tested at all. The candidate jobs are listed for the same
  # reason: in candidate and nightly mode they build what the image legs
  # test, and candidate-tag records it.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [changes, lint, base, candidate-base, candidate-build, image, candidate-tag]
    if: always()
    steps:
      - name: Check results
        env:
          # Through env, not expanded inside the script: needs carries the
          # outputs of the changes job, and a quote in one of them would end a
          # single-quoted shell string.
          NEEDS_JSON: ${{ toJSON(needs) }}
          BASE_RESULT: ${{ needs.base.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "Checking image test results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list, as CI Success: only "success" and "skipped" pass. A
          # skipped job is a job the filter decided was irrelevant, and it has
          # to stay green or every filtered pull request would be blocked.
          # "cancelled" fails with "failure": a job that hits its
          # timeout-minutes ends as cancelled, and a cancelled job proved
          # nothing. Any other result fails closed. A run superseded through
          # cancel-in-progress therefore reports this as failed on the OLD
          # commit. That is intended; the new commit gets its own run.
          FAILED=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "${NEEDS_JSON}")

          {
            echo "# Image Tests"
            echo ""
            if [ -n "${FAILED}" ]; then
              echo "❌ Jobs that did not pass: ${FAILED}"
            elif [ "${BASE_RESULT}" = "skipped" ] && [ "${IMAGE_RESULT}" = "skipped" ]; then
              if [ "${EVENT_NAME}" = "push" ]; then
                echo "A push tests no image: the pull request that brought each change tested them."
              else
                echo "No image changed, so no image was built or tested."
              fi
            else
              echo "✅ All image tests passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FAILED}" ]; then
            echo "::error::Jobs that did not pass: ${FAILED}"
            exit 1
          fi

  # TEMPORARY ALIAS for branch protection. Develop and main require a check
  # named "SBOM Verification Success", which sbom-verification.yml produced.
  # Each image job above now generates its image's SBOM and fails when it is
  # unusable; the workflow's other checks (NTIA, licenses, a Grype scan of
  # the SBOMs) could not fail and are gone, with the workflow. This job keeps
  # the required name alive, and passes when the jobs that make the SBOMs
  # passed or were skipped. Delete it when protection moves to the single
  # ci-gate check.
  sbom-verification-success:
    name: SBOM Verification Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # changes and lint are listed for the reason given at Test Summary.
    needs: [changes, lint, base, candidate-base, candidate-build, image, candidate-tag]
    if: always()
    steps:
      - name: Check results
        env:
          # Through env: see Test Summary.
          NEEDS_JSON: ${{ toJSON(needs) }}
          BASE_RESULT: ${{ needs.base.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "Checking SBOM results..."
          jq . <<< "${NEEDS_JSON:?needs context is empty}"

          # Allow-list, as Test Summary: only "success" and "skipped" pass.
          FAILED=$(jq -r '
            [to_entries[]
             | select(.value.result != "success" and .value.result != "skipped")
             | "\(.key) (\(.value.result))"]
            | join(", ")
          ' <<< "${NEEDS_JSON}")

          {
            echo "# SBOMs"
            echo ""
            if [ -n "${FAILED}" ]; then
              echo "❌ Jobs that did not pass: ${FAILED}"
            elif [ "${BASE_RESULT}" = "skipped" ] && [ "${IMAGE_RESULT}" = "skipped" ]; then
              if [ "${EVENT_NAME}" = "push" ]; then
                echo "A push tests no image, so no SBOM was generated."
              else
                echo "No image changed, so no SBOM was generated."
              fi
            else
              echo "✅ Every image tested here has a usable SBOM (presubmit-sbom-* or candidate-sbom-* artifacts)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FAILED}" ]; then
            echo "::error::Jobs that did not pass: ${FAILED}"
            exit 1
          fi
