---
name: Renovate

# Self-hosted Renovate (not the Mend app, which never functioned here —
# onboarding PR #52 autoclosed). Runs in Actions with BOT_TOKEN, so it is
# consistent with the rest of the pipeline and has no external-dashboard
# dependency. It replaces Dependabot + refresh-tool-pins.py once proven:
# native regex managers bump the tool ARGs, docker/actions digests, and
# uv.lock, and postUpgradeTasks (self-hosted only) recompute the pinned
# hashes and regenerate requirements.
#
# STAGED ROLLOUT: dispatch-only + dry-run while validating. Going live
# means adding a `schedule` trigger and removing RENOVATE_DRY_RUN.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry-run mode (full = detect + log, no PRs)'
        type: choice
        options: ["null", "full"]
        default: "null"
      logLevel:
        description: 'Renovate log level'
        type: choice
        options: ["info", "debug"]
        default: "debug"
      force:
        description: 'Ignore the schedule for this run (create PRs now)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682  # v46.2.2
        with:
          # No configurationFile: renovate.json in the repo root is read as
          # the REPO config, so onboarding is skipped. configurationFile
          # would make it the global bot config instead.
          token: ${{ secrets.BOT_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # binarySource=install lets Renovate provision uv to update
          # uv.lock; the requirements export + hash/devcontainer sync run in
          # the renovate-postprocess companion (this container lacks them).
          RENOVATE_BINARY_SOURCE: install
          RENOVATE_FORCE: ${{ inputs.force && '{"schedule":null}' || '' }}
          # Live by default (schedule + manual); pass dryRun=full to only log.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
