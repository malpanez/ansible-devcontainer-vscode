---
# Version updates target develop (the integration branch); Dependabot
# SECURITY updates ignore this file and always target main, which the
# branch-flow guard explicitly allows for dependabot/* branches.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    labels:
      - "dependencies"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/devcontainers/ansible"
      - "/devcontainers/base"
      - "/devcontainers/golang"
      - "/devcontainers/latex"
      - "/devcontainers/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "docker"
    groups:
      base-images:
        patterns:
          - "*"
