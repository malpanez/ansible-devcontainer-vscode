---
# Grype configuration for vulnerability scanning
# Replaces .trivyignore after migration from Trivy (compromised March 2026)
# See: https://github.com/aquasecurity/trivy/discussions/10425
#
# POLICY — Go stdlib and vendored modules in pre-compiled upstream binaries
# -------------------------------------------------------------------------
# grype reads the Go build info embedded in each binary and reports the
# toolchain's stdlib (and vendored golang.org/x modules) as vulnerable
# whenever a newer Go patch release exists. These are THIRD-PARTY release
# binaries (terraform, terragrunt, tflint, sops, age, gh, podman): we
# cannot recompile them, and the vulnerable code
# paths (net/http & SSH servers, x/crypto SSH auth) are not exercised by
# these CLIs run locally in a devcontainer. Rather than chase each new
# CVE id — Go stdlib advisories land in waves of dozens — the ignores
# below are scoped by (package, binary location). They suppress ONLY the
# embedded stdlib/x-crypto findings on those specific binaries; a
# vulnerability in the tool's OWN code still surfaces. The golang image's
# Go toolchain is deliberately NOT covered — it must track Go security
# releases through its base-image bump.
# Revisit when a vendor ships a release built with a newer Go toolchain.
#
# EXCEPTION — aws-cli's bundled CPython is NOT under that policy. It is the
# CLI's whole interpreter and TLS stack, not an embedded Go stdlib, so a
# blanket (package, location) rule would hide every present and future
# CPython CVE: one hid a critical (CVE-2026-115557) for the whole life of
# the -aws images. It also looks able to hide the image's own Python when the
# versions match, since grype can report one package with several locations
# (not proven: the versions differ today).
# Its entry below therefore names a single CVE.

ignore:
  # --- age / age-keygen (v1.3.1 is the latest release; stale Go + x/crypto)
  - package:
      name: stdlib
      location: "/usr/local/bin/age*"
  - package:
      name: golang.org/x/crypto
      location: "/usr/local/bin/age*"

  # --- terragrunt (latest release still built with an older Go toolchain)
  - package:
      name: stdlib
      location: "/usr/local/bin/terragrunt"
  - package:
      name: golang.org/x/crypto
      location: "/usr/local/bin/terragrunt"

  # --- terraform / tflint / sops (HashiCorp/getsops release binaries)
  - package:
      name: stdlib
      location: "/usr/local/bin/terraform"
  - package:
      name: stdlib
      location: "/usr/local/bin/tflint"
  - package:
      name: stdlib
      location: "/usr/local/bin/sops"
  # sops v3.13.3 (latest release, 2026-07-23) vendors google.golang.org/grpc
  # v1.82.1. Both open HIGH advisories against it are server-side:
  #   GHSA-2v4p-qf9q-27wj  panic in the xDS routing interceptor. Reaching it
  #     requires a server built with xds.NewGRPCServer(); sops has zero
  #     references to google.golang.org/grpc/xds and uses plain
  #     grpc.NewServer(), so this one cannot be reached at all.
  #   GHSA-vp52-pcj8-j9qc  heap exhaustion from fragmented HTTP/2 DATA
  #     frames against a gRPC server. sops does contain one
  #     (cmd/sops/subcommand/keyservice), but it only listens when a user
  #     explicitly runs `sops keyservice`, which nothing in these images
  #     does. Anyone exposing that subcommand on an untrusted network
  #     should treat this as live and pin sops themselves.
  # There is no sops release carrying patched grpc, so this is not
  # suppressible by upgrading. Renovate tracks getsops/sops, so the ignore
  # goes inert the moment upstream rebuilds. Matches the existing grpc
  # rules for terraform/terragrunt/tflint/gh; sops was simply the gap.
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/sops"
  # tflint bundles sigstore/rekor for keyless verification; pre-compiled.
  - package:
      name: github.com/sigstore/rekor
      location: "/usr/local/bin/tflint"

  # --- gh CLI (apt package from cli.github.com in every image that has it,
  # Go stdlib + grpc, pre-compiled)
  - package:
      name: stdlib
      location: "/usr/bin/gh"
  - package:
      name: golang.org/x/crypto
      location: "/usr/bin/gh"

  # --- aws-cli bundles its own CPython (libpython3.14.so.1.0, 3.14.8).
  # CVE-2026-115557 (critical, CPython's ssl denylist of compromised
  # certificates) is fixed in 3.14.10 and is accepted here for one reason:
  # this repository cannot patch the CPython that AWS CLI bundles, and no
  # AWS CLI release has rebundled a fixed one. Verified on 2026-10-30 on
  # AWS CLI 2.38.5 (the pinned version) and 2.39.2 (the newest at the
  # time), both with Python 3.14.8. This is ONE CVE, not the whole
  # library: any other vulnerability in that Python must stop the -aws
  # gates until someone decides. When a new AWS CLI version bundles a
  # Python at or above 3.14.10, delete this entry.
  - vulnerability: CVE-2026-115557
    package:
      name: python
      location: "/usr/local/aws-cli/**/libpython*.so*"

  # --- podman stack (ansible/podman image): Debian-packaged Go binaries.
  - package:
      name: stdlib
      location: "/usr/bin/podman"
  - package:
      name: stdlib
      location: "/usr/bin/conmon"
  # podman's helper binaries live in /usr/libexec/podman, which the two
  # rules above never matched — rootlessport and quadlet alone accounted
  # for 106 open alerts (and 9 of the 12 criticals). Same Debian package,
  # same un-recompilable Go toolchain as /usr/bin/podman.
  - package:
      name: stdlib
      location: "/usr/libexec/podman/**"
  - package:
      name: golang.org/x/crypto
      location: "/usr/libexec/podman/**"

  # --- other vendored golang.org/x modules in the same pre-compiled
  # binaries. Same policy and same binaries as the stdlib rules above: we
  # do not build these releases, so the only fix is upstream rebuilding.
  # x/mod advisories alone accounted for 12 of the last 19 open alerts.
  - package:
      name: golang.org/x/mod
      location: "/usr/local/bin/terraform"
  - package:
      name: golang.org/x/mod
      location: "/usr/local/bin/terragrunt"
  - package:
      name: golang.org/x/mod
      location: "/usr/local/bin/tflint"
  - package:
      name: golang.org/x/mod
      location: "/usr/bin/gh"
  - package:
      name: golang.org/x/text
      location: "/usr/local/bin/terraform"
  - package:
      name: golang.org/x/net
      location: "/usr/bin/gh"
  # x/net: the Go security release of 2026-10-08 (fixed in x/net v0.60.0)
  # published GO-2026-6603, -6610, -6611, -6612 and -6617 against both
  # stdlib net/http and golang.org/x/net; it is the same HTTP/2 code. No
  # upstream release carries the fix yet (2026-10-12): terraform 1.16.5
  # and terragrunt 1.1.6 embed v0.58.0, tflint 0.64.0 v0.56.0, sops 3.13.3
  # v0.57.0, and these are the latest releases, so there is nothing to
  # bump to. 6603, 6611, 6612 and 6617 are HTTP/2 SERVER issues; these
  # CLIs do not serve HTTP/2. 6610 is an HTTP/2 TRANSPORT (client) issue:
  # a malicious or compromised server or proxy could send malformed
  # framing headers to these tools. That one is ACCEPTED, not unreachable.
  # Renovate tracks all four tools, so the ignore goes inert for these
  # advisories as soon as upstream ships a rebuild.
  - package:
      name: golang.org/x/net
      location: "/usr/local/bin/terraform"
  - package:
      name: golang.org/x/net
      location: "/usr/local/bin/terragrunt"
  - package:
      name: golang.org/x/net
      location: "/usr/local/bin/tflint"
  - package:
      name: golang.org/x/net
      location: "/usr/local/bin/sops"

  # --- vendored grpc in pre-compiled release binaries (same policy as
  # stdlib above: we cannot rebuild these, and no gRPC server is served).
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/terraform"
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/terragrunt"
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/tflint"
  - package:
      name: google.golang.org/grpc
      location: "/usr/bin/gh"

  # go-jose v4 <= 4.1.5, GHSA-mgcc-cww5-fp2q (published 2026-10-27, fixed
  # in 4.1.6): a JWK carrying crafted RSA private-key parameters makes
  # crypto/rsa PrivateKey.Validate run in cubic time, so parsing it burns
  # CPU. terraform 1.17.0, terragrunt 1.2.1, tflint 0.65.0 and sops 3.13.3,
  # the latest releases (checked 2026-10-28), all embed v4.1.4, so there is
  # nothing to bump to. Reaching it takes a JWK supplied by a malicious or
  # compromised endpoint or file, and the worst case is a CLI hung on one
  # developer's machine: ACCEPTED, not unreachable. Scoped to this one
  # advisory, so any other go-jose finding in these binaries still blocks.
  # Renovate tracks all four tools; remove these rules once each ships
  # go-jose >= 4.1.6.
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package:
      name: github.com/go-jose/go-jose/v4
      location: "/usr/local/bin/terraform"
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package:
      name: github.com/go-jose/go-jose/v4
      location: "/usr/local/bin/terragrunt"
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package:
      name: github.com/go-jose/go-jose/v4
      location: "/usr/local/bin/tflint"
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package:
      name: github.com/go-jose/go-jose/v4
      location: "/usr/local/bin/sops"
