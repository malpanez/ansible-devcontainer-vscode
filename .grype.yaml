---
# Grype configuration for vulnerability scanning
# Replaces .trivyignore after migration from Trivy (compromised March 2026)
# See: https://github.com/aquasecurity/trivy/discussions/10425
#
# POLICY — Go stdlib / x-crypto in pre-compiled upstream binaries
# ---------------------------------------------------------------
# grype reads the Go build info embedded in each binary and reports the
# toolchain's stdlib (and vendored x/crypto) as vulnerable whenever a
# newer Go patch release exists. These are THIRD-PARTY release binaries
# (terraform, terragrunt, tflint, sops, age, gh, podman, aws-cli's
# bundled Python): we cannot recompile them, and the vulnerable code
# paths (net/http & SSH servers, x/crypto SSH auth) are not exercised by
# these CLIs run locally in a devcontainer. Rather than chase each new
# CVE id — Go stdlib advisories land in waves of dozens — the ignores
# below are scoped by (package, binary location). They suppress ONLY the
# embedded stdlib/x-crypto findings on those specific binaries; a
# vulnerability in the tool's OWN code still surfaces. The golang image's
# Go toolchain is deliberately NOT covered — it must track Go security
# releases through its base-image bump.
# Revisit when a vendor ships a release built with a newer Go toolchain.

ignore:
  # --- age / age-keygen (v1.3.1 is the latest release; stale Go + x/crypto)
  - package:
      name: stdlib
      location: "/usr/local/bin/age*"
  - package:
      name: golang.org/x/crypto
      location: "/usr/local/bin/age*"

  # --- terragrunt (latest release still built with an older Go toolchain)
  - package:
      name: stdlib
      location: "/usr/local/bin/terragrunt"
  - package:
      name: golang.org/x/crypto
      location: "/usr/local/bin/terragrunt"

  # --- terraform / tflint / sops (HashiCorp/getsops release binaries)
  - package:
      name: stdlib
      location: "/usr/local/bin/terraform"
  - package:
      name: stdlib
      location: "/usr/local/bin/tflint"
  - package:
      name: stdlib
      location: "/usr/local/bin/sops"
  # tflint bundles sigstore/rekor for keyless verification; pre-compiled.
  - package:
      name: github.com/sigstore/rekor
      location: "/usr/local/bin/tflint"

  # --- gh CLI (Debian apt package; Go stdlib + grpc, pre-compiled)
  - package:
      name: stdlib
      location: "/usr/bin/gh"
  - package:
      name: golang.org/x/crypto
      location: "/usr/bin/gh"

  # --- aws-cli bundles its own CPython; not patchable until AWS rebundles.
  - package:
      name: python
      location: "/usr/local/aws-cli/**/libpython*.so*"

  # --- podman stack (ansible/podman image): Debian-packaged Go binaries.
  - package:
      name: stdlib
      location: "/usr/bin/podman"
  - package:
      name: stdlib
      location: "/usr/bin/conmon"
  # podman's helper binaries live in /usr/libexec/podman, which the two
  # rules above never matched — rootlessport and quadlet alone accounted
  # for 106 open alerts (and 9 of the 12 criticals). Same Debian package,
  # same un-recompilable Go toolchain as /usr/bin/podman.
  - package:
      name: stdlib
      location: "/usr/libexec/podman/**"
  - package:
      name: golang.org/x/crypto
      location: "/usr/libexec/podman/**"

  # --- vendored grpc in pre-compiled release binaries (same policy as
  # stdlib above: we cannot rebuild these, and no gRPC server is served).
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/terraform"
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/terragrunt"
  - package:
      name: google.golang.org/grpc
      location: "/usr/local/bin/tflint"
  - package:
      name: google.golang.org/grpc
      location: "/usr/bin/gh"
