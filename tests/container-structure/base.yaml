---
schemaVersion: 2.0.0

fileExistenceTests:
  # Python toolchain
  - name: 'Python binary exists'
    path: '/usr/local/bin/python3'
    shouldExist: true

  # uv package manager
  - name: 'uv binary installed'
    path: '/usr/local/bin/uv'
    shouldExist: true

  - name: 'uvx binary installed'
    path: '/usr/local/bin/uvx'
    shouldExist: true

  - name: 'Workspace directory'
    path: '/workspace'
    shouldExist: true

  # Debian's yamllint (1.29.0, with Debian's python3.11) is gone; yamllint
  # comes from uv.lock like pre-commit.
  - name: 'No Debian yamllint'
    path: '/usr/bin/yamllint'
    shouldExist: false

  # The Dev Containers extension copies the user's .gitconfig only when the
  # container's has nothing but [filter] and [safe] sections, so what the image
  # configures goes in the system file.
  - name: 'No .gitconfig in the home directory'
    path: '/home/vscode/.gitconfig'
    shouldExist: false

  # Created for the stacks built on this image: their templates mount
  # named volumes on them, and a new volume takes the directory's owner.
  - name: 'pre-commit cache owned by vscode'
    path: '/home/vscode/.cache/pre-commit'
    shouldExist: true
    uid: 1000

  - name: 'Ansible directory owned by vscode'
    path: '/home/vscode/.ansible'
    shouldExist: true
    uid: 1000

  # sudo has had no rules since 1a62ea6, so the package is not installed: a
  # setuid root binary that only ever answered "a password is required".
  - name: 'No sudo binary'
    path: '/usr/bin/sudo'
    shouldExist: false

commandTests:
  # Debian 13. Fails on a revert, or on a digest of another release.
  - name: 'Debian 13'
    command: 'cat'
    args: ['/etc/os-release']
    expectedOutput: ['ID=debian', 'VERSION_ID="13"', 'VERSION_CODENAME=trixie']

  - name: 'sudo is not on the PATH'
    command: 'sh'
    args: ['-c', '! command -v sudo']
    exitCode: 0

  # Python version: any 3.x, as the other tests match names, not versions
  - name: 'Python 3 available'
    command: 'python3'
    args: ['--version']
    expectedOutput: ['Python 3\.[0-9]+']

  # /usr/bin/python3 is a link to this Python (devcontainers/base/Dockerfile),
  # so ansible_python_interpreter: /usr/bin/python3 survives Debian's python3
  # going away. Same interpreter and prefix, not just some Python 3.
  - name: '/usr/bin/python3 is the base Python'
    command: '/usr/bin/python3'
    args: ['-I', '-c', 'import os, sys; print("Python", sys.version.split()[0], os.path.realpath(sys.executable), sys.prefix)']
    expectedOutput: ['Python 3\.[0-9]+\.[0-9]+ /usr/local/bin/python3\.[0-9]+ /usr/local']

  # uv works
  - name: 'uv functional'
    command: 'uv'
    args: ['--version']
    exitCode: 0

  # pre-commit and yamllint: the devcontainer-tools group of uv.lock. Major
  # only; the lock owns the exact versions.
  - name: 'pre-commit available'
    command: 'pre-commit'
    args: ['--version']
    expectedOutput: ['pre-commit [0-9]+\.[0-9]+']

  - name: 'yamllint available'
    command: 'yamllint'
    args: ['--version']
    expectedOutput: ['yamllint [0-9]+\.[0-9]+']

  # One copy of each, in the system site-packages: Debian's yamllint used to
  # ship beside it.
  - name: 'pre-commit and yamllint installed once'
    command: 'sh'
    args:
      - '-c'
      - 'find / -xdev \( -name "pre_commit-*-info" -o -name "yamllint-*-info" \) 2>/dev/null | sort'
    expectedOutput:
      - '\A/usr/local/lib/python3\.[0-9]+/site-packages/pre_commit-[0-9.]+\.dist-info\n/usr/local/lib/python3\.[0-9]+/site-packages/yamllint-[0-9.]+\.dist-info\n\z'

  # useradd's default is /bin/sh, which VS Code would open terminals in.
  - name: 'Login shell is bash'
    command: 'sh'
    args: ['-c', 'grep "^vscode:" /etc/passwd']
    expectedOutput: ['(?m)^vscode:.*:/bin/bash$']
    exitCode: 0

  # git needs it for every git@ remote: "error: cannot run ssh".
  - name: 'ssh client runs'
    command: 'ssh'
    args: ['-V']
    expectedError: ['OpenSSH_']
    exitCode: 0

  # uv leaves /tmp/uv-<hash>.lock behind, mode 0666, after an install into a
  # system environment; the build removes it (devcontainers/base/Dockerfile).
  - name: 'No world-writable file in /tmp'
    command: 'sh'
    args: ['-c', '! find /tmp -xdev -type f -perm -0002 | grep .']
    exitCode: 0

  # Workspace writable
  - name: 'Workspace writable'
    command: 'sh'
    args: ['-c', 'touch /workspace/.test && rm /workspace/.test']
    exitCode: 0

  # Same check as ansible.yaml, for the bytecode base ships itself. The
  # ansible image keeps these files as they are and adds only what differs,
  # so they reach it unchanged.
  - name: 'No stale timestamp bytecode under /usr/local/lib'
    command: 'python3'
    args:
      - '-I'
      - '-c'
      - |
        import glob, importlib.util, os, sys
        stale, total = [], 0
        for root in glob.glob("/usr/local/lib/python3.*"):
            for folder, _, files in os.walk(root):
                for name in files:
                    pyc = os.path.join(folder, name)
                    if not name.endswith(".pyc"):
                        continue
                    with open(pyc, "rb") as fh:
                        head = fh.read(16)
                    if int.from_bytes(head[4:8], "little") != 0:
                        continue
                    try:
                        src = os.stat(importlib.util.source_from_cache(pyc))
                    except (ValueError, OSError):
                        continue
                    total += 1
                    recorded = (int.from_bytes(head[8:12], "little"), int.from_bytes(head[12:16], "little"))
                    if recorded != (int(src.st_mtime) & 0xFFFFFFFF, src.st_size & 0xFFFFFFFF):
                        stale.append(pyc)
        print(f"stale timestamp .pyc: {len(stale)} of {total}", *stale[:20], sep="\n")
        sys.exit(1 if stale else 0)
    expectedOutput: ['stale timestamp \.pyc: 0 of']
    exitCode: 0

metadataTest:
  labels:
    - key: 'org.opencontainers.image.source'
      value: 'https://github.com/malpanez/ansible-devcontainer-vscode'

  # Users' own installs keep uv's bytecode; only the build compiles checked-hash
  # (devcontainers/base/Dockerfile).
  envVars:
    - key: 'LANG'
      value: 'C.UTF-8'
    - key: 'UV_COMPILE_BYTECODE'
      value: '1'

  workdir: '/workspace'
  user: 'vscode'
