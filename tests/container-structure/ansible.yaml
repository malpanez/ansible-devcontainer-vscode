---
schemaVersion: 2.0.0

fileExistenceTests:
  # Python toolchain
  - name: 'Python binary exists'
    path: '/usr/local/bin/python3'
    shouldExist: true

  # uv package manager
  - name: 'uv binary installed'
    path: '/usr/local/bin/uv'
    shouldExist: true

  # Ansible tools
  - name: 'ansible binary exists'
    path: '/usr/local/bin/ansible'
    shouldExist: true

  - name: 'ansible-playbook exists'
    path: '/usr/local/bin/ansible-playbook'
    shouldExist: true

  # Pre-commit template
  - name: 'Pre-commit config template'
    path: '/usr/local/share/devcontainer-skel/ansible/.pre-commit-config.yaml'
    shouldExist: true

  - name: 'Workspace directory'
    path: '/workspace'
    shouldExist: true

commandTests:
  # Python version: any 3.x, as the other tests match names, not versions
  - name: 'Python 3 available'
    command: 'python3'
    args: ['--version']
    expectedOutput: ['Python 3\.[0-9]+']

  # uv works
  - name: 'uv functional'
    command: 'uv'
    args: ['--version']
    exitCode: 0

  # Ansible version
  - name: 'Ansible installed'
    command: 'ansible'
    args: ['--version']
    expectedOutput: ['ansible \[core 2\.[0-9]+\.[0-9]+']

  # ansible-core alone: the ansible package and its 92 bundled collections
  # were replaced by the pinned set in devcontainers/ansible/collections.txt.
  - name: 'ansible-core without the ansible package'
    command: 'python3'
    args:
      - '-I'
      - '-c'
      - |
        import importlib.metadata as md
        print("ansible-core", md.version("ansible-core"))
        try:
            print("ansible package present:", md.version("ansible"))
            raise SystemExit(1)
        except md.PackageNotFoundError:
            print("ansible package absent")
    expectedOutput: ['ansible package absent']
    exitCode: 0

  # Exactly the collections pinned in collections.txt, by name: the build
  # installs each at its pinned version and sha256. Adding or dropping one
  # is a deliberate change to that file and to this list. ansible-core's
  # own internal collection (ansible._protomatter) lives inside the ansible
  # package and is not counted.
  - name: 'Exactly the pinned collections'
    command: 'python3'
    args:
      - '-I'
      - '-c'
      - |
        import json, os, subprocess, sys, sysconfig
        expected = {
            "ansible.posix",
            "community.docker",
            "community.general",
            "community.library_inventory_filtering_v1",
        }
        listed = json.loads(subprocess.run(
            ["ansible-galaxy", "collection", "list", "--format", "json"],
            capture_output=True, text=True, check=True).stdout)
        found = {name for path, cols in listed.items()
                 if "/ansible/_internal/" not in path for name in cols}
        root = os.path.join(sysconfig.get_path("purelib"), "ansible_collections")
        on_disk = {f"{ns}.{name}" for ns in os.listdir(root)
                   for name in os.listdir(os.path.join(root, ns))}
        print("listed:", sorted(found))
        print("on disk:", sorted(on_disk))
        sys.exit(0 if found == expected == on_disk else 1)
    exitCode: 0

  # ansible-core imports collection code through its own loader, which
  # compiles the source in memory and never reads __pycache__; bytecode
  # there would only be dead weight (see devcontainers/ansible/Dockerfile).
  - name: 'No bytecode under ansible_collections'
    command: 'python3'
    args:
      - '-I'
      - '-c'
      - |
        import os, sys, sysconfig
        root = os.path.join(sysconfig.get_path("purelib"), "ansible_collections")
        found = [os.path.join(d, f) for d, _, files in os.walk(root) for f in files if f.endswith(".pyc")]
        print(f"pyc under ansible_collections: {len(found)}", *found[:10], sep="\n")
        sys.exit(1 if found else 0)
    expectedOutput: ['pyc under ansible_collections: 0']
    exitCode: 0

  # What community.docker imports at runtime (pyproject.toml says where the
  # list comes from); paramiko also backs ansible-core's paramiko_ssh
  # connection plugin.
  - name: 'Collection runtime libraries import'
    command: 'python3'
    args:
      - '-I'
      - '-c'
      - 'import docker, paramiko, requests; print("imports ok")'
    expectedOutput: ['imports ok']
    exitCode: 0

  # One module from each collection must resolve (syntax-check fails on an
  # unknown action), and the two that need nothing outside the container
  # really run on localhost. The docker task is tagged never: it would need
  # a daemon. No shell variables in here: container-structure-test expands
  # them itself, against the image's environment, before the shell sees the
  # script.
  - name: 'Collections load and run'
    command: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        rm -rf /tmp/collection-smoke
        mkdir /tmp/collection-smoke
        cat > /tmp/collection-smoke/smoke.yml <<'PLAY'
        ---
        - name: Collection smoke test
          hosts: localhost
          connection: local
          gather_facts: false
          vars:
            smoke_dir: /tmp/collection-smoke
          tasks:
            - name: ansible.posix
              ansible.posix.authorized_key:
                user: "{{ lookup('ansible.builtin.pipe', 'id -un') }}"
                key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBFsDH6V1x6TcfcXXc6l2Ylkg0EnzOFJl9Fy7oR5yScZ smoke"
                path: "{{ smoke_dir }}/authorized_keys"
                manage_dir: false
            - name: community.general
              community.general.ini_file:
                path: "{{ smoke_dir }}/smoke.ini"
                section: smoke
                option: collections
                value: "{{ {'baked': 'in'} | community.general.dict_kv('state') | to_json }}"
                mode: "0600"
            - name: community.docker
              community.docker.docker_container_info:
                name: smoke
              tags: [never]
        PLAY
        ansible-playbook --syntax-check /tmp/collection-smoke/smoke.yml
        ansible-playbook /tmp/collection-smoke/smoke.yml
        grep -q 'ssh-ed25519' /tmp/collection-smoke/authorized_keys
        grep -q 'baked' /tmp/collection-smoke/smoke.ini
    expectedOutput: ['ok=2\s+changed=2\s+unreachable=0\s+failed=0']
    exitCode: 0

  - name: 'ansible-lint runs'
    command: 'ansible-lint'
    args: ['--version']
    expectedOutput: ['ansible-lint [0-9]+\.[0-9]+.*ansible-core:2\.']
    exitCode: 0

  - name: 'ansible-navigator runs'
    command: 'ansible-navigator'
    args: ['--version']
    expectedOutput: ['ansible-navigator [0-9]+\.[0-9]+']
    exitCode: 0

  - name: 'yamllint runs'
    command: 'yamllint'
    args: ['--version']
    expectedOutput: ['yamllint [0-9]+\.[0-9]+']
    exitCode: 0

  # Pre-commit available
  - name: 'pre-commit available'
    command: 'pre-commit'
    args: ['--version']
    expectedOutput: ['pre-commit']

  # Workspace writable
  - name: 'Workspace writable'
    command: 'sh'
    args: ['-c', 'touch /workspace/.test && rm /workspace/.test']
    exitCode: 0

  # A timestamp .pyc records its source's mtime and size. Published images
  # are exported with rewrite-timestamp, which clamps mtimes to
  # SOURCE_DATE_EPOCH, so a .pyc written at build time in that mode goes
  # stale and, since vscode cannot rewrite /usr/local/lib, every import of
  # it recompiles in memory. Build-time bytecode is checked-hash for that
  # reason (devcontainers/base/Dockerfile); this fails if any is not.
  - name: 'No stale timestamp bytecode under /usr/local/lib'
    command: 'python3'
    args:
      - '-I'
      - '-c'
      - |
        import glob, importlib.util, os, sys
        stale, total = [], 0
        for root in glob.glob("/usr/local/lib/python3.*"):
            for folder, _, files in os.walk(root):
                for name in files:
                    pyc = os.path.join(folder, name)
                    if not name.endswith(".pyc"):
                        continue
                    with open(pyc, "rb") as fh:
                        head = fh.read(16)
                    if int.from_bytes(head[4:8], "little") != 0:
                        continue
                    try:
                        src = os.stat(importlib.util.source_from_cache(pyc))
                    except (ValueError, OSError):
                        continue
                    total += 1
                    recorded = (int.from_bytes(head[8:12], "little"), int.from_bytes(head[12:16], "little"))
                    if recorded != (int(src.st_mtime) & 0xFFFFFFFF, src.st_size & 0xFFFFFFFF):
                        stale.append(pyc)
        print(f"stale timestamp .pyc: {len(stale)} of {total}", *stale[:20], sep="\n")
        sys.exit(1 if stale else 0)
    expectedOutput: ['stale timestamp \.pyc: 0 of']
    exitCode: 0

metadataTest:
  labels:
    - key: 'org.opencontainers.image.source'
      value: 'https://github.com/malpanez/ansible-devcontainer-vscode'

  envVars:
    - key: 'DEVCONTAINER_STACK'
      value: 'ansible'
    - key: 'WORKSPACE'
      value: '/workspace'

  workdir: '/workspace'
  cmd: ['/bin/bash']
  user: 'vscode'
