---
# devcontainer-ansible-podman is the ansible stack plus Podman, so
# test-containers.yml runs ansible.yaml against it as well; this file holds
# only what the Podman layer adds.
schemaVersion: 2.0.0

fileExistenceTests:
  # Podman and its rootless dependencies
  - name: 'podman binary'
    path: '/usr/bin/podman'
    shouldExist: true

  - name: 'crun runtime'
    path: '/usr/bin/crun'
    shouldExist: true

  - name: 'conmon'
    path: '/usr/bin/conmon'
    shouldExist: true

  - name: 'fuse-overlayfs'
    path: '/usr/bin/fuse-overlayfs'
    shouldExist: true

  # The default rootless network: `podman run` needs it.
  - name: 'pasta'
    path: '/usr/bin/pasta'
    shouldExist: true

  - name: 'slirp4netns'
    path: '/usr/bin/slirp4netns'
    shouldExist: true

  # File capabilities, not Debian's setuid root: see Dockerfile.podman. The
  # template's runArgs do not give the container the CAP_SYS_ADMIN that the
  # setuid form needs, so a setuid bit here fails `podman run` in the template.
  - name: 'newuidmap is not setuid'
    path: '/usr/bin/newuidmap'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0

  - name: 'newgidmap is not setuid'
    path: '/usr/bin/newgidmap'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0

  # newuidmap runs with CAP_SETUID and trusts these: writable by vscode, they
  # would make vscode root in the container.
  - name: '/etc/subuid is not writable by vscode'
    path: '/etc/subuid'
    shouldExist: true
    permissions: '-rw-r--r--'
    uid: 0

  - name: '/etc/subgid is not writable by vscode'
    path: '/etc/subgid'
    shouldExist: true
    permissions: '-rw-r--r--'
    uid: 0

  # Rootless configuration: podman refuses to run when it is not the user's
  - name: 'Rootless storage.conf owned by vscode'
    path: '/home/vscode/.config/containers/storage.conf'
    shouldExist: true
    uid: 1000

  - name: 'Rootless containers.conf owned by vscode'
    path: '/home/vscode/.config/containers/containers.conf'
    shouldExist: true
    uid: 1000

  # The template mounts a named volume here: see ansible.yaml.
  - name: 'Podman storage owned by vscode'
    path: '/home/vscode/.local/share/containers'
    shouldExist: true
    uid: 1000

  - name: 'Podman smoke test script'
    path: '/usr/local/bin/podman-smoke-test'
    shouldExist: true

  - name: 'Execution environment template'
    path: '/usr/local/share/devcontainer-skel/ansible/execution-environment.yml'
    shouldExist: true

  # Removed on purpose: podman's own test helper, and the random machine
  # ID that made every build differ (see Dockerfile.podman)
  - name: 'No podman-testing helper'
    path: '/usr/libexec/podman/podman-testing'
    shouldExist: false

  - name: 'No baked-in machine ID'
    path: '/etc/machine-id'
    shouldExist: false

  - name: 'No baked-in D-Bus machine ID'
    path: '/var/lib/dbus/machine-id'
    shouldExist: false

  # sudo has had no rules since 1a62ea6, so the package is not installed: a
  # setuid root binary that only ever answered "a password is required".
  - name: 'No sudo binary'
    path: '/usr/bin/sudo'
    shouldExist: false

fileContentTests:
  # Outside every host's uids, because updateRemoteUserUID gives vscode the
  # host's uid and podman refuses a range that contains it.
  - name: 'vscode has the subordinate uids above 65536'
    path: '/etc/subuid'
    expectedContents: ['(?m)^vscode:100000:65536$']

  - name: 'vscode has the subordinate gids above 65536'
    path: '/etc/subgid'
    expectedContents: ['(?m)^vscode:100000:65536$']

  - name: 'gh comes from cli.github.com'
    path: '/etc/apt/sources.list.d/github-cli.list'
    expectedContents: ['https://cli\.github\.com/packages stable main']

commandTests:
  - name: 'newuidmap has its file capability'
    command: 'getcap'
    args: ['/usr/bin/newuidmap']
    expectedOutput: ['cap_setuid=ep']

  - name: 'newgidmap has its file capability'
    command: 'getcap'
    args: ['/usr/bin/newgidmap']
    expectedOutput: ['cap_setgid=ep']

  # Debian's package is 2.46.0, which cli.github.com's documentation says is
  # broken by deprecated GitHub APIs. Its version line names Debian.
  - name: 'gh is not the Debian build'
    command: 'gh'
    args: ['--version']
    expectedOutput: ['gh version [0-9]']
    excludedOutput: ['Debian']

  - name: 'gh package is GitHub''s'
    command: 'dpkg-query'
    args: ['--status', 'gh']
    expectedOutput: ['(?m)^Maintainer: GitHub']

  - name: 'sudo is not on the PATH'
    command: 'sh'
    args: ['-c', '! command -v sudo']
    exitCode: 0

  # The Dockerfile requires 5.4 or later; any 5.x and up loads here
  - name: 'Podman runs'
    command: 'podman'
    args: ['--version']
    expectedOutput: ['podman version ([5-9]|[1-9][0-9])\.']

  # This image creates its own user; the others inherit it from base.yaml's.
  # useradd's default is /bin/sh, which VS Code would open terminals in.
  - name: 'Login shell is bash'
    command: 'sh'
    args: ['-c', 'grep "^vscode:" /etc/passwd']
    expectedOutput: ['(?m)^vscode:.*:/bin/bash$']
    exitCode: 0

  # uv leaves /tmp/uv-<hash>.lock behind, mode 0666, after an install into a
  # system environment; the build removes it (devcontainers/base/Dockerfile).
  - name: 'No world-writable file in /tmp'
    command: 'sh'
    args: ['-c', '! find /tmp -xdev -type f -perm -0002 | grep .']
    exitCode: 0

metadataTest:
  # From the python base. Not every digest sets it (3.14.8 did not, 3.14.10
  # does), and nothing else in this image does.
  envVars:
    - key: 'LANG'
      value: 'C.UTF-8'
