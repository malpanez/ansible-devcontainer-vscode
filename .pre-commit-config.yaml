---
# The lint contract. CI's Lint job (ci.yml) runs `pre-commit run --all-files`
# and nothing else in CI lints, so a hook here is the one place a linter runs
# and the one place its version is set. `make lint` runs the same command.
#
# Revs are frozen to the tag's commit, as `pre-commit autoupdate --freeze`
# writes them; Renovate's pre-commit manager moves the commit and the comment
# together.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: check-yaml
        name: Check YAML Syntax
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-json
        name: Check JSON Syntax
        # devcontainer.json and VS Code settings are JSONC by spec
        # (comments + trailing commas)
        exclude: '(devcontainer.*|\.vscode/.*)\.json$'
      - id: check-toml
        name: Check TOML Syntax
      - id: check-added-large-files
        name: Check for Large Files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for Merge Conflicts
      - id: detect-private-key
        name: Detect Private Keys
      - id: check-case-conflict
        name: Check Case Conflicts
      - id: mixed-line-ending
        name: Fix Mixed Line Endings

  # The tools uv.lock pins run from the project environment, so the lock is
  # the only place their versions are set. As hooks with revs of their own
  # they drifted from it: ruff 0.14.3 against 0.17.3, ansible-lint 25.9.2
  # against 26.10.1, yamllint 1.37.1 against 1.38.0, while CI and the images
  # ran the lock's. --locked fails when uv.lock is out of date with
  # pyproject.toml instead of resolving afresh. --no-build installs wheels
  # only, so no package's build script ever runs (every locked package has
  # a wheel, and the project itself is not built: package = false).
  - repo: local
    hooks:
      - id: yamllint
        name: Lint YAML Files
        entry: uv run --locked --no-build yamllint -c .yamllint
        language: system
        types: [file, yaml]

      # Offline, as .ansible-lint sets it, so it never installs requirements.yml
      # unpinned. It resolves modules only against the collections the ansible
      # images ship, pinned with their sha256 in
      # devcontainers/ansible/collections.txt, which `make lint-deps` installs
      # into .cache/ansible-lint/collections, CI included. Offline,
      # ansible-lint puts $ANSIBLE_HOME/collections first on the path
      # (~/.ansible/collections by default), so ANSIBLE_HOME moves it there,
      # and ANSIBLE_COLLECTIONS_PATH replaces the paths ansible.cfg sets. A
      # copy in ~/.ansible or ./collections is never read. Without
      # `make lint-deps` the run fails on syntax-check[unknown-module]
      # (ansible.posix.synchronize).
      - id: ansible-lint
        name: Lint Ansible Files
        entry: env ANSIBLE_HOME=.cache/ansible-lint ANSIBLE_COLLECTIONS_PATH=.cache/ansible-lint/collections uv run --locked --no-build ansible-lint -v --force-color --profile=production --offline
        language: system
        files: \.(yaml|yml)$
        pass_filenames: false

      - id: ruff
        name: Ruff Linter
        entry: uv run --locked --no-build ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: Ruff Formatter
        entry: uv run --locked --no-build ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: detect-secrets
        name: Detect Secrets
        entry: uv run --locked --no-build detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: package-lock.json

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # frozen: v0.10.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck

  # The only hadolint: ci.yml's Dockerfile Lint job, the Makefile's docker run
  # and quality.yml's hadolint-action each pinned one of their own, and a
  # parity script kept two of them in step. This one lints every Dockerfile in
  # the tree, Dockerfile.podman and .devcontainer/ included, at hadolint's
  # default failure threshold (info), stricter than the `error` the CI job used.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # frozen: v2.15.1
    hooks:
      - id: hadolint
        name: Hadolint (Dockerfile Linter)

  # These run the terraform and tflint on PATH. CI installs the versions the
  # terraform image ships (devcontainers/terraform/Dockerfile, through
  # scripts/derive-toolchain-versions.sh), as that dev container has them.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 443ffdff1cc1663b701ae73e7459029fe883455a  # frozen: v1.109.3
    hooks:
      - id: terraform_fmt
        name: Terraform Format
      - id: terraform_validate
        name: Terraform Validate
      - id: terraform_tflint
        name: Terraform TFLint


# Configuration
default_language_version:
  python: python3

fail_fast: false  # Continue checking all hooks even if one fails
minimum_pre_commit_version: '3.0.0'
