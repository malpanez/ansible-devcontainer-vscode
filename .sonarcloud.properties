# SonarCloud runs here as automatic analysis, which reads only this file
# and only a handful of keys; it cannot silence a single rule.
#
# Dockerfiles are excluded because docker:S8431 ("use the tag or the
# digest, not both") fires on every pinned FROM line, and tag@digest is
# deliberate: the digest is what resolves, the tag is what Renovate tracks.
# Each weekly digest bump re-raised it as new code and failed the Quality
# Gate on that pull request. Dockerfiles stay linted by hadolint in
# pre-commit, in ci.yml (Dockerfile Lint) and in quality.yml.
sonar.exclusions=**/Dockerfile*
